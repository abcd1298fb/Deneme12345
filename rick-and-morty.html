<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House of the Dragon - Bölümler</title>
    <!-- Video.js Güncel CDN Stili -->
    <link href="https://vjs.zencdn.net/8.16.1/video-js.css" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0a0505;
            --surface: rgba(25, 10, 10, 0.45);
            --surface-hover: rgba(45, 15, 15, 0.6);
            --accent: #e50914;
            --text: #ffffff;
            --muted: #b3b3b3;
        }
        html { scroll-behavior: smooth; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Manrope', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 90px;
            position: relative;
        }

        /* Atmosfer / Kırmızı Loş Işık */
        body::before {
            content: '';
            position: fixed;
            top: -150px; left: 50%;
            transform: translateX(-50%);
            width: 700px; height: 350px;
            background: radial-gradient(ellipse, rgba(229, 9, 20, 0.22) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -100px; right: -100px;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(180, 0, 10, 0.12) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* Navbar */
        nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            height: 65px;
            background: rgba(15, 5, 5, 0.65);
            display: flex; align-items: center;
            justify-content: space-between;
            padding: 0 4%;
            border-bottom: 1px solid rgba(229, 9, 20, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .nav-logo {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 28px; font-weight: 900; letter-spacing: 2px;
            color: var(--accent);
            text-decoration: none;
            text-shadow: 0 0 15px rgba(229, 9, 20, 0.7);
        }

        /* Ana İçerik Alanı */
        .container {
            padding: 95px 4% 30px 4%;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Logo Alanı ve Animasyonlar */
        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }
        .hotd-logo {
            max-width: 280px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 20px rgba(229, 9, 20, 0.4));
        }
        @keyframes zoomInOutInfinite {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }
        @keyframes zoomInOutOnce {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        .logo-infinite {
            animation: zoomInOutInfinite 3s infinite ease-in-out;
        }
        .logo-once {
            animation: zoomInOutOnce 3s 1 ease-in-out;
        }

        .header-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        h1 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #fff;
        }

        .season-selector-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .season-selector-wrapper label {
            font-size: 14px;
            color: var(--muted);
            font-weight: 600;
        }

        select {
            background: rgba(25, 10, 10, 0.8);
            color: #fff;
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid rgba(229, 9, 20, 0.3);
            font-size: 14px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        select:hover, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.2);
        }

        /* OYNATICI ALANI */
        #activePlayerSection {
            display: none;
            margin-bottom: 30px;
            background: rgba(20, 8, 8, 0.85);
            border: 1px solid rgba(229, 9, 20, 0.4);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(229, 9, 20, 0.15);
        }

        .inline-player-box {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Oran */
            background: #000;
        }

        .video-js {
            position: absolute;
            top: 0; left: 0;
            width: 100% !important;
            height: 100% !important;
            background-color: #000;
        }
        .vjs-play-progress {
            background: var(--accent) !important;
        }

        .inline-player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: linear-gradient(180deg, rgba(30,10,10,0.8) 0%, rgba(15,5,5,0.95) 100%);
            border-bottom: 1px solid rgba(229, 9, 20, 0.2);
        }

        .inline-player-title h3 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 22px;
            color: #fff;
        }

        .inline-player-title p {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }

        .close-player-btn {
            background: rgba(229, 9, 20, 0.2);
            border: 1px solid rgba(229, 9, 20, 0.4);
            color: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .close-player-btn:hover {
            background: var(--accent);
        }

        /* Bölümler Arası Geçiş Butonları */
        .inline-player-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 15px;
            background: rgba(10, 5, 5, 0.95);
            border-top: 1px solid rgba(229, 9, 20, 0.2);
        }
        .inline-player-controls button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(229, 9, 20, 0.3);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .inline-player-controls button:hover {
            background: var(--accent);
            border-color: #fff;
        }

        /* Bölüm Grid Yapısı */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--surface);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
            position: relative;
        }

        .card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: rgba(229, 9, 20, 0.5);
            background: var(--surface-hover);
            box-shadow: 0 16px 45px rgba(229, 9, 20, 0.25);
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-bottom: 1px solid rgba(229, 9, 20, 0.2);
        }

        /* IMDb Puan Rozeti */
        .imdb-badge {
            position: absolute;
            top: 10px; right: 10px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(245, 197, 24, 0.4);
            color: #f5c518;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .info {
            padding: 15px;
            background: linear-gradient(180deg, transparent 0%, rgba(10,5,5,0.95) 100%);
        }

        h3 {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        p {
            font-size: 11px;
            color: var(--muted);
        }

        /* 3D Alt Navigasyon Barı */
        .bottom-nav-wrapper {
            position: fixed;
            bottom: 15px; left: 0; right: 0;
            display: flex;
            justify-content: center;
            z-index: 1500;
            padding: 0 16px;
            pointer-events: none;
        }

        .bottom-nav {
            pointer-events: auto;
            width: 100%;
            max-width: 420px;
            height: 64px;
            background: rgba(20, 8, 8, 0.6);
            border: 1px solid rgba(229, 9, 20, 0.25);
            border-radius: 22px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 25px rgba(229, 9, 20, 0.15);
            padding: 0 8px;
        }

        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            color: var(--muted);
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            transition: all 0.3s;
            padding: 6px 14px;
            border-radius: 14px;
        }

        .bottom-nav-item svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .bottom-nav-item:hover { color: #fff; }

        .bottom-nav-item.active {
            color: #ffffff;
            background: linear-gradient(180deg, #ff1e27 0%, #a00008 100%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 6px 20px rgba(229, 9, 20, 0.7);
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="nav-left">
            <a class="nav-logo" href="index.html">FATBOK</a>
        </div>
    </nav>

    <!-- İçerik -->
    <div class="container">
        <!-- Logo Alanı -->
        <div class="logo-container">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b1/Rick_and_Morty.svg/500px-Rick_and_Morty.svg.png?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail" 
                 id="hotd-main-logo" class="hotd-logo logo-infinite" alt="Rick and Morty Logo">
        </div>

        <div class="header-section">
            <h1>Rick and Morty</h1>
            <div class="season-selector-wrapper">
                <label for="season-select">Sezon:</label>
                <select id="season-select" onchange="updateEpisodes()">
                    <option value="1">1. Sezon</option>
                    <option value="2">2. Sezon</option>
                    <option value="3">3. Sezon</option>
                    <option value="4">4. Sezon</option>
                    <option value="5">5. Sezon</option>
                    <option value="6">6. Sezon</option>
                    <option value="7">7. Sezon</option>
                    <option value="8">8. Sezon</option>
                    <option value="9">9. Sezon</option>
                </select>
            </div>
        </div>

        <!-- ÜST OYNATICI ALANI -->
        <div id="activePlayerSection">
            <div class="inline-player-header">
                <div class="inline-player-title">
                    <h3 id="activeTitle">Bölüm Adı</h3>
                    <p id="activeSub">Sezon Bilgisi</p>
                </div>
                <button class="close-player-btn" onclick="stopPlayer()">Kapat ✕</button>
            </div>
            <div class="inline-player-box">
                <video id="hotd-player" class="video-js vjs-big-play-button-centered" controls preload="auto" data-setup='{}'>
                    <p class="vjs-no-js">Tarayıcınız video oynatmayı desteklemiyor.</p>
                </video>
            </div>
            <!-- Önceki / Sonraki Bölüm Butonları -->
            <div class="inline-player-controls">
                <button onclick="changeEpisode(-1)">◀ Önceki Bölüm</button>
                <button onclick="changeEpisode(1)">Sonraki Bölüm ▶</button>
            </div>
        </div>

        <div id="episodes" class="grid"></div>
    </div>

    <!-- Alt Navigasyon Barı -->
    <div class="bottom-nav-wrapper">
        <div class="bottom-nav">
            <a href="index.html" class="bottom-nav-item">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                Anasayfa
            </a>
            <a href="filmler.html" class="bottom-nav-item">
                <svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg>
                Filmler
            </a>
            <a href="diziler.html" class="bottom-nav-item active">
                <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
                Diziler
            </a>
        </div>
    </div>

    <!-- Video.js Script -->
    <script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>
    <script>
        let player = null;
        let currentSeason = "1";
        let currentIndex = 0;

        const hotdData = {
            "1": [
               { title: "Pilot", imdb: "8.0", stream: "https://s231.rapidrame.com/hls2/01/00019/2otg4wpmc3sj_,l,.urlset/master.m3u8?t=N71zl4g4r96IHkBEnK38awKTld5mjD3LUTEA_tauh3k&s=1786220710&e=14400&f=98845&srv=s429&i=0.0&sp=0&n=fk236amicaefjevo&p1=s231&p2=s231" },
               { title: "Lawnmower Dog", imdb: "8.1", stream: "https://vs14.photofunny.org/v/Rick.and.Morty.S01E02.WEB-DL.1080p.DUAL.H.264-HDM/master.m3u8" },
               { title: "Anatomy Park", imdb: "8.1", stream: "https://vs13.pictureflix.org/v/Rick.and.Morty.S01E03.WEB-DL.1080p.DUAL.H.264-HDM/master.m3u8" },
               { title: "M. Night Shaym-Aliens!", imdb: "8.5", stream: "https://vs18.pictureflix.org/v/Rick.and.Morty.S01E04.WEB-DL.1080p.DUAL.H.264-HDM/master.m3u8" },
               { title: "Meeseeks and Destroy", imdb: "8.8", stream: "https://vs19.photofunny.org/v/Rick.and.Morty.S01E05.WEB-DL.1080p.DUAL.H.264-HDM/master.m3u8" },
               { title: "Rick Potion #9", imdb: "9.2", stream: "https://vs17.photomag.biz/v/Rick.and.Morty.S01E06.WEB-DL.1080p.DUAL.H.264-HDM/master.m3u8" },
               { title: "Raising Gazorpazorp", imdb: "8.0", stream: "https://vs18.photofunny.org/v/Rick.and.Morty.S01E07.WEB-DL.1080p.DUAL.H.264-HDM/master.m3u8" },
               { title: "Rixty Minutes", imdb: "9.0", stream: "https://vs10.pictureflix.org/v/Rick.and.Morty.S01E08.WEB-DL.1080p.DUAL.H.264-HDM/master.m3u8" },
               { title: "Something Ricked This Way Comes", imdb: "8.5", stream: "https://vs10.pictureflix.org/v/Rick.and.Morty.S01E09.WEB-DL.1080p.DUAL.H.264-HDM/master.m3u8" },
               { title: "Close Rick-counters of the Rick Kind", imdb: "9.3", stream: "https://vs10.pictureflix.org/v/Rick.and.Morty.S01E10.WEB-DL.1080p.DUAL.H.264-HDM/master.m3u8" },
               { title: "Ricksy Business", imdb: "8.5", stream: "https://vs10.pictureflix.org/v/Rick.and.Morty.S01E11.WEB-DL.1080p.DUAL.H.264-HDM/master.m3u8" }
            ],
            "2": [
               { title: "A Rickle in Time", imdb: "8.4", stream: "https://vs10.photoflick.org/v/Rick.and.Morty.S02E01.WEB-DL.1080p.DUAL.H.264-HDM/master.m3u8" },
               { title: "Mortynight Run", imdb: "8.9", stream: "https://vs14.photoflix.org/v/Rick.and.Morty.S02E02.WEB-DL.1080p.DUAL.H.264-HDM/master.m3u8" },
               { title: "Auto Erotic Assimilation", imdb: "8.9", stream: "https://vs14.pictureflix.org/v/Rick.and.Morty.S02E03.WEB-DL.1080p.DUAL.H.264-HDM/master.m3u8" },
               { title: "Total Rickall", imdb: "9.5", stream: "https://vs16.photofunny.org/v/Rick.and.Morty.S02E04.WEB-DL.1080p.DUAL.H.264-HDM/master.m3u8" },
               { title: "Get Schwifty", imdb: "8.3", stream: "https://vs14.pictureflix.org/v/Rick.and.Morty.S02E05.WEB-DL.1080p.DUAL.H.264-HDM/master.m3u8" },
               { title: "The Ricks Must Be Crazy", imdb: "9.1", stream: "https://vs14.pictureflix.org/v/Rick.and.Morty.S02E06.WEB-DL.1080p.DUAL.H.264-HDM/master.m3u8" },
               { title: "Big Trouble in Little Sanchez", imdb: "8.7", stream: "https://vs14.pictureflix.org/v/Rick.and.Morty.S02E07.WEB-DL.1080p.DUAL.H.264-HDM/master.m3u8" },
               { title: "Interdimensional Cable 2: Tempting Fate", imdb: "7.7", stream: "https://vs14.pictureflix.org/v/Rick.and.Morty.S02E08.WEB-DL.1080p.DUAL.H.264-HDM/master.m3u8" },
               { title: "Look Who's Purging Now", imdb: "8.7", stream: "https://vs14.pictureflix.org/v/Rick.and.Morty.S02E09.WEB-DL.1080p.DUAL.H.264-HDM/master.m3u8" },
               { title: "The Wedding Squanchers", imdb: "9.3", stream: "https://vs14.pictureflix.org/v/Rick.and.Morty.S02E10.WEB-DL.1080p.DUAL.H.264-HDM/master.m3u8" }
           ],
           "3": [
                { title: "Salt and Sea, Fire and Blood", imdb: "9.2", stream: "" },
                { title: "Queen's Landing", imdb: "9.3", stream: "" },
                { title: "Rhaenyra Triumphant", imdb: "8.2", stream: "" },
                { title: "Tumbleton", imdb: "7.5", stream: "" },
                { title: "Unbowed and Unbent", imdb: "7.7", stream: "" },
                { title: "Faceless Men", imdb: "7.7", stream: "" },
                { title: "The Dragon in Winter", imdb: "8.3", stream: "" },
                { title: "Episode 8", imdb: "8.0", stream: "" }
            ]
        };
        const coverImage = "https://images8.alphacoders.com/114/thumb-1920-1148255.jpg";

        function updateEpisodes() {
            const season = document.getElementById('season-select').value;
            const container = document.getElementById('episodes');
            container.innerHTML = '';
            
            hotdData[season].forEach((ep, index) => {
                const subText = `${season}. Sezon ${index + 1}. Bölüm`;
                container.innerHTML += `
                    <div class="card" onclick="playEpisode('${ep.stream}', '${ep.title}', '${subText}', '${season}', ${index})">
                        <div class="imdb-badge">★ ${ep.imdb}</div>
                        <img src="${coverImage}" alt="Episode Cover">
                        <div class="info">
                            <h3>${ep.title}</h3>
                            <p>${subText}</p>
                        </div>
                    </div>
                `;
            });
        }

        function playEpisode(streamUrl, title, subText, season, index) {
            if (!streamUrl) {
                alert("Bu bölümün yayını henüz eklenmedi!");
                return;
            }

            // Logo animasyonunu tetikle (3 sn boyunca hızlı zoom-in/out)
            const logo = document.getElementById('hotd-main-logo');
            logo.classList.remove('logo-infinite');
            logo.classList.add('logo-once');
            
            setTimeout(() => {
                logo.classList.remove('logo-once');
                logo.classList.add('logo-infinite');
            }, 3000);

            currentSeason = season;
            currentIndex = index;

            document.getElementById('activeTitle').innerText = title;
            document.getElementById('activeSub').innerText = subText;
            
            const playerSection = document.getElementById('activePlayerSection');
            playerSection.style.display = 'block';
            playerSection.scrollIntoView({ behavior: 'smooth', block: 'start' });

            if (!player) {
                player = videojs('hotd-player');
            }
            
            player.src({
                src: streamUrl,
                type: 'application/x-mpegURL'
            });
            
            player.ready(function() {
                player.play();
            });
        }

        function changeEpisode(step) {
            const episodes = hotdData[currentSeason];
            let newIndex = currentIndex + step;

            if (newIndex >= 0 && newIndex < episodes.length) {
                const ep = episodes[newIndex];
                const subText = `${currentSeason}. Sezon ${newIndex + 1}. Bölüm`;
                playEpisode(ep.stream, ep.title, subText, currentSeason, newIndex);
            } else {
                alert("Bu sezonda başka bölüm yok!");
            }
        }

        function stopPlayer() {
            if (player) {
                player.pause();
                player.src("");
            }
            document.getElementById('activePlayerSection').style.display = 'none';
        }
        
        updateEpisodes();
    </script>
</body>
                                             </html>
