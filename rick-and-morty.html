<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty - Netflix Tarzı</title>
    <!-- ArtPlayer CDN Stili -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #141414;
            --surface: rgba(30, 30, 30, 0.6);
            --surface-hover: rgba(50, 50, 50, 0.8);
            --accent: #e50914; /* Netflix Kırmızısı */
            --text: #ffffff;
            --muted: #b3b3b3;
        }
        html { scroll-behavior: smooth; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 90px;
        }

        /* Netflix Tarzı Üst Navbar */
        nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            height: 65px;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(20,20,20,0.5) 100%);
            display: flex; align-items: center;
            justify-content: space-between;
            padding: 0 4%;
            backdrop-filter: blur(10px);
        }
        .nav-logo {
            font-size: 26px; font-weight: 900; letter-spacing: 2px;
            color: var(--accent);
            text-decoration: none;
            text-shadow: 0 0 10px rgba(229, 9, 20, 0.5);
        }

        .container {
            padding: 95px 4% 30px 4%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }
        .rm-logo {
            max-width: 320px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 20px rgba(229, 9, 20, 0.4));
        }

        @keyframes zoomInOutInfinite {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        @keyframes zoomInOutOnce {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        .logo-infinite { animation: zoomInOutInfinite 3s infinite ease-in-out; }
        .logo-once { animation: zoomInOutOnce 3s 1 ease-in-out; }

        .header-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
        }

        .season-selector-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .season-selector-wrapper label {
            font-size: 14px;
            color: var(--muted);
            font-weight: 600;
        }

        select {
            background: rgba(30, 30, 30, 0.9);
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 14px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            transition: all 0.3s;
        }
        select:hover, select:focus {
            border-color: var(--accent);
        }

        /* Netflix Tarzı Oynatıcı Alanı */
        #activePlayerSection {
            display: none;
            margin-bottom: 30px;
            background: #000;
            border: 1px solid rgba(229, 9, 20, 0.4);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }

        .inline-player-box {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 */
            background: #000;
        }

        #artplayer-container {
            position: absolute;
            top: 0; left: 0;
            width: 100% !important;
            height: 100% !important;
        }

        .inline-player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #181818;
            border-bottom: 1px solid #333;
        }

        .inline-player-title h3 {
            font-size: 18px;
            color: #fff;
        }

        .inline-player-title p {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }

        .close-player-btn {
            background: rgba(229, 9, 20, 0.2);
            border: 1px solid var(--accent);
            color: #fff;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .close-player-btn:hover {
            background: var(--accent);
        }

        .inline-player-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 15px;
            background: #181818;
            border-top: 1px solid #333;
        }
        .inline-player-controls button {
            background: #333;
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .inline-player-controls button:hover {
            background: var(--accent);
        }

        /* Grid / Kart Tasarımı */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: #222;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .card:hover {
            transform: scale(1.04);
            box-shadow: 0 10px 25px rgba(229, 9, 20, 0.3);
            border-color: rgba(229, 9, 20, 0.5);
            z-index: 10;
        }

        .card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }

        .imdb-badge {
            position: absolute;
            top: 10px; right: 10px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(245, 197, 24, 0.4);
            color: #f5c518;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 800;
        }

        .info {
            padding: 12px;
            background: #181818;
        }

        h3 {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        p {
            font-size: 11px;
            color: var(--muted);
        }

        /* Alt Navigasyon */
        .bottom-nav-wrapper {
            position: fixed; bottom: 15px; left: 0; right: 0;
            display: flex; justify-content: center; z-index: 1500; pointer-events: none;
        }
        .bottom-nav {
            pointer-events: auto; max-width: 400px; width: 100%; height: 60px;
            background: rgba(20, 20, 20, 0.85); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 30px; display: flex; justify-content: space-around; align-items: center;
            backdrop-filter: blur(15px); box-shadow: 0 15px 30px rgba(0,0,0,0.8);
        }
        .bottom-nav-item {
            color: var(--muted); text-decoration: none; font-size: 11px; font-weight: 600;
            display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 12px; border-radius: 20px; transition: 0.3s;
        }
        .bottom-nav-item svg { width: 18px; height: 18px; fill: currentColor; }
        .bottom-nav-item:hover { color: #fff; }
        .bottom-nav-item.active { color: #fff; background: var(--accent); }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <a class="nav-logo" href="#">NETFLIX</a>
    </nav>

    <!-- İçerik -->
    <div class="container">
        <!-- Logo Alanı -->
        <div class="logo-container">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b1/Rick_and_Morty.svg/500px-Rick_and_Morty.svg.png" 
                 id="rm-main-logo" class="rm-logo logo-infinite" alt="Rick and Morty Logo">
        </div>

        <div class="header-section">
            <h1>Rick and Morty</h1>
            <div class="season-selector-wrapper">
                <label for="season-select">Sezon:</label>
                <select id="season-select" onchange="updateEpisodes()">
                    <option value="1">1. Sezon</option>
                    <option value="2">2. Sezon</option>
                    <option value="3">3. Sezon</option>
                    <option value="4">4. Sezon</option>
                    <option value="5">5. Sezon</option>
                    <option value="6">6. Sezon</option>
                    <option value="7">7. Sezon</option>
                    <option value="8">8. Sezon</option>
                    <option value="9">9. Sezon</option>
                </select>
            </div>
        </div>

        <!-- OYNATICI ALANI -->
        <div id="activePlayerSection">
            <div class="inline-player-header">
                <div class="inline-player-title">
                    <h3 id="activeTitle">Bölüm Adı</h3>
                    <p id="activeSub">Sezon Bilgisi</p>
                </div>
                <button class="close-player-btn" onclick="stopPlayer()">Kapat ✕</button>
            </div>
            <div class="inline-player-box">
                <div id="artplayer-container"></div>
            </div>
            <div class="inline-player-controls">
                <button onclick="changeEpisode(-1)">◀ Önceki</button>
                <button onclick="changeEpisode(1)">Sonraki ▶</button>
            </div>
        </div>

        <div id="episodes" class="grid"></div>
    </div>

    <!-- Alt Navigasyon -->
    <div class="bottom-nav-wrapper">
        <div class="bottom-nav">
            <a href="#" class="bottom-nav-item">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                Ana Sayfa
            </a>
            <a href="#" class="bottom-nav-item">
                <svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg>
                Filmler
            </a>
            <a href="#" class="bottom-nav-item active">
                <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
                Diziler
            </a>
        </div>
    </div>

    <!-- HLS ve ArtPlayer Scriptleri -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
    <script>
        let art = null;
        let currentSeason = "1";
        let currentIndex = 0;

        const rmData = {
            "1": [
               { title: "Pilot", imdb: "8.0", stream: "https://s231.rapidrame.com/hls2/01/00019/2otg4wpmc3sj_,l,.urlset/master.m3u8" },
               { title: "Lawnmower Dog", imdb: "8.1", stream: "https://vs14.photofunny.org/v/Rick.and.Morty.S01E02.WEB-DL.1080p.DUAL.H.264-HDM/master.m3u8" },
               { title: "Anatomy Park", imdb: "8.1", stream: "" },
               { title: "M. Night Shaym-Aliens!", imdb: "8.5", stream: "" },
               { title: "Meeseeks and Destroy", imdb: "8.8", stream: "" },
               { title: "Rick Potion #9", imdb: "9.2", stream: "" },
               { title: "Raising Gazorpazorp", imdb: "8.0", stream: "" },
               { title: "Rixty Minutes", imdb: "9.0", stream: "" },
               { title: "Something Ricked This Way Comes", imdb: "8.5", stream: "" },
               { title: "Close Rick-counters of the Rick Kind", imdb: "9.3", stream: "" },
               { title: "Ricksy Business", imdb: "8.5", stream: "" }
            ],
            "2": [
               { title: "A Rickle in Time", imdb: "8.4", stream: "" },
               { title: "Mortynight Run", imdb: "8.9", stream: "" },
               { title: "Auto Erotic Assimilation", imdb: "8.9", stream: "" },
               { title: "Total Rickall", imdb: "9.5", stream: "" },
               { title: "Get Schwifty", imdb: "8.3", stream: "" },
               { title: "The Ricks Must Be Crazy", imdb: "9.1", stream: "" },
               { title: "Big Trouble in Little Sanchez", imdb: "8.7", stream: "" },
               { title: "Interdimensional Cable 2", imdb: "7.7", stream: "" },
               { title: "Look Who's Purging Now", imdb: "8.7", stream: "" },
               { title: "The Wedding Squanchers", imdb: "9.3", stream: "" }
           ],
           "3": Array.from({length: 10}, (_, i) => ({title: `Bölüm ${i+1}`, imdb: "8.5", stream: ""})),
           "4": Array.from({length: 10}, (_, i) => ({title: `Bölüm ${i+1}`, imdb: "8.2", stream: ""})),
           "5": Array.from({length: 10}, (_, i) => ({title: `Bölüm ${i+1}`, imdb: "7.9", stream: ""})),
           "6": Array.from({length: 10}, (_, i) => ({title: `Bölüm ${i+1}`, imdb: "8.3", stream: ""})),
           "7": Array.from({length: 10}, (_, i) => ({title: `Bölüm ${i+1}`, imdb: "8.0", stream: ""})),
           "8": Array.from({length: 10}, (_, i) => ({title: `Bölüm ${i+1}`, imdb: "8.0", stream: ""})),
           "9": Array.from({length: 10}, (_, i) => ({title: `Bölüm ${i+1}`, imdb: "8.0", stream: ""}))
        };
        const coverImage = "https://images8.alphacoders.com/114/thumb-1920-1148255.jpg";

        function updateEpisodes() {
            const season = document.getElementById('season-select').value;
            const container = document.getElementById('episodes');
            container.innerHTML = '';
            
            rmData[season].forEach((ep, index) => {
                const subText = `${season}. Sezon ${index + 1}. Bölüm`;
                container.innerHTML += `
                    <div class="card" onclick="playEpisode('${ep.stream}', '${ep.title}', '${subText}', '${season}', ${index})">
                        <div class="imdb-badge">★ ${ep.imdb}</div>
                        <img src="${coverImage}" alt="Cover">
                        <div class="info">
                            <h3>${ep.title}</h3>
                            <p>${subText}</p>
                        </div>
                    </div>
                `;
            });
        }

        function playEpisode(streamUrl, title, subText, season, index) {
            if (!streamUrl) {
                alert("Bu bölümün yayını henüz eklenmedi!");
                return;
            }

            const logo = document.getElementById('rm-main-logo');
            logo.classList.remove('logo-infinite');
            logo.classList.add('logo-once');
            setTimeout(() => {
                logo.classList.remove('logo-once');
                logo.classList.add('logo-infinite');
            }, 3000);

            currentSeason = season;
            currentIndex = index;

            document.getElementById('activeTitle').innerText = title;
            document.getElementById('activeSub').innerText = subText;
            
            const playerSection = document.getElementById('activePlayerSection');
            playerSection.style.display = 'block';
            playerSection.scrollIntoView({ behavior: 'smooth', block: 'start' });

            if (art) {
                art.destroy(false);
            }

            art = new Artplayer({
                container: '#artplayer-container',
                url: streamUrl,
                volume: 0.8,
                autoplay: true,
                setting: true,
                fullscreen: true,
                miniProgressBar: true,
                theme: '#e50914',
                type: 'm3u8',
                customType: {
                    m3u8: function (video, url, art) {
                        if (Hls.isSupported()) {
                            const hls = new Hls();
                            hls.loadSource(url);
                            hls.attachMedia(video);
                            art.hls = hls;
                            art.on('destroy', () => hls.destroy());
                        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                            video.src = url;
                        }
                    },
                },
            });
        }

        function changeEpisode(step) {
            const episodes = rmData[currentSeason];
            let newIndex = currentIndex + step;

            if (newIndex >= 0 && newIndex < episodes.length) {
                const ep = episodes[newIndex];
                const subText = `${currentSeason}. Sezon ${newIndex + 1}. Bölüm`;
                playEpisode(ep.stream, ep.title, subText, currentSeason, newIndex);
            } else {
                alert("Bu sezonda başka bölüm yok!");
            }
        }

        function stopPlayer() {
            if (art) {
                art.destroy(false);
                art = null;
            }
            document.getElementById('activePlayerSection').style.display = 'none';
        }
        
        updateEpisodes();
    </script>
</body>
</html>
