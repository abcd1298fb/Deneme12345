<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>FATBOK - Filmler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0a0505;
            --surface: rgba(25, 10, 10, 0.45);
            --surface-hover: rgba(45, 15, 15, 0.6);
            --accent: #e50914;
            --text: #ffffff;
            --muted: #b3b3b3;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Manrope', sans-serif;
            min-height: 100vh;
            padding-bottom: 90px;
        }

        /* Atmosfer */
        body::before {
            content: ''; position: fixed; top: -150px; left: 50%;
            transform: translateX(-50%); width: 700px; height: 350px;
            background: radial-gradient(ellipse, rgba(229, 9, 20, 0.22) 0%, transparent 70%);
            z-index: -1; pointer-events: none;
        }

        /* Navbar */
        nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            height: 65px; background: rgba(15, 5, 5, 0.65);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 4%; border-bottom: 1px solid rgba(229, 9, 20, 0.15);
            backdrop-filter: blur(20px);
        }
        .nav-logo {
            font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 900;
            color: var(--accent); text-decoration: none;
        }

        /* Sayfa Başlığı */
        .page-header { padding: 95px 4% 20px 4%; }
        .page-title { font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 900; }

        /* İçerik Kartları */
        .content-rows { padding: 10px 4% 25px 4%; }
        .row-section { margin-bottom: 30px; }
        .row-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
        .row-container {
            display: flex; gap: 14px; overflow-x: auto; padding-bottom: 15px;
        }
        .card {
            min-width: 140px; height: 210px; background: var(--surface);
            border-radius: 12px; cursor: pointer; flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.07);
            transition: all 0.3s; background-size: cover;
        }
        .card:hover { transform: translateY(-6px) scale(1.04); border-color: var(--accent); }

        /* Alt Nav */
        .bottom-nav-wrapper {
            position: fixed; bottom: 15px; left: 0; right: 0;
            display: flex; justify-content: center; z-index: 1500; padding: 0 16px;
        }
        .bottom-nav {
            width: 100%; max-width: 420px; height: 64px;
            background: rgba(20, 8, 8, 0.6); border-radius: 22px;
            display: flex; justify-content: space-around; align-items: center;
            backdrop-filter: blur(20px); border: 1px solid rgba(229, 9, 20, 0.25);
        }
        .bottom-nav-item { color: var(--muted); text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; }
        .bottom-nav-item.active { color: #fff; background: var(--accent); padding: 6px 14px; border-radius: 14px; }
    </style>
</head>
<body>

    <nav>
        <a class="nav-logo" href="index.html">FATBOK</a>
    </nav>

    <div class="page-header">
        <h1 class="page-title">Popüler Filmler</h1>
    </div>

    <div class="content-rows">
        <div class="row-section">
            <div class="row-title">🎬 Trend Filmler</div>
            <div class="row-container">
                <div class="card" onclick="alert('Film Detayı')"></div>
                <div class="card" onclick="alert('Film Detayı')"></div>
            </div>
        </div>
    </div>

    <div class="bottom-nav-wrapper">
        <div class="bottom-nav">
            <a href="index.html" class="bottom-nav-item">Anasayfa</a>
            <a href="filmler.html" class="bottom-nav-item active">Filmler</a>
            <a href="diziler.html" class="bottom-nav-item">Diziler</a>
        </div>
    </div>

</body>
</html>
