<!DOCTYPE html>
<html lang="tr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CREX — Lig</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#02050a;
    --panel:#080e16;
    --panel2:#0c141e;

    --blue:#1595ff;
    --blue2:#62c0ff;

    --white:#f7fbff;
    --text:#dce5ef;
    --muted:#718096;

    --line:rgba(255,255,255,.075);

    --league:#1595ff;

    --ease:cubic-bezier(.16,1,.3,1);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;

    color:var(--text);

    font-family:"Manrope",sans-serif;

    background:
        radial-gradient(
            800px 500px at 0 -10%,
            color-mix(
                in srgb,
                var(--league) 16%,
                transparent
            ),
            transparent 65%
        ),
        radial-gradient(
            700px 500px at 100% 20%,
            rgba(40,80,255,.09),
            transparent 65%
        ),
        linear-gradient(
            180deg,
            #02050a,
            #050a11 45%,
            #02050a
        );
}

.ambient{
    position:fixed;

    width:520px;
    height:520px;

    left:-260px;
    top:10%;

    border-radius:50%;

    background:var(--league);

    filter:blur(150px);

    opacity:.07;

    pointer-events:none;

    z-index:-5;

    animation:
        ambientMove
        14s
        ease-in-out
        infinite
        alternate;
}

.ambient2{
    position:fixed;

    width:500px;
    height:500px;

    right:-260px;
    bottom:0;

    border-radius:50%;

    background:#315dff;

    filter:blur(160px);

    opacity:.06;

    pointer-events:none;

    z-index:-5;

    animation:
        ambientMove2
        16s
        ease-in-out
        infinite
        alternate;
}

@keyframes ambientMove{

    to{
        transform:
            translate(
                180px,
                -80px
            )
            scale(1.2);
    }

}

@keyframes ambientMove2{

    to{
        transform:
            translate(
                -120px,
                80px
            )
            scale(1.2);
    }

}

body::before{
    content:"";

    position:fixed;

    inset:0;

    z-index:-4;

    pointer-events:none;

    opacity:.14;

    background-image:
        linear-gradient(
            rgba(255,255,255,.018) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.018) 1px,
            transparent 1px
        );

    background-size:70px 70px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 85%
        );
}


/* HEADER */

.header{
    position:sticky;

    top:0;

    z-index:1000;

    height:74px;

    border-bottom:
        1px solid
        var(--line);

    background:
        rgba(
            2,
            6,
            11,
            .78
        );

    backdrop-filter:
        blur(25px)
        saturate(150%);

    -webkit-backdrop-filter:
        blur(25px)
        saturate(150%);
}

.header-inner{
    width:min(
        1480px,
        calc(100% - 40px)
    );

    height:100%;

    margin:auto;

    display:flex;

    align-items:center;

    gap:28px;
}

.logo{
    position:relative;

    color:#fff;

    text-decoration:none;

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size:40px;

    line-height:1;

    font-weight:900;

    letter-spacing:2px;
}

.logo span{
    color:var(--blue);
}

.logo::after{
    content:"";

    position:absolute;

    left:1px;

    bottom:-7px;

    width:30px;

    height:2px;

    border-radius:10px;

    background:var(--blue);

    box-shadow:
        0 0 14px
        var(--blue);
}

.main-nav{
    display:flex;

    align-items:center;

    gap:4px;

    flex:1;
}

.main-nav a{
    color:#718096;

    text-decoration:none;

    padding:11px 14px;

    border-radius:10px;

    font-size:10px;

    font-weight:900;

    transition:.3s var(--ease);
}

.main-nav a:hover,
.main-nav a.active{
    color:#fff;

    background:
        rgba(
            255,
            255,
            255,
            .04
        );
}

.search{
    width:245px;

    height:42px;

    display:flex;

    align-items:center;

    gap:10px;

    padding:0 14px;

    border:
        1px solid
        var(--line);

    border-radius:13px;

    background:
        rgba(
            255,
            255,
            255,
            .035
        );

    transition:
        .35s
        var(--ease);
}

.search:focus-within{
    border-color:
        color-mix(
            in srgb,
            var(--league) 45%,
            transparent
        );

    box-shadow:
        0 0 30px
        color-mix(
            in srgb,
            var(--league) 10%,
            transparent
        );
}

.search svg{
    width:16px;

    color:#68788d;

    flex:none;
}

.search input{
    width:100%;

    border:0;

    outline:0;

    color:#fff;

    background:transparent;

    font-family:inherit;

    font-size:10px;
}

.search input::placeholder{
    color:#59687b;
}


/* MAIN */

.main{
    width:min(
        1480px,
        calc(100% - 40px)
    );

    margin:
        42px auto 0;
}


/* LEAGUE HERO */

.league-hero{
    position:relative;

    min-height:255px;

    overflow:hidden;

    display:flex;

    align-items:center;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .075
        );

    border-radius:30px;

    background:
        linear-gradient(
            135deg,
            rgba(
                255,
                255,
                255,
                .055
            ),
            rgba(
                255,
                255,
                255,
                .012
            )
        );

    box-shadow:
        0 30px 80px
        rgba(
            0,
            0,
            0,
            .35
        );
}

.hero-bg{
    position:absolute;

    inset:0;

    overflow:hidden;
}

.hero-bg::before{
    content:"";

    position:absolute;

    width:550px;

    height:550px;

    right:-150px;

    top:-200px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            var(--league),
            transparent 68%
        );

    opacity:.18;

    filter:blur(15px);

    animation:
        heroPulse
        6s
        ease-in-out
        infinite
        alternate;
}

@keyframes heroPulse{

    to{
        transform:scale(1.2);

        opacity:.28;
    }

}

.hero-bg::after{
    content:"";

    position:absolute;

    width:130%;

    height:160px;

    left:-15%;

    top:55px;

    transform:rotate(-9deg);

    border-top:
        1px solid
        color-mix(
            in srgb,
            var(--league) 22%,
            transparent
        );

    border-bottom:
        1px solid
        color-mix(
            in srgb,
            var(--league) 12%,
            transparent
        );

    background:
        linear-gradient(
            90deg,
            transparent,
            color-mix(
                in srgb,
                var(--league) 8%,
                transparent
            ),
            transparent
        );
}

.hero-content{
    position:relative;

    z-index:3;

    width:100%;

    display:grid;

    grid-template-columns:
        170px
        1fr
        auto;

    align-items:center;

    gap:35px;

    padding:35px 45px;
}

.hero-logo-wrap{
    width:150px;

    height:150px;

    display:grid;

    place-items:center;

    position:relative;

    transform-style:preserve-3d;

    animation:
        floatingLogo
        5s
        ease-in-out
        infinite;
}

.hero-logo-wrap::before{
    content:"";

    position:absolute;

    inset:15px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            color-mix(
                in srgb,
                var(--league) 22%,
                transparent
            ),
            transparent 70%
        );

    filter:blur(15px);
}

.hero-logo{
    position:relative;

    width:140px;

    height:140px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 25px 25px
            rgba(
                0,
                0,
                0,
                .55
            )
        )
        drop-shadow(
            0 0 30px
            color-mix(
                in srgb,
                var(--league) 20%,
                transparent
            )
        );

    transition:
        .5s
        var(--ease);
}

.hero-logo-wrap:hover .hero-logo{
    transform:
        scale(1.08)
        rotateY(10deg)
        rotateZ(2deg);
}

@keyframes floatingLogo{

    0%,100%{
        transform:
            translateY(0)
            rotateZ(0);
    }

    50%{
        transform:
            translateY(-8px)
            rotateZ(-1deg);
    }

}

.hero-kicker{
    display:flex;

    align-items:center;

    gap:8px;

    margin-bottom:9px;

    color:#748399;

    font-size:9px;

    font-weight:900;

    letter-spacing:1.8px;
}

.hero-dot{
    width:6px;

    height:6px;

    border-radius:50%;

    background:var(--league);

    box-shadow:
        0 0 15px
        var(--league);

    animation:
        dotPulse
        1.5s
        infinite;
}

@keyframes dotPulse{

    50%{
        transform:scale(1.4);

        opacity:.5;
    }

}

.hero-title{
    color:#fff;

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size:72px;

    line-height:.82;

    font-weight:900;

    text-transform:uppercase;

    letter-spacing:-1px;
}

.hero-country{
    margin-top:14px;

    color:#728095;

    font-size:10px;

    font-weight:800;

    letter-spacing:1px;
}

.hero-stats{
    display:flex;

    gap:10px;
}

.stat{
    min-width:100px;

    padding:15px 17px;

    text-align:center;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .065
        );

    border-radius:15px;

    background:
        rgba(
            255,
            255,
            255,
            .025
        );
}

.stat strong{
    display:block;

    color:#fff;

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size:28px;

    font-weight:900;
}

.stat span{
    color:#66768a;

    font-size:7px;

    font-weight:900;

    letter-spacing:1px;
}


/* FILTERS */

.controls{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin-top:30px;

    margin-bottom:20px;
}

.filters{
    display:flex;

    gap:8px;

    overflow-x:auto;

    scrollbar-width:none;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filter{
    flex:none;

    padding:10px 16px;

    color:#68778a;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .065
        );

    border-radius:11px;

    background:
        rgba(
            255,
            255,
            255,
            .025
        );

    cursor:pointer;

    font-family:inherit;

    font-size:8px;

    font-weight:900;

    transition:
        .3s
        var(--ease);
}

.filter:hover,
.filter.active{
    color:#fff;

    border-color:
        color-mix(
            in srgb,
            var(--league) 40%,
            transparent
        );

    background:
        color-mix(
            in srgb,
            var(--league) 10%,
            transparent
        );

    box-shadow:
        0 8px 25px
        color-mix(
            in srgb,
            var(--league) 8%,
            transparent
        );
}

.result-count{
    flex:none;

    color:#58677a;

    font-size:8px;

    font-weight:900;
}


/* MATCH GRID */

.matches{
    display:grid;

    grid-template-columns:
        repeat(
            4,
            minmax(
                0,
                1fr
            )
        );

    gap:17px;
}


/* MATCH CARD */

.match-card{
    position:relative;

    min-height:315px;

    overflow:hidden;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .075
        );

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            #0b121b,
            #060a10
        );

    transition:
        transform
        .5s
        var(--ease),
        border-color
        .35s,
        box-shadow
        .5s;

    transform-style:preserve-3d;
}

.match-card::before{
    content:"";

    position:absolute;

    inset:0;

    opacity:0;

    background:
        radial-gradient(
            350px circle at
            var(--mx,50%)
            var(--my,50%),
            color-mix(
                in srgb,
                var(--league) 11%,
                transparent
            ),
            transparent 55%
        );

    transition:.3s;

    pointer-events:none;
}

.match-card:hover::before{
    opacity:1;
}

.match-card:hover{
    transform:
        translateY(-9px)
        scale(1.008);

    border-color:
        color-mix(
            in srgb,
            var(--league) 32%,
            transparent
        );

    box-shadow:
        0 35px 70px
        rgba(
            0,
            0,
            0,
            .5
        ),
        0 0 35px
        color-mix(
            in srgb,
            var(--league) 7%,
            transparent
        );
}

.card-glow{
    position:absolute;

    top:0;

    left:8%;

    right:8%;

    height:3px;

    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--league),
            transparent
        );

    transform:scaleX(.25);

    transition:
        .6s
        var(--ease);

    box-shadow:
        0 0 15px
        var(--league);
}

.match-card:hover .card-glow{
    transform:scaleX(1);
}

.match-content{
    position:relative;

    z-index:3;

    height:315px;

    padding:19px;

    display:flex;

    flex-direction:column;
}

.match-top{
    display:flex;

    justify-content:space-between;

    align-items:center;
}

.match-league-tag{
    padding:7px 9px;

    color:#8290a2;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .06
        );

    border-radius:8px;

    background:
        rgba(
            255,
            255,
            255,
            .025
        );

    font-size:8px;

    font-weight:900;
}

.match-status{
    display:flex;

    align-items:center;

    gap:6px;

    color:#45adff;

    font-size:8px;

    font-weight:900;

    letter-spacing:1px;
}

.match-status::before{
    content:"";

    width:5px;

    height:5px;

    border-radius:50%;

    background:#45adff;

    box-shadow:
        0 0 10px
        #45adff;
}


/* TEAMS */

.teams{
    flex:1;

    display:grid;

    grid-template-columns:
        1fr
        auto
        1fr;

    align-items:center;

    gap:10px;
}

.team{
    display:flex;

    flex-direction:column;

    align-items:center;

    gap:11px;
}

.team-logo{
    width:78px;

    height:78px;

    display:grid;

    place-items:center;

    color:#fff;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .09
        );

    border-radius:23px;

    background:
        linear-gradient(
            145deg,
            #1a2837,
            #070c13
        );

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size:17px;

    font-weight:900;

    box-shadow:
        0 20px 35px
        rgba(
            0,
            0,
            0,
            .45
        ),
        inset
        0 1px 1px
        rgba(
            255,
            255,
            255,
            .1
        );

    transition:
        .5s
        var(--ease);
}

.team-logo img{
    width:100%;

    height:100%;

    object-fit:contain;

    padding:10px;

    display:block;

}

.team-logo.text-logo{
    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size:17px;
}

.match-card:hover .team-logo{
    transform:
        translateY(-7px)
        scale(1.07);

    box-shadow:
        0 25px 35px
        rgba(
            0,
            0,
            0,
            .55
        ),
        0 0 22px
        color-mix(
            in srgb,
            var(--league) 10%,
            transparent
        );
}

.team-name{
    max-width:105px;

    color:#d6dfe9;

    text-align:center;

    font-size:9px;

    line-height:1.3;

    font-weight:800;
}

.vs{
    min-width:34px;
    padding:0 6px;
    height:34px;

    display:grid;

    place-items:center;

    color:#667589;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .065
        );

    border-radius:50%;

    background:
        rgba(
            255,
            255,
            255,
            .025
        );

    font-size:7px;

    font-weight:900;
    white-space:nowrap;
}

.match-bottom{
    display:flex;

    justify-content:space-between;

    align-items:center;

    padding-top:14px;

    border-top:
        1px solid
        rgba(
            255,
            255,
            255,
            .055
        );
}

.match-date{
    color:#68778a;

    font-size:8px;

    font-weight:800;

    line-height:1.4;
}

.watch-btn{
    display:flex;

    align-items:center;

    gap:7px;

    padding:9px 13px;

    color:#fff;

    text-decoration:none;

    border-radius:9px;

    background:
        linear-gradient(
            135deg,
            var(--league),
            #075fb6
        );

    box-shadow:
        0 8px 22px
        color-mix(
            in srgb,
            var(--league) 20%,
            transparent
        );

    font-size:8px;

    font-weight:900;

    transition:
        .35s
        var(--ease);
}

.watch-btn:hover{
    transform:
        translateY(-3px);

    box-shadow:
        0 14px 30px
        color-mix(
            in srgb,
            var(--league) 30%,
            transparent
        );
}


/* LOADING */

.loader{
    display:none;

    justify-content:center;

    align-items:center;

    padding:35px;
}

.loader.show{
    display:flex;
}

.loader-ring{
    width:35px;

    height:35px;

    border:
        3px solid
        rgba(
            255,
            255,
            255,
            .08
        );

    border-top-color:
        var(--league);

    border-radius:50%;

    animation:
        spin
        .8s
        linear
        infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}

.empty{
    display:none;

    padding:70px 20px;

    text-align:center;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .06
        );

    border-radius:22px;

    background:
        rgba(
            255,
            255,
            255,
            .02
        );
}

.empty.show{
    display:block;
}

.empty-icon{
    font-size:35px;

    margin-bottom:15px;

    opacity:.4;
}

.empty h3{
    color:#fff;

    font-size:16px;

}

.empty p{
    margin-top:7px;

    color:#68778a;

    font-size:9px;
}


/* FOOTER */

.footer{
    width:min(
        1480px,
        calc(100% - 40px)
    );

    margin:
        80px auto 25px;

    padding-top:25px;

    display:flex;

    justify-content:space-between;

    border-top:
        1px solid
        rgba(
            255,
            255,
            255,
            .055
        );

    color:#4f5d70;

    font-size:8px;
}

.footer-logo{
    color:#8593a4;

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size:25px;

    font-weight:900;

    letter-spacing:2px;
}


/* RESPONSIVE */

@media(max-width:1150px){

    .matches{
        grid-template-columns:
            repeat(
                2,
                minmax(
                    0,
                    1fr
                )
            );
    }

    .hero-content{
        grid-template-columns:
            130px
            1fr;

        padding:30px;
    }

    .hero-logo-wrap{
        width:120px;

        height:120px;
    }

    .hero-logo{
        width:110px;

        height:110px;
    }

    .hero-stats{
        grid-column:1/-1;
    }

}

@media(max-width:760px){

    .header{
        height:62px;
    }

    .header-inner{
        width:
            calc(
                100% - 24px
            );

        gap:12px;
    }

    .logo{
        font-size:34px;
    }

    .main-nav{
        display:none;
    }

    .search{
        width:170px;

        height:38px;

        margin-left:auto;
    }

    .main{
        width:
            calc(
                100% - 24px
            );

        margin-top:25px;
    }

    .league-hero{
        min-height:350px;
    }

    .hero-content{
        display:flex;

        flex-direction:column;

        text-align:center;

        padding:30px 20px;
    }

    .hero-logo-wrap{
        width:110px;

        height:110px;
    }

    .hero-logo{

<script>


/* =========================================================
   CREX LIG SISTEMI
   =========================================================

   LOGO SISTEMI:

   Artik takimlar.json KULLANILMIYOR.

   Tum takim logolari dogrudan:

       maclar.json

   icindeki:

       evLogo
       depLogo

   alanlarindan alinir.

========================================================= */


/* =========================================================
   URL
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const leagueSlug =
    params.get("lig") ||
    "premier-league";


/* =========================================================
   LOGO CACHE VERSION
========================================================= */

const LOGO_VERSION =
    "20260829";


/* =========================================================
   LEAGUE DATABASE
========================================================= */

const leagues = {

    "premier-league":{
        name:"Premier League",
        country:"İngiltere",
        logo:"",
        color:"#9846d7"
    },

    "la-liga":{
        name:"La Liga",
        country:"İspanya",
        logo:"",
        color:"#ef4937"
    },

    "serie-a":{
        name:"Serie A",
        country:"İtalya",
        logo:"",
        color:"#168cff"
    },

    "bundesliga":{
        name:"Bundesliga",
        country:"Almanya",
        logo:"",
        color:"#e51c35"
    },

    "ligue-1":{
        name:"Ligue 1",
        country:"Fransa",
        logo:"",
        color:"#159fe8"
    },

    "super-lig":{
        name:"Süper Lig",
        country:"Türkiye",
        logo:"",
        color:"#e51d3b"
    },

    "champions-league":{
        name:"Champions League",
        country:"UEFA",
        logo:"",
        color:"#426dff"
    },

    "europa-league":{
        name:"Europa League",
        country:"UEFA",
        logo:"",
        color:"#ff7417"
    },

    "conference-league":{
        name:"Conference League",
        country:"UEFA",
        logo:"",
        color:"#18b98b"
    },

    "eredivisie":{
        name:"Eredivisie",
        country:"Hollanda",
        logo:"",
        color:"#ed5b21"
    }

};


const league =
    leagues[leagueSlug] ||
    leagues["premier-league"];


/* =========================================================
   THEME
========================================================= */

document.documentElement
    .style
    .setProperty(
        "--league",
        league.color
    );


/* =========================================================
   ELEMENTS
========================================================= */

const heroLogo =
    document.getElementById(
        "heroLogo"
    );

const leagueTitle =
    document.getElementById(
        "leagueTitle"
    );

const leagueCountry =
    document.getElementById(
        "leagueCountry"
    );

const matchGrid =
    document.getElementById(
        "matchGrid"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const empty =
    document.getElementById(
        "empty"
    );

const loader =
    document.getElementById(
        "loader"
    );

const resultCount =
    document.getElementById(
        "resultCount"
    );

const totalMatches =
    document.getElementById(
        "totalMatches"
    );

const upcomingMatches =
    document.getElementById(
        "upcomingMatches"
    );


/* =========================================================
   HERO
========================================================= */

document.title =
    "CREX — " +
    league.name;


if(league.logo){

    heroLogo.src =
        addLogoCache(
            league.logo
        );

    heroLogo.alt =
        league.name;

}
else{

    heroLogo.style.display =
        "none";

}


leagueTitle.textContent =
    league.name;


leagueCountry.textContent =
    league.country +
    " • CREX MAÇ MERKEZİ";


/* =========================================================
   DATA PATH
========================================================= */

const matchesJsonPath =
    "./data/maclar.json";


/* =========================================================
   DATA VARIABLES
========================================================= */

let allMatches = [];

let filteredMatches = [];

let currentFilter = "all";

let renderedCount = 0;

const PAGE_SIZE = 24;


/* =========================================================
   LOGO CACHE BUSTER
========================================================= */

function addLogoCache(url){

    if(!url)
        return "";


    const cleanUrl =
        String(url)
        .trim();


    if(!cleanUrl)
        return "";


    /*
       Data ve blob URL'lerine
       cache parametresi eklenmez.
    */

    if(
        cleanUrl.startsWith("data:") ||
        cleanUrl.startsWith("blob:")
    ){

        return cleanUrl;

    }


    const separator =
        cleanUrl.includes("?")
            ? "&"
            : "?";


    return (
        cleanUrl +
        separator +
        "v=" +
        LOGO_VERSION
    );

}


/* =========================================================
   NORMALIZE TEXT
========================================================= */

function normalizeText(value){

    return String(
        value ?? ""
    )
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .toLocaleLowerCase(
        "tr-TR"
    )
    .replaceAll("ı","i")
    .replaceAll("ş","s")
    .replaceAll("ğ","g")
    .replaceAll("ü","u")
    .replaceAll("ö","o")
    .replaceAll("ç","c")
    .replace(
        /[^a-z0-9]/g,
        ""
    );

}


/* =========================================================
   LOGO RESOLUTION
=========================================================

   ONEMLI:

   Logo artik takimlar.json'dan aranmaz.

   maclar.json:

       evLogo

   ve

       depLogo

   alanlari dogrudan kullanilir.

========================================================= */

function resolveMatchLogos(match){

    return {

        ...match,

        resolvedEvLogo:
            addLogoCache(
                match.evLogo ||
                ""
            ),

        resolvedDepLogo:
            addLogoCache(
                match.depLogo ||
                ""
            )

    };

}


/* =========================================================
   STATUS
========================================================= */

function getMatchStatus(match){

    const status =
        String(
            match.durum || ""
        )
        .trim()
        .toLocaleLowerCase(
            "tr-TR"
        );


    const finishedStatuses = [

        "ms",
        "tamamlandı",
        "tamamlandi",
        "finished",
        "bitti",
        "bitmiş",
        "bitmis"

    ];


    if(
        finishedStatuses.includes(
            status
        )
    ){

        return "finished";

    }


    const liveStatuses = [

        "canlı",
        "canli",
        "live",
        "yayında",
        "yayinda"

    ];


    if(
        liveStatuses.includes(
            status
        )
    ){

        return "live";

    }


    const upcomingStatuses = [

        "gelecek",
        "yaklaşıyor",
        "yaklasiyor",
        "upcoming",
        "scheduled"

    ];


    if(
        upcomingStatuses.includes(
            status
        )
    ){

        return "upcoming";

    }


    const date =
        getMatchDate(
            match
        );


    if(!date)
        return "upcoming";


    return date < new Date()
        ? "finished"
        : "upcoming";

}


/* =========================================================
   DATE
========================================================= */

function getMatchDate(match){

    if(!match.tarih)
        return null;


    const dateValue =
        String(
            match.tarih
        ).trim();


    if(!dateValue)
        return null;


    let dateString =
        dateValue;


    if(
        match.saat &&
        String(
            match.saat
        ).trim()
    ){

        dateString +=
            "T" +
            String(
                match.saat
            ).trim();

    }
    else{

        dateString +=
            "T23:59:59";

    }


    const date =
        new Date(
            dateString
        );


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return null;

    }


    return date;

}


/* =========================================================
   DATE FORMAT
========================================================= */

function formatDate(match){

    if(!match.tarih){

        return "TARİH YOK";

    }


    let result =
        formatSimpleDate(
            match.tarih
        );


    if(
        match.saat &&
        String(
            match.saat
        ).trim()
    ){

        result +=
            " • " +
            String(
                match.saat
            ).trim();

    }


    return result;

}


function formatSimpleDate(value){

    const date =
        new Date(
            String(value) +
            "T00:00:00"
        );


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return String(value);

    }


    return new Intl.DateTimeFormat(
        "tr-TR",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    ).format(date);

}


/* =========================================================
   LEAGUE CHECK
========================================================= */

function isCorrectLeague(match){

    const matchLeague =
        normalizeText(
            match.lig
        );


    const targetLeague =
        normalizeText(
            leagueSlug
        );


    return (
        matchLeague ===
        targetLeague
    );

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadMatches(){

    loader.classList.add(
        "show"
    );


    try{

        const matchesResponse =
            await fetch(
                matchesJsonPath,
                {
                    cache:"no-store"
                }
            );


        if(
            !matchesResponse.ok
        ){

            throw new Error(
                "maclar.json yüklenemedi: " +
                matchesResponse.status
            );

        }


        /*
           MACLAR JSON
        */

        const data =
            await matchesResponse.json();


        let matches;


        /*
           FORMAT 1

           [
              {...},
              {...}
           ]
        */

        if(
            Array.isArray(data)
        ){

            matches =
                data;

        }


        /*
           FORMAT 2

           {
              "matches":[...]
           }
        */

        else if(
            data &&
            Array.isArray(
                data.matches
            )
        ){

            matches =
                data.matches;

        }


        /*
           FORMAT 3

           {
              "maclar":[...]
           }
        */

        else if(
            data &&
            Array.isArray(
                data.maclar
            )
        ){

            matches =
                data.maclar;

        }


        else{

            throw new Error(
                "maclar.json formatı geçersiz."
            );

        }


        /*
           SECILEN LIG
        */

        allMatches =
            matches

            .filter(
                match =>
                    match &&
                    isCorrectLeague(
                        match
                    )
            )

            .filter(
                match =>
                    match.id !== undefined &&
                    match.id !== null
            )

            /*
               LOGOLAR DOGRUDAN
               MACLAR.JSON'DAN ALINIYOR.
            */

            .map(
                match =>
                    resolveMatchLogos(
                        match
                    )
            );


        updateStats();

        applyFilters();


        console.log(
            "================================="
        );

        console.log(
            "CREX MAÇ SISTEMI"
        );

        console.log(
            "Lig:",
            league.name
        );

        console.log(
            "Maç:",
            allMatches.length
        );

        console.log(
            "Logo kaynağı:",
            "maclar.json"
        );

        console.log(
            "Logo alanları:",
            "evLogo / depLogo"
        );

        console.log(
            "Logo cache version:",
            LOGO_VERSION
        );

        console.log(
            "================================="
        );


        /*
           LOGO KONTROLU
        */

        allMatches.forEach(
            match => {

                console.log(
                    `${match.evSahibi} =>`,
                    match.resolvedEvLogo ||
                    "EV LOGOSU YOK"
                );


                console.log(
                    `${match.deplasman} =>`,
                    match.resolvedDepLogo ||
                    "DEPLASMAN LOGOSU YOK"
                );

            }
        );

    }
    catch(error){

        console.error(
            "CREX Lig Hatası:",
            error
        );


        allMatches = [];

        filteredMatches = [];

        matchGrid.innerHTML = "";

        renderNextPage();


        leagueCountry.textContent =
            league.country +
            " • MAÇ VERİSİ BULUNAMADI";


        resultCount.textContent =
            "0 MAÇ";

    }
    finally{

        loader.classList.remove(
            "show"
        );

    }

}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

    const total =
        allMatches.length;


    const upcoming =
        allMatches.filter(
            match =>
                getMatchStatus(
                    match
                ) === "upcoming"
        ).length;


    totalMatches.textContent =
        total.toLocaleString(
            "tr-TR"
        );


    upcomingMatches.textContent =
        upcoming.toLocaleString(
            "tr-TR"
        );

}


/* =========================================================
   FILTERS
========================================================= */

function applyFilters(){

    const query =
        searchInput.value
        .trim()
        .toLocaleLowerCase(
            "tr-TR"
        );


    filteredMatches =
        allMatches.filter(
            match => {

                const status =
                    getMatchStatus(
                        match
                    );


                const filterOK =
                    currentFilter === "all" ||
                    status === currentFilter;


                if(!filterOK)
                    return false;


                if(!query)
                    return true;


                const searchable = [

                    match.evSahibi,
                    match.deplasman,

                    match.evKisa,
                    match.depKisa,

                    match.lig,
                    match.ligAdi,

                    match.hafta,

                    match.tarih,
                    match.saat,

                    match.skor,
                    match.durum

                ]
                .filter(Boolean)
                .join(" ")
                .toLocaleLowerCase(
                    "tr-TR"
                );


                return searchable.includes(
                    query
                );

            }
        );


    renderedCount = 0;

    matchGrid.innerHTML = "";

    renderNextPage();


    resultCount.textContent =
        filteredMatches.length
        .toLocaleString(
            "tr-TR"
        ) +
        " MAÇ";

}


/* =========================================================
   MATCH CARD
========================================================= */

function createMatchCard(match){

    const home =
        match.evSahibi ||
        "Ev Sahibi";


    const away =
        match.deplasman ||
        "Deplasman";


    const homeShort =
        match.evKisa ||
        getInitials(home);


    const awayShort =
        match.depKisa ||
        getInitials(away);


    /*
       LOGOLAR DOGRUDAN
       MACLAR.JSON'DAN GELIYOR.
    */

    const homeLogoUrl =
        match.resolvedEvLogo ||
        "";


    const awayLogoUrl =
        match.resolvedDepLogo ||
        "";


    const status =
        getMatchStatus(
            match
        );


    const matchId =
        match.id;


    const date =
        formatDate(
            match
        );


    const score =
        match.skor ||
        "";


    const card =
        document.createElement(
            "article"
        );


    card.className =
        "match-card";


    card.dataset.search =
        [
            home,
            away,
            league.name
        ].join(" ");


    let statusText;


    if(
        status === "finished"
    ){

        statusText =
            "TAMAMLANDI";

    }

    else if(
        status === "live"
    ){

        statusText =
            "CANLI";

    }

    else{

        statusText =
            "YAKLAŞIYOR";

    }


    /*
       EV LOGO
    */

    const homeLogoHTML =
        homeLogoUrl

        ? `

            <img
                src="${escapeAttr(
                    homeLogoUrl
                )}"
                alt="${escapeAttr(
                    home
                )}"
                loading="lazy"
                decoding="async"
                referrerpolicy="no-referrer"
                onerror="handleTeamLogoError(
                    this,
                    '${escapeJS(homeShort)}'
                )"
            >

        `

        : escapeHTML(
            homeShort
        );


    /*
       DEPLASMAN LOGO
    */

    const awayLogoHTML =
        awayLogoUrl

        ? `

            <img
                src="${escapeAttr(
                    awayLogoUrl
                )}"
                alt="${escapeAttr(
                    away
                )}"
                loading="lazy"
                decoding="async"
                referrerpolicy="no-referrer"
                onerror="handleTeamLogoError(
                    this,
                    '${escapeJS(awayShort)}'
                )"
            >

        `

        : escapeHTML(
            awayShort
        );


    card.innerHTML = `

        <div class="card-glow"></div>

        <div class="match-content">

            <div class="match-top">

                <div class="match-league-tag">

                    ${escapeHTML(
                        match.ligAdi ||
                        league.name
                    )}

                </div>

                <div class="match-status">

                    ${statusText}

                </div>

            </div>


            <div class="teams">

                <div class="team">

                    <div class="team-logo">

                        ${homeLogoHTML}

                    </div>

                    <div class="team-name">

                        ${escapeHTML(
                            home
                        )}

                    </div>

                </div>


                <div class="vs">
                    ${score ? escapeHTML(score) : 'VS'}
                </div>


                <div class="team">

                    <div class="team-logo">

                        ${awayLogoHTML}

                    </div>

                    <div class="team-name">

                        ${escapeHTML(
                            away
                        )}

                    </div>

                </div>

            </div>


            <div class="match-bottom">

                <div class="match-date">

                    ${escapeHTML(date)}

                </div>


                <a
                    href="mac.html?id=${encodeURIComponent(
                        String(matchId)
                    )}"
                    class="watch-btn"
                >

                    MAÇA GİT →

                </a>

            </div>

        </div>

    `;


    return card;

}


/* =========================================================
   LOGO ERROR
========================================================= */

function handleTeamLogoError(
    img,
    fallbackText
){

    if(!img)
        return;


    img.onerror =
        null;


    const parent =
        img.parentElement;


    if(!parent)
        return;


    img.remove();


    parent.classList.add(
        "text-logo"
    );


    parent.textContent =
        fallbackText ||
        "TEAM";

}


/* =========================================================
   PAGINATION
========================================================= */

function renderNextPage(){

    if(
        renderedCount >=
        filteredMatches.length
    ){

        if(
            filteredMatches.length === 0
        ){

            empty.classList.add(
                "show"
            );

        }

        else{

            empty.classList.remove(
                "show"
            );

        }

        return;

    }


    empty.classList.remove(
        "show"
    );


    const next =
        filteredMatches.slice(
            renderedCount,
            renderedCount +
            PAGE_SIZE
        );


    const fragment =
        document.createDocumentFragment();


    next.forEach(
        (
            match,
            index
        )=>{

            const card =
                createMatchCard(
                    match
                );


            fragment.appendChild(
                card
            );


            requestAnimationFrame(
                ()=>{

                    card.animate(
                        [
                            {
                                opacity:0,

                                transform:
                                    "translateY(22px) scale(.97)"
                            },

                            {
                                opacity:1,

                                transform:
                                    "translateY(0) scale(1)"
                            }
                        ],
                        {
                            duration:550,

                            delay:
                                Math.min(
                                    index * 45,
                                    350
                                ),

                            easing:
                                "cubic-bezier(.16,1,.3,1)",

                            fill:"both"
                        }
                    );

                }
            );

        }
    );


    matchGrid.appendChild(
        fragment
    );


    renderedCount +=
        next.length;

}


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    ()=>{
        applyFilters();
    }
);


/* =========================================================
   FILTER BUTTONS
========================================================= */

document
    .querySelectorAll(
        ".filter"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                ()=>{

                    document
                        .querySelectorAll(
                            ".filter"
                        )
                        .forEach(
                            btn =>
                                btn.classList.remove(
                                    "active"
                                )
                        );


                    button.classList.add(
                        "active"
                    );


                    currentFilter =
                        button.dataset.filter;


                    applyFilters();

                }
            );

        }
    );


/* =========================================================
   INFINITE SCROLL
========================================================= */

const infiniteObserver =
    new IntersectionObserver(
        entries => {

            entries.forEach(
                entry => {

                    if(
                        entry.isIntersecting
                    ){

                        renderNextPage();

                    }

                }
            );

        },
        {
            rootMargin:"500px"
        }
    );


const sentinel =
    document.createElement(
        "div"
    );


sentinel.style.height =
    "1px";


document
    .querySelector(
        "#matches"
    )
    .appendChild(
        sentinel
    );


infiniteObserver.observe(
    sentinel
);


/* =========================================================
   CARD LIGHT EFFECT
========================================================= */

document.addEventListener(
    "mousemove",
    event => {

        const card =
            event.target.closest(
                ".match-card"
            );


        if(!card)
            return;


        const rect =
            card.getBoundingClientRect();


        const x =
            (
                (
                    event.clientX -
                    rect.left
                )
                /
                rect.width
            ) * 100;


        const y =
            (
                (
                    event.clientY -
                    rect.top
                )
                /
                rect.height
            ) * 100;


        card.style.setProperty(
            "--mx",
            x + "%"
        );


        card.style.setProperty(
            "--my",
            y + "%"
        );

    },
    {
        passive:true
    }
);


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =========================================================
   ESCAPE ATTRIBUTE
========================================================= */

function escapeAttr(value){

    return escapeHTML(
        value
    );

}


/* =========================================================
   ESCAPE JS
========================================================= */

function escapeJS(value){

    return String(
        value ?? ""
    )
    .replaceAll(
        "\\",
        "\\\\"
    )
    .replaceAll(
        "'",
        "\\'"
    )
    .replaceAll(
        "\n",
        "\\n"
    )
    .replaceAll(
        "\r",
        "\\r"
    );

}


/* =========================================================
   TEAM INITIALS
========================================================= */

function getInitials(name){

    const words =
        String(name)
        .trim()
        .split(/\s+/)
        .filter(Boolean);


    if(
        words.length === 1
    ){

        return words[0]
            .slice(0,3)
            .toUpperCase();

    }


    return words
        .slice(0,3)
        .map(
            word =>
                word[0]
        )
        .join("")
        .toUpperCase();

}
