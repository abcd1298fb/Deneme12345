<!DOCTYPE html>
<html lang="tr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CREX — Lig</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#02050a;
    --panel:#080e16;
    --panel2:#0c141e;

    --blue:#1595ff;
    --blue2:#62c0ff;

    --white:#f7fbff;
    --text:#dce5ef;
    --muted:#718096;

    --line:rgba(255,255,255,.075);

    --league:#1595ff;

    --ease:cubic-bezier(.16,1,.3,1);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    color:var(--text);
    font-family:"Manrope",sans-serif;

    background:
        radial-gradient(
            800px 500px at 0 -10%,
            color-mix(in srgb,var(--league) 16%,transparent),
            transparent 65%
        ),
        radial-gradient(
            700px 500px at 100% 20%,
            rgba(40,80,255,.09),
            transparent 65%
        ),
        linear-gradient(
            180deg,
            #02050a,
            #050a11 45%,
            #02050a
        );
}

.ambient{
    position:fixed;
    width:520px;
    height:520px;
    left:-260px;
    top:10%;
    border-radius:50%;

    background:var(--league);
    filter:blur(150px);
    opacity:.07;

    pointer-events:none;
    z-index:-5;

    animation:
        ambientMove
        14s
        ease-in-out
        infinite
        alternate;
}

.ambient2{
    position:fixed;
    width:500px;
    height:500px;
    right:-260px;
    bottom:0;
    border-radius:50%;

    background:#315dff;
    filter:blur(160px);
    opacity:.06;

    pointer-events:none;
    z-index:-5;

    animation:
        ambientMove2
        16s
        ease-in-out
        infinite
        alternate;
}

@keyframes ambientMove{
    to{
        transform:
            translate(180px,-80px)
            scale(1.2);
    }
}

@keyframes ambientMove2{
    to{
        transform:
            translate(-120px,80px)
            scale(1.2);
    }
}

body::before{
    content:"";

    position:fixed;
    inset:0;

    z-index:-4;
    pointer-events:none;

    opacity:.14;

    background-image:
        linear-gradient(
            rgba(255,255,255,.018) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.018) 1px,
            transparent 1px
        );

    background-size:70px 70px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 85%
        );
}


/* =========================================================
   HEADER
========================================================= */

.header{
    position:sticky;
    top:0;

    z-index:1000;

    height:74px;

    border-bottom:
        1px solid
        var(--line);

    background:
        rgba(2,6,11,.78);

    backdrop-filter:
        blur(25px)
        saturate(150%);

    -webkit-backdrop-filter:
        blur(25px)
        saturate(150%);
}

.header-inner{
    width:min(1480px,calc(100% - 40px));

    height:100%;
    margin:auto;

    display:flex;
    align-items:center;

    gap:28px;
}

.logo{
    position:relative;

    color:#fff;
    text-decoration:none;

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size:40px;
    line-height:1;
    font-weight:900;

    letter-spacing:2px;

    transition:.35s var(--ease);
}

.logo span{
    color:var(--blue);
}

.logo:hover{
    transform:translateY(-1px) scale(1.03);
}

.logo::after{
    content:"";

    position:absolute;

    left:1px;
    bottom:-7px;

    width:30px;
    height:2px;

    border-radius:10px;

    background:var(--blue);

    box-shadow:
        0 0 14px
        var(--blue);
}

.main-nav{
    display:flex;
    align-items:center;

    gap:4px;

    flex:1;
}

.main-nav a{
    color:#718096;

    text-decoration:none;

    padding:11px 14px;

    border-radius:10px;

    font-size:10px;
    font-weight:900;

    transition:.3s var(--ease);
}

.main-nav a:hover,
.main-nav a.active{
    color:#fff;

    background:
        rgba(255,255,255,.04);

    transform:translateY(-1px);
}

.search{
    width:245px;
    height:42px;

    display:flex;
    align-items:center;

    gap:10px;

    padding:0 14px;

    border:
        1px solid
        var(--line);

    border-radius:13px;

    background:
        rgba(255,255,255,.035);

    transition:.35s var(--ease);
}

.search:focus-within{
    border-color:
        color-mix(
            in srgb,
            var(--league) 45%,
            transparent
        );

    box-shadow:
        0 0 30px
        color-mix(
            in srgb,
            var(--league) 10%,
            transparent
        );

    transform:translateY(-1px);
}

.search svg{
    width:16px;

    color:#68788d;

    flex:none;
}

.search input{
    width:100%;

    border:0;
    outline:0;

    color:#fff;
    background:transparent;

    font-family:inherit;
    font-size:10px;
}

.search input::placeholder{
    color:#59687b;
}


/* =========================================================
   MAIN
========================================================= */

.main{
    width:min(1480px,calc(100% - 40px));

    margin:42px auto 0;
}


/* =========================================================
   LEAGUE HERO
========================================================= */

.league-hero{
    position:relative;

    min-height:255px;

    overflow:hidden;

    display:flex;
    align-items:center;

    border:
        1px solid
        rgba(255,255,255,.075);

    border-radius:30px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.012)
        );

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.35);

    isolation:isolate;
}

.league-hero::after{
    content:"";

    position:absolute;
    inset:0;

    border-radius:inherit;

    pointer-events:none;

    background:
        linear-gradient(
            120deg,
            transparent 20%,
            rgba(255,255,255,.035),
            transparent 55%
        );

    transform:
        translateX(-100%);

    animation:
        heroShine
        8s
        ease-in-out
        infinite;

    z-index:2;
}

@keyframes heroShine{

    0%,
    45%{
        transform:translateX(-100%);
    }

    65%,
    100%{
        transform:translateX(100%);
    }

}

.hero-bg{
    position:absolute;
    inset:0;

    overflow:hidden;
}

.hero-bg::before{
    content:"";

    position:absolute;

    width:550px;
    height:550px;

    right:-150px;
    top:-200px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            var(--league),
            transparent 68%
        );

    opacity:.18;

    filter:blur(15px);

    animation:
        heroPulse
        6s
        ease-in-out
        infinite
        alternate;
}

@keyframes heroPulse{

    to{
        transform:scale(1.2);
        opacity:.28;
    }

}

.hero-bg::after{
    content:"";

    position:absolute;

    width:130%;
    height:160px;

    left:-15%;
    top:55px;

    transform:rotate(-9deg);

    border-top:
        1px solid
        color-mix(
            in srgb,
            var(--league) 22%,
            transparent
        );

    border-bottom:
        1px solid
        color-mix(
            in srgb,
            var(--league) 12%,
            transparent
        );

    background:
        linear-gradient(
            90deg,
            transparent,
            color-mix(
                in srgb,
                var(--league) 8%,
                transparent
            ),
            transparent
        );
}

.hero-content{
    position:relative;

    z-index:3;

    width:100%;

    display:grid;

    grid-template-columns:
        170px
        1fr
        auto;

    align-items:center;

    gap:35px;

    padding:35px 45px;
}

.hero-logo-wrap{
    width:150px;
    height:150px;

    display:grid;
    place-items:center;

    position:relative;

    transform-style:preserve-3d;

    animation:
        floatingLogo
        5s
        ease-in-out
        infinite;
}

.hero-logo-wrap::before{
    content:"";

    position:absolute;
    inset:15px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            color-mix(
                in srgb,
                var(--league) 22%,
                transparent
            ),
            transparent 70%
        );

    filter:blur(15px);
}

.hero-logo{
    position:relative;

    width:140px;
    height:140px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 25px 25px
            rgba(0,0,0,.55)
        )
        drop-shadow(
            0 0 30px
            color-mix(
                in srgb,
                var(--league) 20%,
                transparent
            )
        );

    transition:.5s var(--ease);
}

.hero-logo-wrap:hover .hero-logo{
    transform:
        scale(1.08)
        rotateY(10deg)
        rotateZ(2deg);
}

@keyframes floatingLogo{

    0%,
    100%{
        transform:
            translateY(0)
            rotateZ(0);
    }

    50%{
        transform:
            translateY(-8px)
            rotateZ(-1deg);
    }

}

.hero-kicker{
    display:flex;
    align-items:center;

    gap:8px;

    margin-bottom:9px;

    color:#748399;

    font-size:9px;
    font-weight:900;

    letter-spacing:1.8px;
}

.hero-dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:var(--league);

    box-shadow:
        0 0 15px
        var(--league);

    animation:
        dotPulse
        1.5s
        infinite;
}

@keyframes dotPulse{

    50%{
        transform:scale(1.4);
        opacity:.5;
    }

}

.hero-title{
    color:#fff;

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size:72px;
    line-height:.82;

    font-weight:900;

    text-transform:uppercase;

    letter-spacing:-1px;

    text-shadow:
        0 8px 35px
        rgba(0,0,0,.4);
}

.hero-country{
    margin-top:14px;

    color:#728095;

    font-size:10px;
    font-weight:800;

    letter-spacing:1px;
}

.hero-stats{
    display:flex;

    gap:10px;
}

.stat{
    min-width:100px;

    padding:15px 17px;

    text-align:center;

    border:
        1px solid
        rgba(255,255,255,.065);

    border-radius:15px;

    background:
        rgba(255,255,255,.025);

    transition:.35s var(--ease);
}

.stat:hover{
    transform:translateY(-4px);

    border-color:
        color-mix(
            in srgb,
            var(--league) 25%,
            transparent
        );

    background:
        color-mix(
            in srgb,
            var(--league) 7%,
            transparent
        );
}

.stat strong{
    display:block;

    color:#fff;

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size:28px;
    font-weight:900;
}

.stat span{
    color:#66768a;

    font-size:7px;
    font-weight:900;

    letter-spacing:1px;
}


/* =========================================================
   FILTERS
========================================================= */

.controls{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:15px;

    margin-top:30px;
    margin-bottom:20px;
}

.filters{
    display:flex;

    gap:8px;

    overflow-x:auto;

    scrollbar-width:none;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filter{
    flex:none;

    padding:10px 16px;

    color:#68778a;

    border:
        1px solid
        rgba(255,255,255,.065);

    border-radius:11px;

    background:
        rgba(255,255,255,.025);

    cursor:pointer;

    font-family:inherit;

    font-size:8px;
    font-weight:900;

    transition:.3s var(--ease);
}

.filter:hover,
.filter.active{
    color:#fff;

    border-color:
        color-mix(
            in srgb,
            var(--league) 40%,
            transparent
        );

    background:
        color-mix(
            in srgb,
            var(--league) 10%,
            transparent
        );

    box-shadow:
        0 8px 25px
        color-mix(
            in srgb,
            var(--league) 8%,
            transparent
        );

    transform:translateY(-2px);
}

.result-count{
    flex:none;

    color:#58677a;

    font-size:8px;
    font-weight:900;
}


/* =========================================================
   MATCH GRID
========================================================= */

.matches{
    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap:17px;
}


/* =========================================================
   MATCH CARD
========================================================= */

.match-card{
    position:relative;

    min-height:315px;

    overflow:hidden;

    border:
        1px solid
        rgba(255,255,255,.075);

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            #0b121b,
            #060a10
        );

    transition:
        transform .5s var(--ease),
        border-color .35s,
        box-shadow .5s;

    transform-style:preserve-3d;

    isolation:isolate;
}

.match-card::before{
    content:"";

    position:absolute;

    inset:0;

    opacity:0;

    background:
        radial-gradient(
            350px circle at
            var(--mx,50%)
            var(--my,50%),
            color-mix(
                in srgb,
                var(--league) 13%,
                transparent
            ),
            transparent 55%
        );

    transition:.3s;

    pointer-events:none;

    z-index:0;
}

.match-card::after{
    content:"";

    position:absolute;

    inset:1px;

    border-radius:24px;

    pointer-events:none;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.045),
            transparent 25%,
            transparent 75%,
            rgba(255,255,255,.015)
        );

    opacity:.8;

    z-index:0;
}

.match-card:hover::before{
    opacity:1;
}

.match-card:hover{
    transform:
        translateY(-9px)
        scale(1.008);

    border-color:
        color-mix(
            in srgb,
            var(--league) 32%,
            transparent
        );

    box-shadow:
        0 35px 70px
        rgba(0,0,0,.5),
        0 0 35px
        color-mix(
            in srgb,
            var(--league) 7%,
            transparent
        );
}

.card-glow{
    position:absolute;

    top:0;
    left:8%;
    right:8%;

    height:3px;

    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--league),
            transparent
        );

    transform:scaleX(.25);

    transition:.6s var(--ease);

    box-shadow:
        0 0 15px
        var(--league);

    z-index:5;
}

.match-card:hover .card-glow{
    transform:scaleX(1);
}

.match-content{
    position:relative;

    z-index:3;

    height:315px;

    padding:19px;

    display:flex;
    flex-direction:column;
}

.match-top{
    display:flex;

    justify-content:space-between;
    align-items:center;

    gap:8px;
}

.match-league-tag{
    max-width:62%;

    overflow:hidden;

    white-space:nowrap;
    text-overflow:ellipsis;

    padding:7px 9px;

    color:#8290a2;

    border:
        1px solid
        rgba(255,255,255,.06);

    border-radius:8px;

    background:
        rgba(255,255,255,.025);

    font-size:8px;
    font-weight:900;
}

.match-status{
    display:flex;
    align-items:center;

    gap:6px;

    color:#45adff;

    font-size:8px;
    font-weight:900;

    letter-spacing:1px;

    white-space:nowrap;
}

.match-status::before{
    content:"";

    width:5px;
    height:5px;

    border-radius:50%;

    background:#45adff;

    box-shadow:
        0 0 10px
        #45adff;
}


/* =========================================================
   TEAMS
========================================================= */

.teams{
    flex:1;

    display:grid;

    grid-template-columns:
        1fr
        auto
        1fr;

    align-items:center;

    gap:10px;
}

.team{
    display:flex;

    flex-direction:column;
    align-items:center;

    gap:11px;

    min-width:0;
}

.team-logo{
    width:78px;
    height:78px;

    display:grid;
    place-items:center;

    color:#fff;

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius:23px;

    background:
        linear-gradient(
            145deg,
            #1a2837,
            #070c13
        );

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size:17px;
    font-weight:900;

    box-shadow:
        0 20px 35px
        rgba(0,0,0,.45),
        inset 0 1px 1px
        rgba(255,255,255,.1);

    transition:.5s var(--ease);

    overflow:hidden;
}

.team-logo img{
    width:100%;
    height:100%;

    object-fit:contain;

    padding:10px;

    display:block;

    transition:.45s var(--ease);
}

.team-logo.text-logo{
    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size:17px;
}

.match-card:hover .team-logo{
    transform:
        translateY(-7px)
        scale(1.07);

    box-shadow:
        0 25px 35px
        rgba(0,0,0,.55),
        0 0 22px
        color-mix(
            in srgb,
            var(--league) 10%,
            transparent
        );
}

.match-card:hover .team-logo img{
    transform:scale(1.06);
}

.team-name{
    width:100%;
    max-width:105px;

    color:#d6dfe9;

    text-align:center;

    font-size:9px;

    line-height:1.3;

    font-weight:800;

    overflow:hidden;
}

.team-score{
    margin-top:4px;

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size:20px;

    font-weight:900;

    color:#fff;

    text-align:center;

    letter-spacing:1px;

    min-height:20px;
}

.vs{
    min-width:34px;

    padding:0 6px;

    height:34px;

    display:grid;
    place-items:center;

    color:#667589;

    border:
        1px solid
        rgba(255,255,255,.065);

    border-radius:50%;

    background:
        rgba(255,255,255,.025);

    font-size:7px;
    font-weight:900;

    white-space:nowrap;

    transition:.35s var(--ease);
}

.match-card:hover .vs{
    color:#fff;

    border-color:
        color-mix(
            in srgb,
            var(--league) 35%,
            transparent
        );

    box-shadow:
        0 0 20px
        color-mix(
            in srgb,
            var(--league) 10%,
            transparent
        );
}


/* =========================================================
   MATCH BOTTOM
========================================================= */

.match-bottom{
    display:flex;

    justify-content:space-between;
    align-items:center;

    gap:12px;

    padding-top:14px;

    border-top:
        1px solid
        rgba(255,255,255,.055);
}


/* =========================================================
   HAFTA / TARİH
========================================================= */

.match-date{
    min-width:0;

    color:#d7e2ed;

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size:16px;

    font-weight:900;

    line-height:1.15;

    letter-spacing:.7px;

    text-transform:uppercase;

    text-shadow:
        0 0 14px
        rgba(255,255,255,.08);

    overflow:hidden;
}


/* =========================================================
   MAÇA GİT BUTONU
========================================================= */

.watch-btn{
    position:relative;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:8px;

    min-width:112px;

    min-height:40px;

    padding:10px 16px;

    color:#fff;

    text-decoration:none;

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            #1595ff 0%,
            #0874d1 55%,
            #0753a5 100%
        );

    box-shadow:
        0 10px 25px
        rgba(21,149,255,.22),
        inset 0 1px 0
        rgba(255,255,255,.2);

    font-family:
        "Manrope",
        sans-serif;

    font-size:10px;

    font-weight:900;

    letter-spacing:.4px;

    overflow:hidden;

    transition:
        .35s
        var(--ease);
}

.watch-btn span{
    font-size:15px;

    line-height:1;

    transition:.35s var(--ease);
}

.watch-btn::before{
    content:"";

    position:absolute;

    top:0;
    left:-120%;

    width:80%;
    height:100%;

    transform:skewX(-20deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.3),
            transparent
        );

    transition:.55s ease;
}

.watch-btn:hover::before{
    left:130%;
}

.watch-btn:hover{
    transform:
        translateY(-3px)
        scale(1.035);

    border-color:
        rgba(98,192,255,.55);

    box-shadow:
        0 16px 34px
        rgba(21,149,255,.38),
        0 0 22px
        rgba(21,149,255,.18),
        inset 0 1px 0
        rgba(255,255,255,.25);
}

.watch-btn:hover span{
    transform:translateX(4px);
}

.watch-btn:active{
    transform:
        translateY(0)
        scale(.98);
}


/* =========================================================
   LOADER
========================================================= */

.loader{
    display:none;

    justify-content:center;
    align-items:center;

    padding:35px;
}

.loader.show{
    display:flex;

<script>

/* =========================================================
   CREX LIG SISTEMI
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const leagueSlug =
    params.get("lig") ||
    "premier-league";


/* =========================================================
   ÖNEMLİ:
   LİG SAYFASINDA MAKSİMUM 10 MAÇ
========================================================= */

const MAX_MATCHES = 10;


/* =========================================================
   LOGO CACHE
========================================================= */

const LOGO_VERSION =
    "20260901";


/* =========================================================
   LIGLER
========================================================= */

const leagues = {

    "premier-league":{
        name:"Premier League",
        country:"İngiltere",

        logo:

    },

        country:"Almanya",

        logo:

    },


    "ligue-1":{

        country:"Fransa",

        logo:
        "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Ligue_1_2024_Logo.png/960px-Ligue_1_2024_Logo.png",

        color:"#159fe8"
    },


    "super-lig":{
        name:"Süper Lig",
        country:"Türkiye",

        logo:
        "https://assets.footylogos.com/previews/super-lig-turkey/super-lig-turkey-logo-footylogos-1200.webp",

        color:"#e51d3b"
    },


    "champions-league":{
        name:"Champions League",
        country:"UEFA",

        logo:
        "https://upload.wikimedia.org/wikipedia/commons/e/e2/UEFA_Champions_League_logo.png",

        color:"#426dff"
    },


    "europa-league":{
        name:"Europa League",
        country:"UEFA",

        logo:
        "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/UEFA_Europa_League_logo_%282024_version%29.svg/960px-UEFA_Europa_League_logo_%282024_version%29.svg.png",

        color:"#ff7417"
    },


    "conference-league":{
        name:"Conference League",
        country:"UEFA",

        logo:
        "https://assets.football-logos.cc/logos/tournaments/700x700/uefa-conference-league.4a977457.png",

        color:"#18b98b"
    },


    "eredivisie":{
        name:"Eredivisie",
        country:"Hollanda",

        logo:"",

        color:"#ed5b21"
    }

};


const league =
    leagues[leagueSlug] ||
    leagues["premier-league"];


document.documentElement
    .style
    .setProperty(
        "--league",
        league.color
    );


/* =========================================================
   ELEMENTLER
========================================================= */

const heroLogo =
    document.getElementById(
        "heroLogo"
    );


const leagueTitle =
    document.getElementById(
        "leagueTitle"
    );


const leagueCountry =
    document.getElementById(
        "leagueCountry"
    );


const matchGrid =
    document.getElementById(
        "matchGrid"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const empty =
    document.getElementById(
        "empty"
    );


const loader =
    document.getElementById(
        "loader"
    );


const resultCount =
    document.getElementById(
        "resultCount"
    );


const totalMatches =
    document.getElementById(
        "totalMatches"
    );


const upcomingMatches =
    document.getElementById(
        "upcomingMatches"
    );


document.title =
    "CREX — " +
    league.name;


/* =========================================================
   LIG LOGOSU
========================================================= */

if(league.logo){

    heroLogo.src =
        addLogoCache(
            league.logo
        );

    heroLogo.alt =
        league.name;

    heroLogo.style.display =
        "block";

}
else{

    heroLogo.style.display =
        "none";

}


leagueTitle.textContent =
    league.name;


leagueCountry.textContent =
    league.country +
    " • CREX MAÇ MERKEZİ";


/* =========================================================
   VERİ
========================================================= */

const matchesJsonPath =
    "./data/maclar.json";


let allMatches = [];

let filteredMatches = [];

let currentFilter = "all";


/* =========================================================
   LOGO CACHE
========================================================= */

function addLogoCache(url){

    if(!url)
        return "";

    const cleanUrl =
        String(url)
        .trim();


    if(!cleanUrl)
        return "";


    if(
        cleanUrl.startsWith("data:") ||
        cleanUrl.startsWith("blob:")
    ){

        return cleanUrl;

    }


    const separator =
        cleanUrl.includes("?")
            ? "&"
            : "?";


    return (
        cleanUrl +
        separator +
        "v=" +
        LOGO_VERSION
    );

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeText(value){

    return String(
        value ?? ""
    )
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .toLocaleLowerCase(
        "tr-TR"
    )
    .replaceAll(
        "ı",
        "i"
    )
    .replaceAll(
        "ş",
        "s"
    )
    .replaceAll(
        "ğ",
        "g"
    )
    .replaceAll(
        "ü",
        "u"
    )
    .replaceAll(
        "ö",
        "o"
    )
    .replaceAll(
        "ç",
        "c"
    )
    .replace(
        /[^a-z0-9]/g,
        ""
    );

}


/* =========================================================
   TAKIM LOGOLARI
========================================================= */

function resolveMatchLogos(match){

    return {

        ...match,

        resolvedEvLogo:
            addLogoCache(
                match.evLogo ||
                ""
            ),

        resolvedDepLogo:
            addLogoCache(
                match.depLogo ||
                ""
            )

    };

}


/* =========================================================
   MAC DURUMU
========================================================= */

function getMatchStatus(match){

    const status =
        String(
            match.durum || ""
        )
        .trim()
        .toLocaleLowerCase(
            "tr-TR"
        );


    const finishedStatuses = [

        "ms",
        "tamamlandı",
        "tamamlandi",
        "finished",
        "bitti",
        "bitmiş",
        "bitmis"

    ];


    if(
        finishedStatuses.includes(
            status
        )
    ){

        return "finished";

    }


    const liveStatuses = [

        "canlı",
        "canli",
        "live",
        "yayında",
        "yayinda"

    ];


    if(
        liveStatuses.includes(
            status
        )
    ){

        return "live";

    }


    const upcomingStatuses = [

        "gelecek",
        "yaklaşıyor",
        "yaklasiyor",
        "upcoming",
        "scheduled"

    ];


    if(
        upcomingStatuses.includes(
            status
        )
    ){

        return "upcoming";

    }


    const date =
        getMatchDate(
            match
        );


    if(!date)
        return "upcoming";


    return date < new Date()
        ? "finished"
        : "upcoming";

}


/* =========================================================
   MAC TARIHI
========================================================= */

function getMatchDate(match){

    if(!match.tarih)
        return null;


    const dateValue =
        String(
            match.tarih
        ).trim();


    if(!dateValue)
        return null;


    let dateString =
        dateValue;


    if(
        match.saat &&
        String(
            match.saat
        ).trim()
    ){

        dateString +=
            "T" +
            String(
                match.saat
            ).trim();

    }
    else{

        dateString +=
            "T23:59:59";

    }


    const date =
        new Date(
            dateString
        );


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return null;

    }


    return date;

}


/* =========================================================
   HAFTA
========================================================= */

function formatDate(match){

    if(
        match.hafta &&
        String(
            match.hafta
        ).trim()
    ){

        return String(
            match.hafta
        ).trim();

    }


    if(match.tarih){

        return String(
            match.tarih
        ).trim();

    }


    return "HAFTA YOK";

}


/* =========================================================
   LIG KONTROL
========================================================= */

function isCorrectLeague(match){

    const matchLeague =
        normalizeText(
            match.lig
        );


    const targetLeague =
        normalizeText(
            leagueSlug
        );


    return (
        matchLeague ===
        targetLeague
    );

}


/* =========================================================
   MACLARI YUKLE
========================================================= */

async function loadMatches(){

    loader.classList.add(
        "show"
    );


    try{

        const matchesResponse =
            await fetch(
                matchesJsonPath,
                {
                    cache:"no-store"
                }
            );


        if(
            !matchesResponse.ok
        ){

            throw new Error(
                "maclar.json yüklenemedi: " +
                matchesResponse.status
            );

        }


        const data =
            await matchesResponse.json();


        let matches;


        if(
            Array.isArray(data)
        ){

            matches =
                data;

        }

        else if(
            data &&
            Array.isArray(
                data.matches
            )
        ){

            matches =
                data.matches;

        }

        else if(
            data &&
            Array.isArray(
                data.maclar
            )
        ){

            matches =
                data.maclar;

        }

        else{

            throw new Error(
                "maclar.json formatı geçersiz."
            );

        }


        allMatches =
            matches

            .filter(
                match =>
                    match &&
                    isCorrectLeague(
                        match
                    )
            )

            .filter(
                match =>
                    match.id !== undefined &&
                    match.id !== null
            )

            .map(
                match =>
                    resolveMatchLogos(
                        match
                    )
            );


        updateStats();

        applyFilters();

    }
    catch(error){

        console.error(
            "CREX Lig Hatası:",
            error
        );


        allMatches = [];

        filteredMatches = [];

        matchGrid.innerHTML = "";


        leagueCountry.textContent =
            league.country +
            " • MAÇ VERİSİ BULUNAMADI";


        resultCount.textContent =
            "0 MAÇ";


        empty.classList.add(
            "show"
        );

    }
    finally{

        loader.classList.remove(
            "show"
        );

    }

}


/* =========================================================
   İSTATİSTİK
========================================================= */

function updateStats(){

    const total =
        allMatches.length;


    const upcoming =
        allMatches.filter(
            match =>
                getMatchStatus(
                    match
                ) === "upcoming"
        ).length;


    totalMatches.textContent =
        total.toLocaleString(
            "tr-TR"
        );


    upcomingMatches.textContent =
        upcoming.toLocaleString(
            "tr-TR"
        );

}


/* =========================================================
   FİLTRE
========================================================= */

function applyFilters(){

    const query =
        searchInput.value
        .trim()
        .toLocaleLowerCase(
            "tr-TR"
        );


    let results =
        allMatches.filter(
            match => {

                const status =
                    getMatchStatus(
                        match
                    );


                const filterOK =
                    currentFilter === "all" ||
                    status === currentFilter;


                if(!filterOK)
                    return false;


                if(!query)
                    return true;


                const searchable = [

                    match.evSahibi,
                    match.deplasman,

                    match.evKisa,
                    match.depKisa,

                    match.lig,
                    match.ligAdi,

                    match.hafta,

                    match.tarih,
                    match.saat,

                    match.skor,
                    match.durum

                ]
                .filter(Boolean)
                .join(" ")
                .toLocaleLowerCase(
                    "tr-TR"
                );


                return searchable.includes(
                    query
                );

            }
        );


    /*
     * =====================================================
     * MAKSİMUM 10 MAÇ
     * =====================================================
     *
     * Burada liste kesin olarak 10 maçla sınırlandırılıyor.
     * Infinite scroll yok.
     */

    filteredMatches =
        results.slice(
            0,
            MAX_MATCHES
        );


    renderMatches();


    /*
     * Kullanıcıya gerçek gösterilen
     * maç sayısını yazdırıyoruz.
     */

    resultCount.textContent =
        filteredMatches.length
        .toLocaleString(
            "tr-TR"
        ) +
        " MAÇ";


    /*
     * 10'dan fazla sonuç varsa
     * küçük bir bilgi gösteriyoruz.
     */

    if(
        results.length >
        MAX_MATCHES
    ){

        resultCount.textContent =
            MAX_MATCHES +
            " MAÇ GÖSTERİLİYOR";

    }

}


/* =========================================================
   TÜM KARTLARI RENDER
========================================================= */

function renderMatches(){

    matchGrid.innerHTML = "";


    if(
        filteredMatches.length === 0
    ){

        empty.classList.add(
            "show"
        );

        return;

    }


    empty.classList.remove(
        "show"
    );


    const fragment =
        document.createDocumentFragment();


    filteredMatches.forEach(
        (
            match,
            index
        )=>{

            const card =
                createMatchCard(
                    match
                );


            fragment.appendChild(
                card
            );


            /*
             * Kart animasyonu
             */

            requestAnimationFrame(
                ()=>{

                    card.animate(
                        [
                            {
                                opacity:0,

                                transform:
                                    "translateY(25px) scale(.96)"
                            },

                            {
                                opacity:1,

                                transform:
                                    "translateY(0) scale(1)"
                            }
                        ],
                        {
                            duration:550,

                            delay:
                                Math.min(
                                    index * 45,
                                    350
                                ),

                            easing:
                                "cubic-bezier(.16,1,.3,1)",

                            fill:"both"
                        }
                    );

                }
            );

        }
    );


    matchGrid.appendChild(
        fragment
    );

}


/* =========================================================
   MAC KARTI
========================================================= */

function createMatchCard(match){

    const home =
        match.evSahibi ||
        "Ev Sahibi";


    const away =
        match.deplasman ||
        "Deplasman";


    const homeShort =
        match.evKisa ||
        getInitials(home);


    const awayShort =
        match.depKisa ||
        getInitials(away);


    const homeLogoUrl =
        match.resolvedEvLogo ||
        "";


    const awayLogoUrl =
        match.resolvedDepLogo ||
        "";


    const status =
        getMatchStatus(
            match
        );


    const matchId =
        match.id;


    const date =
        formatDate(
            match
        );


    const score =
        String(
            match.skor || ""
        ).trim();


    let homeScoreHtml =
        "";


    let awayScoreHtml =
        "";


    let centerContent =
        `<div class="vs">VS</div>`;


    if(
        score &&
        score.includes("-")
    ){

        const parts =
            score.split("-");


        const hScore =
            parts[0].trim();


        const aScore =
            parts[1].trim();


        homeScoreHtml =
            `<div class="team-score">
                ${escapeHTML(hScore)}
            </div>`;


        awayScoreHtml =
            `<div class="team-score">
                ${escapeHTML(aScore)}
            </div>`;


        centerContent =
            `<div class="vs">-</div>`;

    }


    const card =
        document.createElement(
            "article"
        );


    card.className =
        "match-card";


    card.dataset.search =
        [
            home,
            away,
            league.name
        ].join(" ");


    let statusText;


    if(
        status === "finished"
    ){

        statusText =
            "TAMAMLANDI";

    }

    else if(
        status === "live"
    ){

        statusText =
            "CANLI";

    }

    else{

        statusText =
            "YAKLAŞIYOR";

    }


    const homeLogoHTML =
        homeLogoUrl

        ? `

            <img
                src="${escapeAttr(
                    homeLogoUrl
                )}"
                alt="${escapeAttr(
                    home
                )}"
                loading="lazy"
                decoding="async"
                referrerpolicy="no-referrer"
                onerror="handleTeamLogoError(
                    this,
                    '${escapeJS(homeShort)}'
                )"
            >

        `

        : escapeHTML(
            homeShort
        );


    const awayLogoHTML =
        awayLogoUrl

        ? `

            <img
                src="${escapeAttr(
                    awayLogoUrl
                )}"
                alt="${escapeAttr(
                    away
                )}"
                loading="lazy"
                decoding="async"
                referrerpolicy="no-referrer"
                onerror="handleTeamLogoError(
                    this,
                    '${escapeJS(awayShort)}'
                )"
            >

        `

        : escapeHTML(
            awayShort
        );


    card.innerHTML = `

        <div class="card-glow"></div>


        <div class="match-content">


            <div class="match-top">


                <div class="match-league-tag">

                    ${escapeHTML(
                        match.ligAdi ||
                        league.name
                    )}

                </div>


                <div class="match-status">

                    ${statusText}

                </div>


            </div>


            <div class="teams">


                <div class="team">


                    <div class="team-logo">

                        ${homeLogoHTML}

                    </div>


                    ${homeScoreHtml}


                    <div class="team-name">

                        ${escapeHTML(
                            home
                        )}

                    </div>


                </div>


                ${centerContent}


                <div class="team">


                    <div class="team-logo">

                        ${awayLogoHTML}

                    </div>


                    ${awayScoreHtml}


                    <div class="team-name">

                        ${escapeHTML(
                            away
                        )}

                    </div>


                </div>


            </div>


            <div class="match-bottom">


                <div class="match-date">

                    ${escapeHTML(
                        date
                    )}

                </div>


                <a
                    href="mac.html?id=${encodeURIComponent(
                        String(matchId)
                    )}"
                    class="watch-btn"
                >

                    MAÇA GİT

                    <span>
                        →
                    </span>

                </a>


            </div>


        </div>

    `;


    return card;

}


/* =========================================================
   TAKIM LOGO HATASI
========================================================= */

function handleTeamLogoError(
    img,
    fallbackText
){

    if(!img)
        return;


    img.onerror =
        null;


    const parent =
        img.parentElement;


    if(!parent)
        return;


    img.remove();


    parent.classList.add(
        "text-logo"
    );


    parent.textContent =
        fallbackText ||
        "TEAM";

}


/* =========================================================
   ARAMA
========================================================= */

searchInput.addEventListener(
    "input",
    ()=>{
        applyFilters();
    }
);


/* =========================================================
   FİLTRE BUTONLARI
========================================================= */

document
    .querySelectorAll(
        ".filter"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                ()=>{


                    document
                        .querySelectorAll(
                            ".filter"
                        )
                        .forEach(
                            btn =>
                                btn.classList.remove(
                                    "active"
                                )
                        );


                    button.classList.add(
                        "active"
                    );


                    currentFilter =
                        button.dataset.filter;


                    applyFilters();

                }
            );

        }
    );


/* =========================================================
   MOUSE CARD EFFECT
========================================================= */

document.addEventListener(
    "mousemove",
    event => {

        const card =
            event.target.closest(
                ".match-card"
            );


        if(!card)
            return;


        const rect =
            card.getBoundingClientRect();


        const x =
            (
                (
                    event.clientX -
                    rect.left
                )
                /
                rect.width
            ) * 100;


        const y =
            (
                (
                    event.clientY -
                    rect.top
                )
                /
                rect.height
            ) * 100;


        card.style.setProperty(
            "--mx",
            x + "%"
        );


        card.style.setProperty(
            "--my",
            y + "%"
        );

    },
    {
        passive:true
    }
);


/* =========================================================
   HERO LOGO HATA
========================================================= */

heroLogo.addEventListener(
    "error",
    ()=>{

        heroLogo.style.display =
            "none";

    }
);


/* =========================================================
   BAŞLAT
========================================================= */

loadMatches();

</script>
