<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CREX — Lig</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =========================================================
   ROOT
========================================================= */

:root{
    --bg:#02050a;
    --panel:#080e16;
    --panel2:#0c141e;

    --blue:#1595ff;
    --blue2:#62c0ff;

    --white:#f7fbff;
    --text:#dce5ef;
    --muted:#718096;

    --line:rgba(255,255,255,.075);

    --league:#1595ff;

    --ease:cubic-bezier(.16,1,.3,1);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;

    color:var(--text);

    font-family:"Manrope",sans-serif;

    background:
        radial-gradient(
            800px 500px at 0 -10%,
            color-mix(
                in srgb,
                var(--league) 16%,
                transparent
            ),
            transparent 65%
        ),

        radial-gradient(
            700px 500px at 100% 20%,
            rgba(40,80,255,.09),
            transparent 65%
        ),

        linear-gradient(
            180deg,
            #02050a,
            #050a11 45%,
            #02050a
        );
}

/* =========================================================
   AMBIENT
========================================================= */

.ambient{
    position:fixed;

    width:520px;
    height:520px;

    left:-260px;
    top:10%;

    border-radius:50%;

    background:var(--league);

    filter:blur(150px);

    opacity:.07;

    pointer-events:none;

    z-index:-5;

    animation:
        ambientMove 14s ease-in-out infinite alternate;
}

.ambient2{
    position:fixed;

    width:500px;
    height:500px;

    right:-260px;
    bottom:0;

    border-radius:50%;

    background:#315dff;

    filter:blur(160px);

    opacity:.06;

    pointer-events:none;

    z-index:-5;

    animation:
        ambientMove2 16s ease-in-out infinite alternate;
}

@keyframes ambientMove{
    to{
        transform:
            translate(180px,-80px)
            scale(1.2);
    }
}

@keyframes ambientMove2{
    to{
        transform:
            translate(-120px,80px)
            scale(1.2);
    }
}

/* =========================================================
   GRID
========================================================= */

body::before{
    content:"";

    position:fixed;
    inset:0;

    z-index:-4;

    pointer-events:none;

    opacity:.14;

    background-image:
        linear-gradient(
            rgba(255,255,255,.018) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.018) 1px,
            transparent 1px
        );

    background-size:70px 70px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 85%
        );
}

/* =========================================================
   HEADER
========================================================= */

.header{
    position:sticky;

    top:0;

    z-index:1000;

    height:74px;

    border-bottom:
        1px solid var(--line);

    background:
        rgba(2,6,11,.78);

    backdrop-filter:
        blur(25px)
        saturate(150%);

    -webkit-backdrop-filter:
        blur(25px)
        saturate(150%);
}

.header-inner{
    width:
        min(
            1480px,
            calc(100% - 40px)
        );

    height:100%;

    margin:auto;

    display:flex;

    align-items:center;

    gap:28px;
}

.logo{
    position:relative;

    color:#fff;

    text-decoration:none;

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size:40px;

    line-height:1;

    font-weight:900;

    letter-spacing:2px;
}

.logo span{
    color:var(--blue);
}

.logo::after{
    content:"";

    position:absolute;

    left:1px;
    bottom:-7px;

    width:30px;
    height:2px;

    border-radius:10px;

    background:var(--blue);

    box-shadow:
        0 0 14px var(--blue);
}

.main-nav{
    display:flex;

    align-items:center;

    gap:4px;

    flex:1;
}

.main-nav a{
    color:#718096;

    text-decoration:none;

    padding:
        11px 14px;

    border-radius:10px;

    font-size:10px;

    font-weight:900;

    transition:.3s var(--ease);
}

.main-nav a:hover{
    color:#fff;

    background:
        rgba(255,255,255,.04);
}

.search{
    width:245px;
    height:42px;

    display:flex;

    align-items:center;

    gap:10px;

    padding:
        0 14px;

    border:
        1px solid var(--line);

    border-radius:13px;

    background:
        rgba(255,255,255,.035);

    transition:.35s var(--ease);
}

.search:focus-within{
    border-color:
        color-mix(
            in srgb,
            var(--league) 45%,
            transparent
        );

    box-shadow:
        0 0 30px
        color-mix(
            in srgb,
            var(--league) 10%,
            transparent
        );
}

.search svg{
    width:16px;

    color:#68788d;

    flex:none;
}

.search input{
    width:100%;

    border:0;
    outline:0;

    color:#fff;

    background:transparent;

    font-family:inherit;

    font-size:10px;
}

.search input::placeholder{
    color:#59687b;
}

/* =========================================================
   MAIN
========================================================= */

.main{
    width:
        min(
            1480px,
            calc(100% - 40px)
        );

    margin:
        42px auto 0;
}

/* =========================================================
   LEAGUE HERO
========================================================= */

.league-hero{
    position:relative;

    min-height:255px;

    overflow:hidden;

    display:flex;

    align-items:center;

    border:
        1px solid rgba(255,255,255,.075);

    border-radius:30px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.012)
        );

    box-shadow:
        0 30px 80px rgba(0,0,0,.35);
}

.hero-bg{
    position:absolute;

    inset:0;

    overflow:hidden;
}

.hero-bg::before{
    content:"";

    position:absolute;

    width:550px;
    height:550px;

    right:-150px;
    top:-200px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            var(--league),
            transparent 68%
        );

    opacity:.18;

    filter:blur(15px);

    animation:
        heroPulse 6s ease-in-out infinite alternate;
}

@keyframes heroPulse{
    to{
        transform:scale(1.2);

        opacity:.28;
    }
}

.hero-bg::after{
    content:"";

    position:absolute;

    width:130%;

    height:160px;

    left:-15%;

    top:55px;

    transform:rotate(-9deg);

    border-top:
        1px solid
        color-mix(
            in srgb,
            var(--league) 22%,
            transparent
        );

    border-bottom:
        1px solid
        color-mix(
            in srgb,
            var(--league) 12%,
            transparent
        );

    background:
        linear-gradient(
            90deg,
            transparent,
            color-mix(
                in srgb,
                var(--league) 8%,
                transparent
            ),
            transparent
        );
}

.hero-content{
    position:relative;

    z-index:3;

    width:100%;

    display:grid;

    grid-template-columns:
        170px 1fr auto;

    align-items:center;

    gap:35px;

    padding:35px 45px;
}

.hero-logo-wrap{
    width:150px;
    height:150px;

    display:grid;

    place-items:center;

    position:relative;

    transform-style:preserve-3d;

    animation:
        floatingLogo 5s ease-in-out infinite;
}

.hero-logo-wrap::before{
    content:"";

    position:absolute;

    inset:15px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            color-mix(
                in srgb,
                var(--league) 22%,
                transparent
            ),
            transparent 70%
        );

    filter:blur(15px);
}

.hero-logo{
    position:relative;

    width:140px;
    height:140px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 25px 25px rgba(0,0,0,.55)
        )
        drop-shadow(
            0 0 30px
            color-mix(
                in srgb,
                var(--league) 20%,
                transparent
            )
        );

    transition:.5s var(--ease);
}

.hero-logo-wrap:hover .hero-logo{
    transform:
        scale(1.08)
        rotateY(10deg)
        rotateZ(2deg);
}

@keyframes floatingLogo{
    0%,100%{
        transform:
            translateY(0)
            rotateZ(0);
    }

    50%{
        transform:
            translateY(-8px)
            rotateZ(-1deg);
    }
}

.hero-kicker{
    display:flex;

    align-items:center;

    gap:8px;

    margin-bottom:9px;

    color:#748399;

    font-size:9px;

    font-weight:900;

    letter-spacing:1.8px;
}

.hero-dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:var(--league);

    box-shadow:
        0 0 15px var(--league);

    animation:
        dotPulse 1.5s infinite;
}

@keyframes dotPulse{
    50%{
        transform:scale(1.4);

        opacity:.5;
    }
}

.hero-title{
    color:#fff;

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size:72px;

    line-height:.82;

    font-weight:900;

    text-transform:uppercase;

    letter-spacing:-1px;
}

.hero-country{
    margin-top:14px;

    color:#728095;

    font-size:10px;

    font-weight:800;

    letter-spacing:1px;
}

.hero-stats{
    display:flex;

    gap:10px;
}

.stat{
    min-width:100px;

    padding:
        15px 17px;

    text-align:center;

    border:
        1px solid rgba(255,255,255,.065);

    border-radius:15px;

    background:
        rgba(255,255,255,.025);
}

.stat strong{
    display:block;

    color:#fff;

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size:28px;

    font-weight:900;
}

.stat span{
    color:#66768a;

    font-size:7px;

    font-weight:900;

    letter-spacing:1px;
}

/* =========================================================
   FILTERS
========================================================= */

.controls{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin-top:30px;

    margin-bottom:20px;
}

.filters{
    display:flex;

    gap:8px;

    overflow-x:auto;

    scrollbar-width:none;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filter{
    flex:none;

    padding:
        10px 16px;

    color:#68778a;

    border:
        1px solid rgba(255,255,255,.065);

    border-radius:11px;

    background:
        rgba(255,255,255,.025);

    cursor:pointer;

    font-family:inherit;

    font-size:8px;

    font-weight:900;

    transition:.3s var(--ease);
}

.filter:hover,
.filter.active{
    color:#fff;

    border-color:
        color-mix(
            in srgb,
            var(--league) 40%,
            transparent
        );

    background:
        color-mix(
            in srgb,
            var(--league) 10%,
            transparent
        );

    box-shadow:
        0 8px 25px
        color-mix(
            in srgb,
            var(--league) 8%,
            transparent
        );
}

.result-count{
    flex:none;

    color:#58677a;

    font-size:8px;

    font-weight:900;
}

/* =========================================================
   MATCH GRID
========================================================= */

.matches{
    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap:17px;
}

/* =========================================================
   MATCH CARD
========================================================= */

.match-card{
    position:relative;

    min-height:315px;

    overflow:hidden;

    border:
        1px solid rgba(255,255,255,.075);

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            #0b121b,
            #060a10
        );

    transition:
        transform .5s var(--ease),
        border-color .35s,
        box-shadow .5s;

    transform-style:preserve-3d;
}

.match-card::before{
    content:"";

    position:absolute;

    inset:0;

    opacity:0;

    background:
        radial-gradient(
            350px circle at var(--mx,50%) var(--my,50%),
            color-mix(
                in srgb,
                var(--league) 11%,
                transparent
            ),
            transparent 55%
        );

    transition:.3s;

    pointer-events:none;
}

.match-card:hover::before{
    opacity:1;
}

.match-card:hover{
    transform:
        translateY(-9px)
        scale(1.008);

    border-color:
        color-mix(
            in srgb,
            var(--league) 32%,
            transparent
        );

    box-shadow:
        0 35px 70px rgba(0,0,0,.5),
        0 0 35px
        color-mix(
            in srgb,
            var(--league) 7%,
            transparent
        );
}

.card-glow{
    position:absolute;

    top:0;
    left:8%;
    right:8%;

    height:3px;

    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--league),
            transparent
        );

    transform:
        scaleX(.25);

    transition:.6s var(--ease);

    box-shadow:
        0 0 15px var(--league);
}

.match-card:hover .card-glow{
    transform:scaleX(1);
}

.match-content{
    position:relative;

    z-index:3;

    height:315px;

    padding:19px;

    display:flex;

    flex-direction:column;
}

.match-top{
    display:flex;

    justify-content:space-between;

    align-items:center;
}

.match-league-tag{
    padding:
        7px 9px;

    color:#8290a2;

    border:
        1px solid rgba(255,255,255,.06);

    border-radius:8px;

    background:
        rgba(255,255,255,.025);

    font-size:8px;

    font-weight:900;
}

.match-status{
    display:flex;

    align-items:center;

    gap:6px;

    color:#45adff;

    font-size:8px;

    font-weight:900;

    letter-spacing:1px;
}

.match-status::before{
    content:"";

    width:5px;
    height:5px;

    border-radius:50%;

    background:#45adff;

    box-shadow:
        0 0 10px #45adff;
}

/* =========================================================
   TEAMS
========================================================= */

.teams{
    flex:1;

    display:grid;

    grid-template-columns:
        1fr auto 1fr;

    align-items:center;

    gap:10px;
}

.team{
    display:flex;

    flex-direction:column;

    align-items:center;

    gap:11px;
}

.team-logo{
    width:78px;
    height:78px;

    display:grid;

    place-items:center;

    color:#fff;

    border:
        1px solid rgba(255,255,255,.09);

    border-radius:23px;

    background:
        linear-gradient(
            145deg,
            #1a2837,
            #070c13
        );

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size:17px;

    font-weight:900;

    box-shadow:
        0 20px 35px rgba(0,0,0,.45),
        inset 0 1px 1px rgba(255,255,255,.1);

    transition:.5s var(--ease);
}

.match-card:hover .team-logo{
    transform:
        translateY(-7px)
        scale(1.07);

    box-shadow:
        0 25px 35px rgba(0,0,0,.55),
        0 0 22px
        color-mix(
            in srgb,
            var(--league) 10%,
            transparent
        );
}

.team-name{
    max-width:105px;

    color:#d6dfe9;

    text-align:center;

    font-size:9px;

    line-height:1.3;

    font-weight:800;
}

.vs{
    width:34px;
    height:34px;

    display:grid;

    place-items:center;

    color:#667589;

    border:
        1px solid rgba(255,255,255,.065);

    border-radius:50%;

    background:
        rgba(255,255,255,.025);

    font-size:7px;

    font-weight:900;
}

.match-bottom{
    display:flex;

    justify-content:space-between;

    align-items:center;

    padding-top:14px;

    border-top:
        1px solid rgba(255,255,255,.055);
}

.match-date{
    color:#68778a;

    font-size:8px;

    font-weight:800;
}

.watch-btn{
    display:flex;

    align-items:center;

    gap:7px;

    padding:
        9px 13px;

    color:#fff;

    text-decoration:none;

    border-radius:9px;

    background:
        linear-gradient(
            135deg,
            var(--league),
            #075fb6
        );

    box-shadow:
        0 8px 22px
        color-mix(
            in srgb,
            var(--league) 20%,
            transparent
        );

    font-size:8px;

    font-weight:900;

    transition:.35s var(--ease);
}

.watch-btn:hover{
    transform:
        translateY(-3px);

    box-shadow:
        0 14px 30px
        color-mix(
            in srgb,
            var(--league) 30%,
            transparent
        );
}

/* =========================================================
   LOADING
========================================================= */

.loader{
    display:none;

    justify-content:center;

    align-items:center;

    padding:35px;
}

.loader.show{
    display:flex;
}

.loader-ring{
    width:35px;
    height:35px;

    border:
        3px solid rgba(255,255,255,.08);

    border-top-color:
        var(--league);

    border-radius:50%;

    animation:
        spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.empty{
    display:none;

    padding:70px 20px;

    text-align:center;

    border:
        1px solid rgba(255,255,255,.06);

    border-radius:22px;

    background:
        rgba(255,255,255,.02);
}

.empty.show{
    display:block;
}

.empty-icon{
    font-size:35px;

    margin-bottom:15px;

    opacity:.4;
}

.empty h3{
    color:#fff;

    font-size:16px;
}

.empty p{
    margin-top:7px;

    color:#68778a;

    font-size:9px;
}

/* =========================================================
   FOOTER
========================================================= */

.footer{
    width:
        min(
            1480px,
            calc(100% - 40px)
        );

    margin:
        80px auto 25px;

    padding-top:25px;

    display:flex;

    justify-content:space-between;

    border-top:
        1px solid rgba(255,255,255,.055);

    color:#4f5d70;

    font-size:8px;
}

.footer-logo{
    color:#8593a4;

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size:25px;

    font-weight:900;

    letter-spacing:2px;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1150px){

    .matches{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

    .hero-content{
        grid-template-columns:
            130px 1fr;

        padding:30px;
    }

    .hero-logo-wrap{
        width:120px;
        height:120px;
    }

    .hero-logo{
        width:110px;
        height:110px;
    }

    .hero-stats{
        grid-column:1/-1;
    }

}

@media(max-width:760px){

    .header{
        height:62px;
    }

    .header-inner{
        width:
            calc(100% - 24px);

        gap:12px;
    }

    .logo{
        font-size:34px;
    }

    .main-nav{
        display:none;
    }

    .search{
        width:170px;

        height:38px;

        margin-left:auto;
    }

    .main{
        width:
            calc(100% - 24px);

        margin-top:25px;
    }

    .league-hero{
        min-height:350px;
    }

    .hero-content{
        display:flex;

        flex-direction:column;

        text-align:center;

        padding:30px 20px;
    }

    .hero-logo-wrap{
        width:110px;
        height:110px;
    }

    .hero-logo{
        width:105px;
        height:105px;
    }

    .hero-title{
        font-size:54px;
    }

    .hero-stats{
        width:100%;

        justify-content:center;
    }

    .stat{
        flex:1;

        min-width:0;
    }

    .matches{
        grid-template-columns:1fr;
    }

    .controls{
        align-items:flex-start;

        flex-direction:column;
    }

    .result-count{
        margin-left:3px;
    }

    .footer{
        width:
            calc(100% - 24px);

        flex-direction:column;

        gap:10px;
    }

}

@media(max-width:400px){

    .search{
        width:135px;
    }

    .hero-title{
        font-size:48px;
    }

}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation:none!important;

        transition:none!important;
    }

}

</style>
</head>

<body>

<div class="ambient"></div>
<div class="ambient2"></div>

<header class="header">

<div class="header-inner">

<a href="index.html" class="logo">
CR<span>EX</span>
</a>

<nav class="main-nav">

<a href="index.html">
ANA SAYFA
</a>

<a href="#matches" class="active">
MAÇLAR
</a>

<a href="index.html#leagues">
LİGLER
</a>

</nav>

<div class="search">

<svg viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<circle cx="11" cy="11" r="7"></circle>

<path d="m20 20-4-4"></path>

</svg>

<input
id="searchInput"
type="search"
placeholder="Takım veya maç ara..."
autocomplete="off">

</div>

</div>

</header>


<main class="main">

<!-- =====================================================
     LEAGUE HERO
====================================================== -->

<section class="league-hero">

<div class="hero-bg"></div>

<h3>

</h3>

<p>
Arama veya filtre kriterlerini değiştirmeyi deneyin.
</p>

</div>

<script>

/* =========================================================
   CREX LEAGUE SYSTEM
========================================================= */

const params =
new URLSearchParams(
window.location.search
);

const leagueSlug =
params.get("lig") ||
"premier-league";


/* =========================================================
   LEAGUE DATABASE
========================================================= */

const leagues = {

"premier-league":{
    name:"Premier League",
    country:"İngiltere",
    logo:"https://download.logo.wine/logo/Premier_League/Premier_League-Logo.wine.png",
    color:"#9846d7"
},

"la-liga":{
    name:"La Liga",
    country:"İspanya",
    logo:"https://upload.wikimedia.org/wikipedia/commons/2/20/LaLiga_2023_Vertical_Logo.svg",
    color:"#ef4937"
},

"serie-a":{
    name:"Serie A",
    country:"İtalya",
    logo:"https://upload.wikimedia.org/wikipedia/commons/thumb/e/e9/Serie_A_logo_2022.svg/1280px-Serie_A_logo_2022.svg.png",
    color:"#168cff"
},

"bundesliga":{
    name:"Bundesliga",
    country:"Almanya",
    logo:"https://assets.football-logos.cc/logos/germany/1500x1500/bundesliga.77719ba2.png",
    color:"#e51c35"
},

"ligue-1":{
    name:"Ligue 1",
    country:"Fransa",
    logo:"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Ligue_1_2024_Logo.png/960px-Ligue_1_2024_Logo.png",
    color:"#159fe8"
},

"super-lig":{
    name:"Süper Lig",
    country:"Türkiye",
    logo:"https://upload.wikimedia.org/wikipedia/tr/archive/5/5e/20260826234136%21Trendyol-super-lig-dikey-logo.png",
    color:"#e51d3b"
},

"champions-league":{
    name:"Champions League",
    country:"UEFA",
    logo:"https://commons.wikimedia.org/wiki/Special:Redirect/file/UEFA_Champions_League_logo.png",
    color:"#426dff"
},

"europa-league":{
    name:"Europa League",
    country:"UEFA",
    logo:"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/UEFA_Europa_League_logo_%282024_version%29.svg/960px-UEFA_Europa_League_logo_%282024_version%29.svg.png",
    color:"#ff7417"
},

"conference-league":{
    name:"Conference League",
    country:"UEFA",
    logo:"https://assets.football-logos.cc/logos/tournaments/700x700/uefa-conference-league.4a977457.png",
    color:"#18b98b"
},

"eredivisie":{
    name:"Eredivisie",
    country:"Hollanda",
    logo:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Eredivisie_nieuw_logo_2017-.svg",
    color:"#ed5b21"
}

};


/* =========================================================
   ELEMENTS
========================================================= */

const league =
leagues[leagueSlug] ||
leagues["premier-league"];

document.documentElement.style
.setProperty(
    "--league",
    league.color
);

const heroLogo =
document.getElementById("heroLogo");

const leagueTitle =
document.getElementById("leagueTitle");

const leagueCountry =
document.getElementById("leagueCountry");

const matchGrid =
document.getElementById("matchGrid");

const searchInput =
document.getElementById("searchInput");

const empty =
document.getElementById("empty");

const loader =
document.getElementById("loader");

const resultCount =
document.getElementById("resultCount");

const totalMatches =
document.getElementById("totalMatches");

const upcomingMatches =
document.getElementById("upcomingMatches");


/* =========================================================
   SET LEAGUE HEADER
========================================================= */

document.title =
"CREX — " + league.name;

heroLogo.src =
league.logo;

heroLogo.alt =
league.name;

leagueTitle.textContent =
league.name;

leagueCountry.textContent =
league.country +
" • CREX MAÇ MERKEZİ";


/* =========================================================
   DATA
========================================================= */

let allMatches = [];

let filteredMatches = [];

let currentFilter = "all";

let renderedCount = 0;

const PAGE_SIZE = 24;


/* =========================================================
   JSON PATH
========================================================= */

const jsonPath =
"./data/ligler/" +
leagueSlug +
".json";


/* =========================================================
   DATE PARSER
========================================================= */

function parseDate(value){

    if(!value)
        return null;

    const date =
        new Date(value);

    if(
        Number.isNaN(
            date.getTime()
        )
    ){
        return null;
    }

    return date;
}


/* =========================================================
   STATUS
========================================================= */

function getMatchStatus(match){

    if(match.status)
        return match.status;

    const date =
        parseDate(
            match.date
        );

    if(!date)
        return "upcoming";

    return date < new Date()
        ? "finished"
        : "upcoming";
}


/* =========================================================
   DATE FORMAT
========================================================= */

function formatDate(value){

    const date =
        parseDate(value);

    if(!date)
        return value || "TARİH YOK";

    return new Intl.DateTimeFormat(
        "tr-TR",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    ).format(date);
}


/* =========================================================
   LOAD JSON
========================================================= */

async function loadMatches(){

    loader.classList.add("show");

    try{

        const response =
            await fetch(
                jsonPath,
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "JSON bulunamadı: " +
                response.status
            );

        }

        const data =
            await response.json();

        /*
           JSON şu iki formattan biri olabilir:

           [
              {...},
              {...}
           ]

           veya

           {
              "matches":[...]
           }
        */

        if(Array.isArray(data)){

            allMatches = data;

        }else if(
            Array.isArray(
                data.matches
            )
        ){

            allMatches =
                data.matches;

        }else{

            throw new Error(
                "JSON formatı geçersiz."
            );

        }

        updateStats();

        applyFilters();

    }catch(error){

        console.error(error);

        allMatches = [];

        filteredMatches = [];

        renderMatches();

        leagueCountry.textContent =
            league.country +
            " • MAÇ VERİSİ BULUNAMADI";

    }finally{

        loader.classList.remove("show");

    }

}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

    const total =
        allMatches.length;

    const upcoming =
        allMatches.filter(
            match =>
                getMatchStatus(match)
                === "upcoming"
        ).length;

    totalMatches.textContent =
        total.toLocaleString("tr-TR");

    upcomingMatches.textContent =
        upcoming.toLocaleString("tr-TR");

}


/* =========================================================
   FILTER
========================================================= */

function applyFilters(){

    const query =
        searchInput.value
        .toLocaleLowerCase("tr-TR")
        .trim();

    filteredMatches =
        allMatches.filter(match=>{

            const status =
                getMatchStatus(match);

            const filterOK =
                currentFilter === "all" ||
                status === currentFilter;

            if(!filterOK)
                return false;

            if(!query)
                return true;

            const searchable = [

                match.home,
                match.away,
                match.homeTeam,
                match.awayTeam,
                match.league,
                match.date

            ]
            .filter(Boolean)
            .join(" ")
            .toLocaleLowerCase(
                "tr-TR"
            );

            return searchable.includes(
                query
            );

        });

    renderedCount = 0;

    matchGrid.innerHTML = "";

    renderNextPage();

    resultCount.textContent =
        filteredMatches.length
        .toLocaleString("tr-TR") +
        " MAÇ";

}


/* =========================================================
   MATCH CARD
========================================================= */

function createMatchCard(match,index){

    const home =
        match.home ||
        match.homeTeam ||
        "Ev Sahibi";

    const away =
        match.away ||
        match.awayTeam ||
        "Deplasman";

    const homeLogo =
        match.homeLogo ||
        match.home_logo ||
        "";

    const awayLogo =
        match.awayLogo ||
        match.away_logo ||
        "";

    const status =
        getMatchStatus(match);

    const matchId =
        match.id ??
        index + 1;

    const date =
        formatDate(
            match.date
        );

    const card =
        document.createElement(
            "article"
        );

    card.className =
        "match-card";

    card.dataset.search =
        [
            home,
            away,
            league.name
        ].join(" ");

    card.innerHTML = `

        <div class="card-glow"></div>

        <div class="match-content">

            <div class="match-top">

                <div class="match-league-tag">
                    ${escapeHTML(league.name)}
                </div>

                <div class="match-status">

                    ${
                        status === "finished"
                        ? "TAMAMLANDI"
                        : "YAKLAŞIYOR"
                    }

                </div>

            </div>


            <div class="teams">

                <div class="team">

                    <div class="team-logo">

                        ${
                            homeLogo

                            ? `
                            <img
                                src="${escapeAttr(homeLogo)}"
                                alt="${escapeAttr(home)}"
                                loading="lazy"
                                onerror="this.style.display='none';this.parentElement.classList.add('text-logo')"
                            >
                            `

                            : escapeHTML(
                                getInitials(home)
                            )
                        }

                    </div>

                    <div class="team-name">
                        ${escapeHTML(home)}
                    </div>

                </div>


                <div class="vs">
                    VS
                </div>


                <div class="team">

                    <div class="team-logo">

                        ${
                            awayLogo

                            ? `
                            <img
                                src="${escapeAttr(awayLogo)}"
                                alt="${escapeAttr(away)}"
                                loading="lazy"
                                onerror="this.style.display='none';this.parentElement.classList.add('text-logo')"
                            >
                            `

                            : escapeHTML(
                                getInitials(away)
                            )
                        }

                    </div>

                    <div class="team-name">
                        ${escapeHTML(away)}
                    </div>

                </div>

            </div>


            <div class="match-bottom">

                <div class="match-date">
                    ${escapeHTML(date)}
                </div>

                <a
                    href="mac.html?id=${encodeURIComponent(matchId)}"
                    class="watch-btn"
                >
                    MAÇA GİT →
                </a>

            </div>

        </div>

    `;

    return card;

}


/* =========================================================
   RENDER NEXT PAGE
========================================================= */

function renderNextPage(){

    if(
        renderedCount >=
        filteredMatches.length
    ){

        if(
            filteredMatches.length === 0
        ){

            empty.classList.add("show");

        }else{

            empty.classList.remove("show");

        }

        return;

    }

    empty.classList.remove("show");

    const next =
        filteredMatches.slice(
            renderedCount,
            renderedCount + PAGE_SIZE
        );

    const fragment =
        document.createDocumentFragment();

    next.forEach(
        (match,index)=>{

            const card =
                createMatchCard(
                    match,
                    renderedCount + index
                );

            fragment.appendChild(card);

            requestAnimationFrame(()=>{

                card.animate(
                    [
                        {
                            opacity:0,
                            transform:
                                "translateY(22px) scale(.97)"
                        },
                        {
                            opacity:1,
                            transform:
                                "translateY(0) scale(1)"
                        }
                    ],
                    {
                        duration:550,
                        delay:
                            Math.min(
                                index * 45,
                                350
                            ),
                        easing:
                            "cubic-bezier(.16,1,.3,1)",
                        fill:"both"
                    }
                );

            });

        }
    );

    matchGrid.appendChild(
        fragment
    );

    renderedCount +=
        next.length;

}


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
"input",
()=>{
    applyFilters();
}
);


/* =========================================================
   FILTER BUTTONS
========================================================= */

document
.querySelectorAll(".filter")
.forEach(button=>{

    button.addEventListener(
        "click",
        ()=>{

            document
            .querySelectorAll(
                ".filter"
            )
            .forEach(
                btn =>
                btn.classList.remove(
                    "active"
                )
            );

            button.classList.add(
                "active"
            );

            currentFilter =
                button.dataset.filter;

            applyFilters();

        }
    );

});


/* =========================================================
   INFINITE SCROLL
========================================================= */

const infiniteObserver =
new IntersectionObserver(
entries=>{

    entries.forEach(
        entry=>{

            if(
                entry.isIntersecting
            ){

                renderNextPage();

            }

        }
    );

},
{
    rootMargin:"500px"
}
);


/*
   Sayfanın sonuna görünmez
   sentinel ekliyoruz.
*/

const sentinel =
document.createElement("div");

sentinel.style.height =
"1px";

document
.querySelector("#matches")
.appendChild(
    sentinel
);

infiniteObserver.observe(
    sentinel
);


/* =========================================================
   CARD LIGHT EFFECT
========================================================= */

document.addEventListener(
"mousemove",
event=>{

    const card =
        event.target.closest(
            ".match-card"
        );

    if(!card)
        return;

    const rect =
        card.getBoundingClientRect();

    const x =
        ((event.clientX - rect.left)
        / rect.width) * 100;

    const y =
        ((event.clientY - rect.top)
        / rect.height) * 100;

    card.style.setProperty(
        "--mx",
        x + "%"
    );

    card.style.setProperty(
        "--my",
        y + "%"
    );

},
{
    passive:true
}
);


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================================
   ESCAPE ATTRIBUTE
========================================================= */

function escapeAttr(value){

    return escapeHTML(value);

}


/* =========================================================
   TEAM INITIALS
========================================================= */

function getInitials(name){

    const words =
        String(name)
        .trim()
        .split(/\s+/)
        .filter(Boolean);

    if(words.length === 1){

        return words[0]
            .slice(0,3)
            .toUpperCase();

    }

    return words
        .slice(0,3)
        .map(
            word =>
                word[0]
        )
        .join("")
        .toUpperCase();

}


/* =========================================================
   IMAGE FALLBACK
========================================================= */

document.addEventListener(
"error",
event=>{

    const img =
        event.target;

    if(
        img.tagName !== "IMG"
    )
        return;

    if(
        img.classList.contains(
            "hero-logo"
        )
    ){

        img.style.opacity =
            "0";

        return;

    }

    img.style.display =
        "none";

    if(
        img.parentElement
    ){

        img.parentElement
        .classList
        .add("text-logo");

    }

},
true
);


/* =========================================================
   INITIAL LOAD
========================================================= */

loadMatches();

</script>

</body>
   </html>
