<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı TV Yayın</title>
    <!-- MPEG-TS (MPEG Transport Stream) Oynatıcı Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d0d0d;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .player-wrapper {
            width: 100%;
            max-width: 960px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="player-wrapper">
        <video id="videoElement" controls autoplay muted playsinline></video>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        if (mpegts.getPluginSupport().isSupported()) {
          var videoElement = document.getElementById('videoElement');
          var player = mpegts.createPlayer({
            type: 'mse', // Media Source Extensions
            isLive: true,
            url: '/api/stream' // Proxy endpoint'imiz
          }, {
            enableStashBuffer: false,
            liveBufferLatencyChasing: true
          });

          player.attachMediaElement(videoElement);
          player.load();
          player.play().catch(function(error) {
            console.log("Otomatik oynatma engellendi, oynata basın:", error);
          });
        } else {
          alert('Tarayıcınız MPEG-TS akışlarını desteklemiyor.');
        }
      });
    </script>
</body>
</html>
