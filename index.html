<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FATBOK Dizi & Film</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<!-- Plyr Player CSS JS -->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080b11;
  --surface: rgba(15, 23, 42, 0.85);
  --border: rgba(255, 255, 255, 0.1);
  --accent:#e50914;
  --accent-glow:rgba(229, 9, 20, 0.3);
  --text:#ffffff;
  --muted:#94a3b8;
  --plyr-color-main: var(--accent);
  --plyr-video-background: #000000;
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Manrope',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

/* NAV */
nav{
  position:fixed;top:0;left:0;right:0;z-index:300;
  height:64px;
  background: rgba(8, 11, 17, 0.95);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;
  justify-content: space-between;
  padding:0 32px;
  backdrop-filter: blur(10px);
}
.nav-logo{
  font-family:'Barlow Condensed',sans-serif;
  font-size:28px;font-weight:900;letter-spacing:2px;
  color:var(--accent);
  cursor:pointer;
}
.nav-search{
  flex:1;max-width:360px;margin:0 auto;
  display:flex;align-items:center;gap:10px;
  background: rgba(255, 255, 255, 0.05);
  border:1px solid var(--border);
  border-radius:8px;padding:0 14px;height:40px;
}
.nav-search input{
  background:none;border:none;outline:none;
  color:var(--text);font-size:14px;width:100%;font-family:'Manrope',sans-serif;
}
.nav-search input::placeholder{color:var(--muted)}

/* LAYOUT */
.layout{
  display:grid;
  grid-template-columns:340px 1fr;
  margin-top:64px;
  height:calc(100vh - 64px);
}

/* SIDEBAR - DİZİ LİSTESİ */
.sidebar{
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  overflow:hidden;
}
.sidebar-header{
  padding:16px 20px;
  font-size:14px;font-weight:800;letter-spacing:1px;
  color:var(--muted);
  border-bottom:1px solid var(--border);
  text-transform:uppercase;
}
.media-list{
  flex:1;overflow-y:auto;padding:12px;
}
.media-card{
  display:flex;align-items:center;gap:14px;
  padding:12px;border-radius:10px;
  cursor:pointer;transition:all 0.2s;
  border:1px solid transparent;
  margin-bottom:6px;
  background: rgba(255, 255, 255, 0.02);
}
.media-card:hover{
  background: rgba(255, 255, 255, 0.06);
  border-color: rgba(255, 255, 255, 0.15);
}
.media-card.active{
  background: rgba(229, 9, 20, 0.15);
  border-color: var(--accent);
}
.media-poster{
  width:50px;height:70px;border-radius:6px;
  object-fit:cover;background:#1a2234;
}
.media-info{flex:1;min-width:0}
.media-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media-season{font-size:12px;color:var(--muted)}

/* PLAYER ALANI */
.player-container{
  display:flex;flex-direction:column;
  background:#000;
  position:relative;
  justify-content:center;
  align-items:center;
}
.video-wrapper{
  width:100%;height:100%;
  position:relative;
  display:flex;align-items:center;justify-content:center;
}
.plyr{width:100%!important;height:100%!important}

.no-media-selected{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  color:var(--muted);gap:12px;text-align:center;padding:20px;
}
.no-media-selected span { font-size: 48px; }

@media(max-width:768px){
  .layout{grid-template-columns:1fr;grid-template-rows:1fr 1fr;height:calc(100vh - 64px);}
}
</style>
</head>
<body>

<nav>
  <div class="nav-logo" onclick="location.reload()">FATBOK VOD</div>
  <div class="nav-search">
    <span>🔍</span>
    <input type="text" placeholder="Dizi veya film ara..." id="searchInput" oninput="filterMedia(this.value)"/>
  </div>
</nav>

<div class="layout">
  <!-- SOL TARAF: Dizi / Bölüm Listesi -->
  <div class="sidebar">
    <div class="sidebar-header">🎬 Game of Thrones Arşivi</div>
    <div class="media-list" id="mediaList"></div>
  </div>

  <!-- SAĞ TARAF: Oynatıcı -->
  <div class="player-container">
    <div id="noSelection" class="no-media-selected">
      <span>📺</span>
      <p>İzlemek istediğin bölümü soldaki listeden seç.</p>
    </div>
    <div class="video-wrapper" id="videoWrapper" style="display:none;">
      <video id="player" controls playsinline></video>
    </div>
  </div>
</div>

<script>
// Dizi ve Film Listesi (Game of Thrones Eklendi)
const mediaItems = [
  {
    id: 1,
    title: "Game of Thrones",
    season: "Sezon 1 • Bölüm 1",
    poster: "https://images.unsplash.com/photo-1514539079130-25950c84af65?w=300",
    stream: "https://one.makesomthingup.click/Fi3spDlpuHp1e4uXnFQnvJkT/master.m3u8"
  }
];

let plyrInstance = null;
let hlsInstance = null;

function initPlayer(url) {
  const noSelection = document.getElementById('noSelection');
  const videoWrapper = document.getElementById('videoWrapper');
  const videoElement = document.getElementById('player');

  noSelection.style.display = 'none';
  videoWrapper.style.display = 'flex';

  if (!plyrInstance) {
    plyrInstance = new Plyr('#player', {
      controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen']
    });
  }

  if (hlsInstance) {
    hlsInstance.destroy();
    hlsInstance = null;
  }

  if (url.includes('.m3u8')) {
    if (Hls.isSupported()) {
      hlsInstance = new Hls();
      hlsInstance.loadSource(url);
      hlsInstance.attachMedia(videoElement);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
        videoElement.play().catch(() => {});
      });
    } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
      videoElement.src = url;
      videoElement.play().catch(() => {});
    }
  } else {
    videoElement.src = url;
    videoElement.play().catch(() => {});
  }
}

function renderList(filter = "") {
  const listContainer = document.getElementById('mediaList');
  listContainer.innerHTML = "";

  const filtered = mediaItems.filter(item => item.title.toLowerCase().includes(filter.toLowerCase()));

  filtered.forEach(item => {
    const card = document.createElement('div');
    card.className = `media-card ${window.activeMediaId === item.id ? 'active' : ''}`;
    card.innerHTML = `
      <img src="${item.poster}" class="media-poster" alt="${item.title}"/>
      <div class="media-info">
        <div class="media-title">${item.title}</div>
        <div class="media-season">${item.season}</div>
      </div>
    `;
    card.onclick = () => {
      window.activeMediaId = item.id;
      renderList(document.getElementById('searchInput').value);
      initPlayer(item.stream);
    };
    listContainer.appendChild(card);
  });
}

function filterMedia(query) {
  renderList(query);
}

// İlk açılışta listeyi doldur
renderList();
</script>

</body>
</html>
