<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FATBOK</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<!-- Plyr Player CSS JS-->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#02050f;
  --surface: rgba(10, 15, 30, 0.85);
  --surface2: rgba(255, 255, 255, 0.03);
  --surface3: rgba(0, 122, 255, 0.2);
  --border: rgba(255, 255, 255, 0.14);
  --border2: rgba(0, 122, 255, 0.5);
  --accent:#007aff;
  --accent-glow:rgba(0, 122, 255, 0.2);
  --blue:#0055ff;
  --text:#ffffff;
  --muted:#7ba1d5;
  --muted2:#94a3b8;
  --ambient-glow-color: rgba(0, 122, 255, 0.35);
  
  --plyr-color-main: var(--accent);
  --plyr-video-background: #000000;
}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Manrope',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  position: relative;
}

/* ─── ARKA PLAN ─── */
.liquid-bg {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: -1;
  overflow: hidden;
  background: radial-gradient(circle at 50% 50%, #030a1e 0%, #010307 100%);
  contain: strict;
}
.liquid-bg::before, .liquid-bg::after {
  content: '';
  position: absolute;
  width: 600px; height: 600px;
  border-radius: 50%;
  background: linear-gradient(135deg, #002266, #0055ff);
  filter: blur(80px);
  opacity: 0.35;
  will-change: transform;
  transform: translateZ(0);
  animation: liquidFloat 25s infinite ease-in-out;
}
.liquid-bg::after {
  background: linear-gradient(135deg, #001133, #007aff);
  right: -50px; top: -50px;
  width: 500px; height: 500px;
  opacity: 0.2;
  animation: liquidFloat 30s infinite ease-in-out reverse;
  animation-delay: -5s;
}

@keyframes liquidFloat {
  0% { transform: translate3d(-20px, -20px, 0) scale(1); }
  50% { transform: translate3d(30px, 20px, 0) scale(1.08); }
  100% { transform: translate3d(-20px, -20px, 0) scale(1); }
}

/* ─── NAV ─── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:300;
  height:58px;
  background: rgba(2, 6, 18, 0.92);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;
  justify-content: space-between;
  padding:0 24px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  contain: layout style;
}
.nav-logo{
  font-family:'Barlow Condensed',sans-serif;
  font-size:24px;font-weight:800;letter-spacing:3px;
  background:linear-gradient(135deg,#ffffff 30%,var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  white-space:nowrap;flex-shrink:0;
  width: 150px;
  cursor: pointer;
  user-select: none;
  transition: transform 0.2s;
}
.nav-logo:active { transform: scale(0.95); }
.nav-search{
  flex:1;
  max-width:320px;
  display:flex;align-items:center;gap:10px;
  background: rgba(255, 255, 255, 0.06);
  border:1px solid var(--border);
  border-radius:8px;padding:0 14px;height:36px;
  box-shadow: inset 0 1px 4px rgba(0,0,0,0.3);
  margin: 0 auto;
}
.nav-search input{
  background:none;border:none;outline:none;
  color:var(--text);font-size:13px;font-family:'Manrope',sans-serif;
  width:100%;
}
.nav-search input::placeholder{color:var(--muted)}
.search-icon{color:var(--muted);font-size:14px;flex-shrink:0}
.nav-spacer { width: auto; flex-shrink: 0; display: flex; align-items: center; justify-content: flex-end; }
.live-dot{width:7px;height:7px;background:#34c759;border-radius:50%;opacity:0.9;}

/* Retro Arcade Butonu */
.btn-arcade {
  background: linear-gradient(135deg, #ff0055, #ff5500);
  border: 1px solid #ffaa00;
  color: #fff;
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 0 12px rgba(255, 85, 0, 0.4);
  transition: all 0.2s ease;
  animation: pulseArcade 2s infinite ease-in-out;
}
.btn-arcade:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px rgba(255, 0, 85, 0.8);
}
@keyframes pulseArcade {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.03); }
}

/* ─── RETRO ARCADE MODAL ─── */
.arcade-modal {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(10px);
  z-index: 99999;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
}
.arcade-modal.active {
  opacity: 1;
  visibility: visible;
}
.arcade-box {
  background: #0d0f1a;
  border: 3px solid #ff0055;
  box-shadow: 0 0 30px rgba(255, 0, 85, 0.5), inset 0 0 15px rgba(0, 255, 204, 0.2);
  border-radius: 16px;
  padding: 20px;
  width: 90%;
  max-width: 500px;
  text-align: center;
  position: relative;
  font-family: 'Press Start 2P', monospace;
  color: #fff;
  user-select: none;
}
.arcade-close {
  position: absolute;
  top: 12px; right: 16px;
  background: none; border: none;
  color: #ff0055; font-size: 20px; font-weight: bold;
  cursor: pointer;
}
.arcade-title {
  font-size: 14px;
  color: #ff0055;
  text-shadow: 2px 2px #00ffff;
  margin-bottom: 12px;
}
.arcade-score {
  font-size: 10px;
  color: #00ffcc;
  margin-bottom: 15px;
}
#gameCanvas {
  background: #111;
  border: 2px solid #333;
  border-radius: 8px;
  display: block;
  margin: 0 auto;
  cursor: crosshair;
  max-width: 100%;
  touch-action: none;
}
.arcade-instructions {
  font-size: 8px;
  color: #aaa;
  margin-top: 12px;
  line-height: 1.5;
}

/* ─── NETFLIX INTRO OVERLAY (İLK GİRİŞ ANİMASYONU) ─── */
.netflix-intro-overlay {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  background: #000000;
  z-index: 999999;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 1;
  visibility: visible;
  transition: opacity 0.5s ease, visibility 0.5s ease;
  overflow: hidden;
}
.netflix-intro-overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.intro-text-box {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: clamp(60px, 15vw, 180px);
  font-weight: 900;
  letter-spacing: 4px;
}

.f-wrapper {
  position: relative;
  display: inline-block;
  line-height: 1;
  transform-origin: center center;
  z-index: 2;
  animation: zoomF 2.5s cubic-bezier(0.25, 1, 0.3, 1) forwards;
}

.intro-f {
  position: relative;
  color: #007aff;
  display: inline-block;
  background: linear-gradient(180deg, #ffffff 0%, #00d2ff 50%, #0055ff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 25px rgba(0, 122, 255, 0.9));
}

.intro-rest {
  color: #ffffff;
  background: linear-gradient(180deg, #ffffff 30%, #a0a0a0 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: inline-block;
  white-space: nowrap;
  overflow: hidden;
  vertical-align: bottom;
  transform-origin: left center;
  animation: fadeOutRest 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

@keyframes fadeOutRest {
  0% { opacity: 1; max-width: 500px; }
  40% { opacity: 0.5; }
  100% { opacity: 0; max-width: 0px; }
}

@keyframes zoomF {
  0% { transform: scale(1); }
  25% { transform: scale(1.1); }
  60% { transform: scale(3.5); opacity: 1; }
  90% { opacity: 0.8; }
  100% { transform: scale(65); opacity: 0; }
}

/* ─── LAYOUT ─── */
.layout{
  display:grid;
  grid-template-columns:320px 1fr;
  margin-top:58px;
  height:calc(100vh - 58px);
  transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
}
.layout.theater-active { grid-template-columns: 0px 1fr; }

/* ─── CHANNEL SIDEBAR ─── */
.ch-sidebar{
  background: var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  overflow:hidden;
  box-shadow: 5px 0 20px rgba(0, 0, 0, 0.3);
  transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s;
  contain: layout style;
}
.layout.theater-active .ch-sidebar {
  transform: translateX(-320px);
  opacity: 0;
  pointer-events: none;
}

.country-filter-wrap{
  padding: 10px 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  overflow-x: auto;
  display: flex;
  gap: 6px;
}
.country-filter-wrap::-webkit-scrollbar { height: 3px; }
.country-filter-wrap::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.15);
  border-radius: 10px;
}
.country-btn{
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text);
  font-size: 12px; font-weight: 600;
  cursor: pointer; white-space: nowrap;
  transition: background 0.2s;
}
.country-btn:hover{
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(255, 255, 255, 0.3);
}
.country-btn.active{
  background: var(--accent);
  border-color: var(--accent);
}
.country-btn .flag-icon { font-size: 14px; }

.ch-list{
  flex:1;overflow-y:auto;padding:8px;
  position: relative;
  will-change: scroll-position;
}
.ch-list::-webkit-scrollbar{width:4px}
.ch-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:2px}

.ch-card{
  display:flex;align-items:center;gap:12px;
  padding:12px;border-radius:8px;
  cursor:pointer;transition:background .18s, border-color .18s;
  border:1px solid transparent;
  margin-bottom:4px;
  background: rgba(255, 255, 255, 0.02);
  position: relative;
  overflow: hidden;
  contain: content;
}
.ch-card:hover{
  background: rgba(255, 255, 255, 0.09);
  border-color: rgba(255, 255, 255, 0.25);
}
.ch-card.active{
  background: var(--surface3);
  border-color: var(--accent);
}

.ch-card-flag {
  font-size: 16px; flex-shrink: 0;
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.04);
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.08);
}

.ch-logo{
  width:44px;height:44px;border-radius:8px;
  background: rgba(255, 255, 255, 0.98);
  border:1px solid rgba(255,255,255,0.5);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;flex-shrink:0;padding:4px;
}
.ch-logo img{ max-width:100%;max-height:100%;object-fit:contain; }
.ch-info{flex:1;min-width:0}
.ch-name{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-live-badge{ flex-shrink:0;width:7px;height:7px;background:#34c759;border-radius:50%; }

/* REKLAM ALANI */
.adv-panel{
  padding:12px;
  border-top:1px solid var(--border);
  background: rgba(0, 0, 0, 0.4);
  flex-shrink:0;
  display:flex; justify-content:center; align-items:center;
}
.adv-link{ text-decoration: none; width: 100%; max-width: 300px; display: block; }
.adv-box{
  width:100%; height:100px;
  background: rgba(0, 0, 0, 0.3);
  border:1px dashed rgba(255,255,255,0.25);
  border-radius:6px;
  display:flex; align-items:center; justify-content:center;
  color:var(--muted2);
  font-size:12px; font-weight:600; letter-spacing:0.5px;
  text-align:center; cursor:pointer;
  transition:border-color 0.2s, background 0.2s;
}
.adv-box:hover{
  border-color:var(--accent);
  color:var(--text);
  background: rgba(0, 122, 255, 0.08);
}

/* ─── PLAYER AREA ─── */
.player-area{
  display:flex;flex-direction:column;
  overflow:hidden;
  background:transparent;
  position: relative;
  contain: layout style;
}

.ambient-glow {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate3d(-50%, -50%, 0);
  width: 100%; height: 100%;
  background: var(--ambient-glow-color);
  filter: blur(80px);
  opacity: 0.4;
  z-index: 1;
  pointer-events: none;
}

.now-header{
  padding:14px 24px;
  background: rgba(2, 6, 18, 0.85);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;
  flex-shrink:0; min-height:77px; z-index:5;
}
.now-logo{
  width:48px;height:48px;border-radius:10px;
  background: rgba(255, 255, 255, 0.98);
  border:1px solid rgba(255,255,255,0.5);
  display:none; align-items:center;justify-content:center;
  overflow:hidden;padding:5px;flex-shrink:0;
}
.now-logo img{ max-width:100%;max-height:100%;object-fit:contain; }
.now-info{flex:1; display:flex; align-items:center; gap:12px;}
.now-ch-name{ font-family:'Barlow Condensed',sans-serif; font-size:22px;font-weight:800;letter-spacing:1px; }

.btn-theater {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 12px; border-radius: 6px;
  cursor: pointer; font-size: 14px; font-weight: 600;
  display: flex; align-items: center; gap: 6px;
  transition: background 0.2s, border-color 0.2s;
}
.btn-theater:hover { background: var(--accent); border-color: var(--accent); }
.btn-theater.active { background: rgba(255, 255, 255, 0.2); border-color: rgba(255, 255, 255, 0.4); }

.now-badges{display:flex;gap:8px;margin-left:auto}
.badge{ padding:5px 12px;border-radius:6px; font-size:11px;font-weight:700;letter-spacing:1px; }
.badge-live{background:rgba(0, 122, 255, 0.15);color:var(--accent);border:1px solid rgba(0, 122, 255, 0.3);display:flex;align-items:center;gap:5px}

.video-wrap{ flex:1;background:#000;position:relative;overflow:hidden; z-index:5; }
iframe, .plyr-container-box{ width:100%; height:100%; border:none; display:none; background:#000; }
.vid-overlay{ position:absolute;inset:0; background: rgba(1, 3, 8, 0.95); z-index:10; }

.plyr { height: 100% !important; width: 100% !important; }
.plyr__video-wrapper { height: 100% !important; }

.adv-interstitial {
  position: absolute; inset: 0;
  background: rgba(2, 5, 15, 0.95);
  z-index: 20;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px; text-align: center;
}
.adv-interstitial-card {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  padding: 32px; border-radius: 16px;
  max-width: 420px; width: 100%;
  box-shadow: 0 12px 40px rgba(0,0,0,0.6);
}
.adv-interstitial h3 { font-size: 20px; font-weight: 800; margin-bottom: 8px; letter-spacing: 0.5px; }
.adv-interstitial p { color: var(--muted2); font-size: 13px; line-height: 1.6; margin-bottom: 24px; }
.btn-adv-action {
  background: var(--accent); color: #fff; border: none;
  padding: 12px 24px; border-radius: 8px; font-weight: 700; font-size: 14px;
  cursor: pointer; transition: background 0.2s; width: 100%;
}
.btn-adv-action:hover { background: #006ae6; }
.btn-adv-action.secondary { background: rgba(255, 255, 255, 0.1); border: 1px solid var(--border); margin-top: 10px; }
.btn-adv-action.secondary:hover { background: rgba(255, 255, 255, 0.15); }

@media(max-width:768px){
  .layout{ grid-template-columns:1fr; grid-template-rows: auto 1fr; height: calc(100vh - 58px); }
  .layout.theater-active { grid-template-columns: 1fr; grid-template-rows: calc(100vh - 58px) 0px; }
  .ch-sidebar{ max-height: 50vh; border-right:none; order:2; }
  .layout.theater-active .ch-sidebar { transform: translateY(100%); max-height: 0px; opacity: 0; padding: 0; }
  .player-area{ order:1; height: 40vh; transition: height 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
  .layout.theater-active .player-area { height: calc(100vh - 58px); }
  nav{padding:0 14px}
  .nav-logo{ width: auto; }
  .nav-search{ max-width: 140px; margin: 0 10px 0 auto; }
  .nav-spacer { width: auto; }
  .btn-arcade span { display: none; }
  .btn-theater span { font-size: 16px; }
  .btn-theater { padding: 6px 10px; }
  .btn-theater text { display: none; }
}
</style>
</head>
<body>

<!-- İLK GİRİŞ ANİMASYONU OVERLAY -->
<div class="netflix-intro-overlay" id="netflixIntro">
  <div class="intro-text-box">
    <div class="f-wrapper">
      <span class="intro-f">F</span>
    </div><span class="intro-rest">ATBOK</span>
  </div>
</div>

<div class="liquid-bg"></div>

<nav>
  <div class="nav-logo" onclick="replayIntro()">FATBOK</div>
  <div class="nav-search">
    <span class="search-icon">🔍</span>
    <input type="text" placeholder="Kanal ara..." id="searchInput" oninput="filterChannels(this.value)"/>
  </div>
  <div class="nav-spacer">
    <button class="btn-arcade" onclick="openArcadeGame()">🕹️ <span>DEVRE ARASI OYUN</span></button>
  </div> 
</nav>

<!-- ARCADE GAME MODAL -->
<div class="arcade-modal" id="arcadeModal">
  <div class="arcade-box">
    <button class="arcade-close" onclick="closeArcadeGame()">✕</button>
    <div class="arcade-title">3D RETRO PENALTI</div>
    <div class="arcade-score" id="arcadeScore">SKOR: 0 | REKOR: 0</div>
    <canvas id="gameCanvas" width="360" height="240"></canvas>
    <div class="arcade-instructions">Topu Tutup Fırlatmak İstediğin Yöne Doğru Sürükle & Bırak!</div>
  </div>
</div>

<div class="layout" id="mainLayout">

  <div class="ch-sidebar">
    <div class="country-filter-wrap" id="countryFilters"></div>
    <div class="ch-list" id="chList"></div>
    <div class="adv-panel">
      <a href="mailto:fatbokproton@proton.me?subject=Reklam%20Basvurusu" class="adv-link">
        <div class="adv-box">
          Buraya Reklam Verebilirsiniz
        </div>
      </a>
    </div>
  </div>

  <div class="player-area">
    <div class="ambient-glow" id="ambientGlow"></div>

    <div class="now-header">
      <div class="now-logo" id="nowLogo"></div>
      <div class="now-info">
        <div class="now-ch-name" id="nowName"></div>
        <button class="btn-theater" id="theaterBtn" onclick="toggleTheaterMode()" style="display:none;">
          <span>⛶</span><span class="btn-text"> Sinema Modu</span>
        </button>
      </div>
      <div class="now-badges">
        <div class="badge badge-live"><div class="live-dot"></div>CANLI</div>
      </div>
    </div>

    <div class="video-wrap">
      <div class="vid-overlay" id="vidOverlay"></div>
      
      <div id="advInterstitial" class="adv-interstitial" style="display: none;">
        <div class="adv-interstitial-card">
          <h3>Yayın Hazırlanıyor</h3>
          <p id="advText">Sadece 1 Reklam İzleyerek Yayına Bağlanabilirsiniz.</p>
          <button id="advBtn" class="btn-adv-action" onclick="handleAdClick()">🔗 Reklamı Geç ve İzle</button>
        </div>
      </div>

      <iframe id="embedPlayer" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
      
      <div id="plyrWrapper" class="plyr-container-box">
        <video id="hlsPlayer" controls autoplay playsinline></video>
      </div>
    </div>
  </div>

</div>

<script>
const DEFAULT_AD_LINK = "https://ay.live/s7Z7FV";

window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    document.getElementById('netflixIntro').classList.add('hidden');
  }, 2400);
});

function replayIntro() {
  const overlay = document.getElementById('netflixIntro');
  overlay.classList.remove('hidden');
  
  const fWrap = overlay.querySelector('.f-wrapper');
  const restText = overlay.querySelector('.intro-rest');
  
  fWrap.style.animation = 'none';
  restText.style.animation = 'none';
  void fWrap.offsetWidth;
  fWrap.style.animation = 'zoomF 2.5s cubic-bezier(0.25, 1, 0.3, 1) forwards';
  restText.style.animation = 'fadeOutRest 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards';

  setTimeout(() => {
    overlay.classList.add('hidden');
  }, 2400);
}

const fallbackLogo = "https://img.icons8.com/fluency/48/television.png";

let currentCategory = 'tr'; 
let currentSearch = '';
let activeId = null;
let hlsInstance = null;
let selectedChannelObj = null;
let plyrInstance = null;

function initPlyr() {
  if (!plyrInstance) {
    plyrInstance = new Plyr('#hlsPlayer', {
      controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
      tooltips: { controls: true, seek: true }
    });
  }
}

function renderCountryFilters() {
  const container = document.getElementById('countryFilters');
  container.innerHTML = '';
  
  const fragment = document.createDocumentFragment();
  countries.forEach(country => {
    const btn = document.createElement('button');
    btn.className = `country-btn ${currentCategory === country.code ? 'active' : ''}`;
    btn.innerHTML = `<span class="flag-icon">${country.flag}</span> ${country.name}`;
    btn.onclick = () => {
      currentCategory = country.code;
      renderCountryFilters();
      renderList();
    };
    fragment.appendChild(btn);
  });
  container.appendChild(fragment);
}

function renderList(){
  const list = document.getElementById('chList');
  let filtered = channels.filter(c=>{
    const matchesCategory = (c.cat === currentCategory);
    const matchesSearch = (!currentSearch || c.name.toLowerCase().includes(currentSearch.toLowerCase()));
    return matchesCategory && matchesSearch;
  });

  list.innerHTML='';
  const fragment = document.createDocumentFragment();
  
  filtered.forEach(c=>{
    const countryObj = countries.find(item => item.code === c.cat);
    const flagSymbol = countryObj ? countryObj.flag : "🌐";

    const card=document.createElement('div');
    card.className='ch-card'+(activeId===c.id?' active':'');
    card.innerHTML=`
      <div class="ch-card-flag">${flagSymbol}</div>
      <div class="ch-logo">
        <img src="${c.logo}" alt="${c.name}" loading="lazy" onerror="this.onerror=null; this.src='${fallbackLogo}';"/>
      </div>
      <div class="ch-info">
        <div class="ch-name">${c.name}</div>
      </div>
      <div class="ch-live-badge"></div>
    `;
    card.onclick=()=>selectChannel(c);
    fragment.appendChild(card);
  });
  list.appendChild(fragment);
}

function selectChannel(c){
  activeId=c.id;
  selectedChannelObj = c; 
  renderList();

  const logoEl = document.getElementById('nowLogo');
  logoEl.style.display = 'flex';
  logoEl.innerHTML = `<img src="${c.logo}" alt="${c.name}" onerror="this.onerror=null; this.src='${fallbackLogo}';"/>`;
  document.getElementById('nowName').textContent=c.name;
  document.getElementById('theaterBtn').style.display = 'flex';
  document.getElementById('vidOverlay').style.display = 'none';
  
  const iframePlayer = document.getElementById('embedPlayer');
  const plyrWrapper = document.getElementById('plyrWrapper');
  const hlsPlayer = document.getElementById('hlsPlayer');
  const interstitial = document.getElementById('advInterstitial');

  if (hlsInstance) {
    hlsInstance.destroy();
    hlsInstance = null;
  }
  
  hlsPlayer.pause();
  hlsPlayer.src = "";
  plyrWrapper.style.display = "none";
  iframePlayer.style.display = "none";
  iframePlayer.src = "";

  const tokenExpire = localStorage.getItem('fatbok_premium_token');
  
  if (tokenExpire && parseInt(tokenExpire) > Date.now()) {
    interstitial.style.display = "none";
    startActualStream(c);
  } else {
    interstitial.style.display = "flex";
    document.getElementById('advText').textContent = "SADECE 1 REKLAM İZLEYEREK REKLAMSIZ İZLEYEBİLİRSİNİZ.";
    
    const advBtn = document.getElementById('advBtn');
    advBtn.className = "btn-adv-action";
    advBtn.textContent = "🔗 Reklamı Geç ve İzle";
    advBtn.setAttribute('onclick', 'handleAdClick()');
  }

  setAmbientColor(c.cat);
}

function handleAdClick() {
  if (!selectedChannelObj) return;
  const targetAdLink = selectedChannelObj.adLink ? selectedChannelObj.adLink : DEFAULT_AD_LINK;
  window.open(targetAdLink, '_blank');

  const advBtn = document.getElementById('advBtn');
  document.getElementById('advText').textContent = "Reklamı yan sekmede açtık. Reklamı geçtikten sonra aşağıdaki butona tıklayarak yayını başlatabilirsiniz.";
  
  advBtn.textContent = "▶ Yayını Başlat";
  advBtn.className = "btn-adv-action secondary";
  advBtn.setAttribute('onclick', 'handleStreamStart()');
}

function handleStreamStart() {
  if (!selectedChannelObj) return;
  const expireTime = Date.now() + (24 * 60 * 60 * 1000);
  localStorage.setItem('fatbok_premium_token', expireTime.toString());

  document.getElementById('advInterstitial').style.display = "none";
  startActualStream(selectedChannelObj);
}

function startActualStream(c) {
  const iframePlayer = document.getElementById('embedPlayer');
  const plyrWrapper = document.getElementById('plyrWrapper');
  const hlsPlayer = document.getElementById('hlsPlayer');

  if (c.stream.includes('.m3u8')) {
    iframePlayer.removeAttribute('sandbox');
    plyrWrapper.style.display = "block";
    initPlyr(); 
    
    if (Hls.isSupported()) {
      hlsInstance = new Hls();
      hlsInstance.loadSource(c.stream);
      hlsInstance.attachMedia(hlsPlayer);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
        hlsPlayer.play();
      });
    } else if (hlsPlayer.canPlayType('application/vnd.apple.mpegurl')) {
      hlsPlayer.src = c.stream;
      hlsPlayer.play();
    }
  } else {
    iframePlayer.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms');
    iframePlayer.style.display = "block";
    iframePlayer.src = c.stream; 
  }
}

function setAmbientColor(cat) {
  const glowEl = document.getElementById('ambientGlow');
  const colors = {
    tr: "rgba(235, 9, 9, 0.25)",
    us: "rgba(0, 34, 150, 0.25)",
    gb: "rgba(0, 122, 255, 0.25)"
  };
  glowEl.style.setProperty('--ambient-glow-color', colors[cat] || "rgba(0, 122, 255, 0.25)");
}

function toggleTheaterMode() {

/* ─── RETRO ARCADE SİSTEMİ (KARŞIDAN GÖRÜNÜM PENALTI) ─── */
let arcadeLoop = null;
let gameScore = 0;
let highScore = localStorage.getItem('fatbok_arcade_highscore') || 0;

function openArcadeGame() {
  document.getElementById('arcadeModal').classList.add('active');
  initArcadeGame();
}

function closeArcadeGame() {
  document.getElementById('arcadeModal').classList.remove('active');
  if (arcadeLoop) cancelAnimationFrame(arcadeLoop);
}

function initArcadeGame() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  gameScore = 0;
  updateArcadeScore();

  // Kale Sınırları (Karşıdan Görünüm)
  const goal = { left: 60, right: 300, top: 40, bottom: 150 };
  
  // Kaleci
  let keeper = {
    x: 180,
    y: 130,
    targetX: 180,
    targetY: 130,
    width: 32,
    height: 40,
    state: 'idle'
  };

  // Top (Başlangıç: Penaltı Noktası - Yakında ve Büyük)
  let ball = {
    x: 180,
    y: 210,
    radius: 12,
    vx: 0,
    vy: 0,
    vz: 0,
    z: 1, // Büyüklük ölçeği
    isShot: false
  };

  let drag = {
    isDragging: false,
    startX: 0,
    startY: 0,
    currX: 0,
    currY: 0
  };

  let goalMessage = "";
  let messageTimer = 0;

  function resetBall() {
    ball.x = 180;
    ball.y = 210;
    ball.radius = 12;
    ball.vx = 0;
    ball.vy = 0;
    ball.vz = 0;
    ball.z = 1;
    ball.isShot = false;

    keeper.x = 180;
    keeper.y = 130;
    keeper.targetX = 180;
    keeper.targetY = 130;
    keeper.state = 'idle';
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: clientX - rect.left,
      y: clientY - rect.top
    };
  }

  function onPointerDown(e) {
    if (ball.isShot) return;
    const pos = getPos(e);
    // Topa tıklandı mı?
    const dist = Math.hypot(pos.x - ball.x, pos.y - ball.y);
    if (dist < 25) {
      drag.isDragging = true;
      drag.startX = pos.x;
      drag.startY = pos.y;
      drag.currX = pos.x;
      drag.currY = pos.y;
    }
  }

  function onPointerMove(e) {
    if (!drag.isDragging || ball.isShot) return;
    const pos = getPos(e);
    drag.currX = pos.x;
    drag.currY = pos.y;
  }

  function onPointerUp() {
    if (!drag.isDragging || ball.isShot) return;
    drag.isDragging = false;

    const dx = drag.currX - drag.startX;
    const dy = drag.currY - drag.startY;

    // Yeterince güçlü sürükleme yapıldıysa topu fırlat
    if (dy < -15) {
      ball.isShot = true;
      ball.vx = dx * 0.25;
      ball.vy = dy * 0.28;
      ball.vz = -0.022; // Uzaklaştıkça küçülme hızı

      // Kalecinin Şansa Göre Atlaması (Sol, Sağ, Orta)
      const options = [
        { x: goal.left + 20, y: goal.top + 30 },   // Sol Üst
        { x: goal.left + 30, y: goal.bottom - 20 }, // Sol Alt
        { x: 180, y: goal.top + 20 },               // Orta
        { x: goal.right - 30, y: goal.bottom - 20 },// Sağ Alt
        { x: goal.right - 20, y: goal.top + 30 }    // Sağ Üst
      ];
      const choice = options[Math.floor(Math.random() * options.length)];
      keeper.targetX = choice.x;
      keeper.targetY = choice.y;
      keeper.state = 'jumping';
    }
  }

  canvas.onmousedown = onPointerDown;
  canvas.onmousemove = onPointerMove;
  window.onmouseup = onPointerUp;

  canvas.ontouchstart = (e) => { e.preventDefault(); onPointerDown(e); };
  canvas.ontouchmove = (e) => { e.preventDefault(); onPointerMove(e); };
  window.ontouchend = onPointerUp;

  function update() {
    // Kaleci Hareketi
    if (keeper.state === 'jumping') {
      keeper.x += (keeper.targetX - keeper.x) * 0.2;
      keeper.y += (keeper.targetY - keeper.y) * 0.2;
    }

    // Top Hareketi
    if (ball.isShot) {
      ball.x += ball.vx;
      ball.y += ball.vy;
      ball.z += ball.vz;
      if (ball.z < 0.4) ball.z = 0.4;

      // Top Kaleye Ulaştı mı? (Z derinliği kale çizgisine erdiğinde)
      if (ball.z <= 0.48) {
        ball.isShot = false;

        // Kaleci Kurtardı mı?
        const kRect = {
          left: keeper.x - keeper.width,
          right: keeper.x + keeper.width,
          top: keeper.y - keeper.height,
          bottom: keeper.y + keeper.height
        };

        if (ball.x >= kRect.left && ball.x <= kRect.right &&
            ball.y >= kRect.top && ball.y <= kRect.bottom) {
          goalMessage = "KURTARILDI!";
          messageTimer = 45;
          setTimeout(resetBall, 1000);
        }
        // Kaleye girdi mi? (GOL)
        else if (ball.x >= goal.left + 8 && ball.x <= goal.right - 8 &&
                 ball.y >= goal.top + 8 && ball.y <= goal.bottom) {
          gameScore++;
          if (gameScore > highScore) {
            highScore = gameScore;
            localStorage.setItem('fatbok_arcade_highscore', highScore);
          }
          updateArcadeScore();
          goalMessage = "GOOOOOOLLLL!";
          messageTimer = 45;
          setTimeout(resetBall, 1000);
        }
        // Aut
        else {
          goalMessage = "AUT!";
          messageTimer = 45;
          setTimeout(resetBall, 1000);
        }
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Arka Plan / Saha Desenleri (Perspektif Saha)
    ctx.fillStyle = "#1e7e34";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Tribün / Kale Arkası Renklendirmesi
    ctx.fillStyle = "#112211";
    ctx.fillRect(0, 0, canvas.width, 40);

    // Kale Ağları Karesi
    ctx.fillStyle = "#0c3b16";
    ctx.fillRect(goal.left, goal.top, goal.right - goal.left, goal.bottom - goal.top);

    // Kale File Çizgileri
    ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
    ctx.lineWidth = 1;
    for (let x = goal.left; x <= goal.right; x += 15) {
      ctx.beginPath(); ctx.moveTo(x, goal.top); ctx.lineTo(x, goal.bottom); ctx.stroke();
    }
    for (let y = goal.top; y <= goal.bottom; y += 15) {
      ctx.beginPath(); ctx.moveTo(goal.left, y); ctx.lineTo(goal.right, y); ctx.stroke();
    }

    // Beyaz Kale Direkleri (Karşıdan Görünüm)
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(goal.left, goal.bottom);
    ctx.lineTo(goal.left, goal.top);
    ctx.lineTo(goal.right, goal.top);
    ctx.lineTo(goal.right, goal.bottom);
    ctx.stroke();

    // Ceza Sahası Çizgisi Perspektifi
    ctx.strokeStyle = "rgba(255,255,255,0.7)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(10, 240);
    ctx.lineTo(goal.left - 20, goal.bottom);
    ctx.lineTo(goal.right + 20, goal.bottom);
    ctx.lineTo(350, 240);
    ctx.stroke();

    // Kaleci (Retro 16-Bit Görünümlü Bloklar)
    ctx.fillStyle = "#ff0055"; // Kaleci Forması
    ctx.fillRect(keeper.x - 12, keeper.y - 18, 24, 28);
    ctx.fillStyle = "#ffcc99"; // Kaleci Kafası
    ctx.fillRect(keeper.x - 8, keeper.y - 28, 16, 10);
    ctx.fillStyle = "#00ffff"; // Kaleci Eldivenleri
    ctx.fillRect(keeper.x - 18, keeper.y - 12, 6, 8);
    ctx.fillRect(keeper.x + 12, keeper.y - 12, 6, 8);

    // Nişan / Sürükleme Ok Çizgisi
    if (drag.isDragging && !ball.isShot) {
      ctx.strokeStyle = "#00ffcc";
      ctx.lineWidth = 3;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(ball.x, ball.y);
      ctx.lineTo(drag.currX, drag.currY);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Top (Mevcut Büyüklüğüne Göre Derinlikli Çizim)
    ctx.save();
    const currentRadius = ball.radius * ball.z;
    
    // Top Gölgesi
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath();
    ctx.ellipse(ball.x, ball.y + currentRadius * 0.8, currentRadius, currentRadius * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();

    // Top Gövdesi
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, Math.max(currentRadius, 3), 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();

    // Skor / Gol Mesajı
    if (messageTimer > 0) {
      ctx.fillStyle = goalMessage === "GOOOOOOLLLL!" ? "#00ffcc" : "#ff3333";
      ctx.font = "12px 'Press Start 2P'";
      ctx.textAlign = "center";
      ctx.fillText(goalMessage, 180, 100);
      messageTimer--;
    }
  }

  function loop() {
    update();
    draw();
    arcadeLoop = requestAnimationFrame(loop);
  }

  if (arcadeLoop) cancelAnimationFrame(arcadeLoop);
  loop();
}

function updateArcadeScore() {
  document.getElementById('arcadeScore').textContent = `SKOR: ${gameScore} | REKOR: ${highScore}`;
}

renderCountryFilters();
renderList();
</script>
