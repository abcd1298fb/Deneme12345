<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FATBOK</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<!-- Socket.io Kütüphanesi -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<!-- Plyr Player CSS JS-->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#02050f;
  --surface: rgba(10, 15, 30, 0.95);
  --surface2: rgba(255, 255, 255, 0.03);
  --surface3: rgba(0, 122, 255, 0.2);
  --border: rgba(255, 255, 255, 0.14);
  --border2: rgba(0, 122, 255, 0.5);
  --accent:#007aff;
  --accent-glow:rgba(0, 122, 255, 0.2);
  --blue:#0055ff;
  --text:#ffffff;
  --muted:#7ba1d5;
  --muted2:#94a3b8;
  
  --plyr-color-main: var(--accent);
  --plyr-video-background: #000000;
}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Manrope',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  position: relative;
}

/* ─── ARKA PLAN ─── */
.liquid-bg {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: -1;
  background: #02050f;
}

/* ─── NAV ─── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:300;
  height:58px;
  background: rgba(2, 6, 18, 0.98);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;
  justify-content: space-between;
  padding:0 24px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
}
.nav-logo{
  font-family:'Barlow Condensed',sans-serif;
  font-size:24px;font-weight:800;letter-spacing:3px;
  background:linear-gradient(135deg,#ffffff 30%,var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  white-space:nowrap;flex-shrink:0;
  width: 150px;
  cursor: pointer;
  user-select: none;
}
.nav-search{
  flex:1;
  max-width:320px;
  display:flex;align-items:center;gap:10px;
  background: rgba(255, 255, 255, 0.06);
  border:1px solid var(--border);
  border-radius:8px;padding:0 14px;height:36px;
  margin: 0 auto;
}
.nav-search input{
  background:none;border:none;outline:none;
  color:var(--text);font-size:13px;font-family:'Manrope',sans-serif;
  width:100%;
}
.nav-search input::placeholder{color:var(--muted)}
.search-icon{color:var(--muted);font-size:14px;flex-shrink:0}
.nav-spacer { width: 150px; flex-shrink: 0; display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
.live-dot{width:7px;height:7px;background:#34c759;border-radius:50%;opacity:0.9;}

/* ─── LAYOUT ─── */
.layout{
  display:grid;
  grid-template-columns:320px 1fr;
  margin-top:58px;
  height:calc(100vh - 58px);
}
.layout.theater-active { grid-template-columns: 0px 1fr; }

/* ─── CHANNEL SIDEBAR ─── */
.ch-sidebar{
  background: var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  overflow:hidden;
  height: 100%;
  position: relative;
}
.layout.theater-active .ch-sidebar {
  transform: translateX(-320px);
  opacity: 0;
  pointer-events: none;
}

/* DOMAIN ALERT (YENİ YERİ: ÜST KISIM) */
.domain-alert {
  padding: 10px 12px;
  background: rgba(0, 122, 255, 0.08);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.domain-alert-text {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--text);
  line-height: 1.4;
}
.domain-icon { font-size: 14px; }
.domain-link {
  color: var(--accent);
  font-weight: 800;
  text-decoration: underline;
  cursor: pointer;
}

.country-filter-wrap{
  padding: 10px 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  overflow-x: auto;
  display: flex;
  gap: 6px;
}
.country-filter-wrap::-webkit-scrollbar { height: 3px; }
.country-filter-wrap::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.15);
  border-radius: 10px;
}
.country-btn{
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text);
  font-size: 12px; font-weight: 600;
  cursor: pointer; white-space: nowrap;
}
.country-btn.active{
  background: var(--accent);
  border-color: var(--accent);
}
.country-btn .flag-icon { font-size: 14px; }

/* Sekmeler (Kanallar / Maçlar) */
.main-tabs-wrap {
  display: flex;
  background: rgba(0,0,0,0.3);
  border-bottom: 1px solid var(--border);
  padding: 8px;
  gap: 8px;
}
.main-tab-btn {
  flex: 1;
  padding: 8px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--muted2);
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  text-align: center;
}
.main-tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.ch-list{
  flex:1;overflow-y:auto;padding:8px;
  position: relative;
}
.ch-list::-webkit-scrollbar{width:4px}
.ch-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:2px}

.ch-card{
  display:flex;align-items:center;gap:12px;
  padding:12px;border-radius:8px;
  cursor:pointer;
  border:1px solid transparent;
  margin-bottom:4px;
  background: rgba(255, 255, 255, 0.02);
  position: relative;
  overflow: hidden;
}
.ch-card:hover{
  background: rgba(255, 255, 255, 0.09);
  border-color: rgba(255, 255, 255, 0.25);
}
.ch-card.active{
  background: var(--surface3);
  border-color: var(--accent);
}

.ch-card-flag {
  font-size: 16px; flex-shrink: 0;
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.04);
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.08);
}

.ch-logo{
  width:44px;height:44px;border-radius:8px;
  background: rgba(255, 255, 255, 0.98);
  border:1px solid rgba(255,255,255,0.5);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;flex-shrink:0;padding:4px;
}
.ch-logo img{ max-width:100%;max-height:100%;object-fit:contain; }
.ch-info{flex:1;min-width:0}
.ch-name{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-live-badge{ flex-shrink:0;width:7px;height:7px;background:#34c759;border-radius:50%; }

/* Tarih Grubu Başlığı */
.date-group-header {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 1px;
  color: var(--accent);
  background: rgba(0, 122, 255, 0.08);
  padding: 6px 10px;
  border-radius: 6px;
  margin: 10px 0 6px 0;
  border-left: 3px solid var(--accent);
}
.date-group-header:first-child {
  margin-top: 2px;
}

/* Maç Kartı Tasarımı */
.match-card {
  display: flex;
  flex-direction: column;
  padding: 10px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 6px;
  gap: 8px;
}
.match-card:hover {
  border-color: rgba(255, 255, 255, 0.25);
}
.match-main-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  cursor: pointer;
}
.match-team-side {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
}
.match-team-side.right {
  justify-content: flex-end;
  text-align: right;
}
.match-team-logo {
  width: 26px; height: 26px;
  object-fit: contain;
  flex-shrink: 0;
}
.match-team-name {
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.match-center-info {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 4px;
  flex-shrink: 0;
}
.match-time {
  font-size: 10px;
  font-weight: 800;
  color: var(--accent);
  background: rgba(0, 122, 255, 0.1);
  padding: 2px 5px;
  border-radius: 4px;
  margin-bottom: 2px;
}
.match-vs {
  font-size: 9px;
  color: var(--muted2);
  font-weight: 700;
}

/* Alternatif Yayın Butonları */
.match-alternatives {
  display: flex;
  gap: 6px;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
  padding-top: 6px;
}
.alt-stream-btn {
  flex: 1;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 11px;
  font-weight: 700;
  padding: 5px 4px;
  cursor: pointer;
  text-align: center;
}
.alt-stream-btn:hover {
  background: var(--accent);
  border-color: var(--accent);
}

/* REKLAM ALANI */
.adv-panel{
  padding:12px;
  border-top:1px solid var(--border);
  background: rgba(0, 0, 0, 0.4);
  flex-shrink:0;
  display:flex; justify-content:center; align-items:center;
}
.adv-link{ text-decoration: none; width: 100%; max-width: 300px; display: block; }
.adv-box{
  width:100%; height:100px;
  background: rgba(0, 0, 0, 0.3);
  border:1px dashed rgba(255,255,255,0.25);
  border-radius:6px;
  display:flex; align-items:center; justify-content:center;
  color:var(--muted2);
  font-size:12px; font-weight:600; letter-spacing:0.5px;
  text-align:center; cursor:pointer;
}

/* ─── PLAYER AREA & CHAT YAPISI ─── */
.player-area{
  display:flex;flex-direction:column;
  overflow:hidden;
  background:transparent;
  position: relative;
}

.content-body-flex {
  display: flex;
  flex-direction: row;
  flex: 1;
  position: relative;
  z-index: 5;
  overflow: hidden;
}

.video-main-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
  background: #000;
  min-height: 250px;
}

/* ─── CHAT PANELİ ─── */
.chat-sidebar-panel {
  width: 280px;
  background: rgba(6, 10, 22, 0.98);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  z-index: 20;
  flex-shrink: 0;
  height: 100%;
}
.chat-sidebar-panel.hidden {
  transform: translateX(280px);
  width: 0px;
  opacity: 0;
  pointer-events: none;
}
.chat-header {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px; font-weight: 800; letter-spacing: 1px;
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(0,0,0,0.2);
}

.pinned-message-banner {
  background: rgba(255, 149, 0, 0.12);
  border-bottom: 1px solid rgba(255, 149, 0, 0.3);
  padding: 8px 12px;
  font-size: 11px;
  display: none;
  flex-direction: column;
  gap: 2px;
  position: relative;
}
.pinned-message-banner.active { display: flex; }
.pinned-banner-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 700;
  color: #ff9500;
}
.pinned-banner-text {
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.unpin-btn {
  background: none; border: none; color: #ff3b30; cursor: pointer; font-size: 10px; font-weight: 700;
}

.custom-chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: rgba(0,0,0,0.2);
}
.custom-chat-messages::-webkit-scrollbar { width: 4px; }
.custom-chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

.chat-msg-item {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 12px;
  word-break: break-word;
  position: relative;
}

.chat-msg-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 2px;
  align-items: center;
}
.chat-msg-user {
  font-weight: 700;
}
.chat-msg-time {
  font-size: 10px;
  color: var(--muted2);
}
.chat-msg-text {
  color: var(--text);
  line-height: 1.4;
}

.msg-actions {
  display: flex;
  align-items: center;
  gap: 4px;
}

.pin-msg-btn {
  background: rgba(255, 149, 0, 0.2);
  border: 1px solid rgba(255, 149, 0, 0.4);
  color: #ff9500;
  font-size: 9px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 4px;
  cursor: pointer;
  display: none;
}

.delete-msg-btn {
  background: rgba(255, 59, 48, 0.2);
  border: 1px solid rgba(255, 59, 48, 0.4);
  color: #ff3b30;
  font-size: 9px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 4px;
  cursor: pointer;
  display: none;
}

.chat-msg-item.admin-msg {
  background: rgba(0, 122, 255, 0.1) !important;
  border-left: 3px solid #00ff55 !important;
}
.admin-badge {
  background: linear-gradient(135deg, #ff9500, #ff3b30);
  color: #fff;
  font-size: 9px;
  font-weight: 800;
  padding: 1px 5px;
  border-radius: 4px;
  margin-left: 6px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  vertical-align: middle;
}

.custom-chat-form {
  padding: 10px;
  border-top: 1px solid var(--border);
  background: rgba(0,0,0,0.4);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.chat-input-name, .chat-input-msg {
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 10px;
  color: var(--text);
  font-size: 12px;
  font-family: 'Manrope', sans-serif;
  outline: none;
}
.chat-send-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 7px;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
}

.btn-chat-toggle, .btn-theater {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 10px; border-radius: 6px;
  cursor: pointer; font-size: 12px; font-weight: 600;
  display: flex; align-items: center; gap: 5px;
  white-space: nowrap;
}

.now-header{
  padding:10px 16px;
  background: rgba(2, 6, 18, 0.95);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
  flex-shrink:0; min-height:60px; z-index:5;
}
.now-logo{
  width:40px;height:40px;border-radius:8px;
  background: rgba(255, 255, 255, 0.98);
  border:1px solid rgba(255,255,255,0.5);
  display:none; align-items:center;justify-content:center;
  overflow:hidden;padding:4px;flex-shrink:0;
}
.now-logo img{ max-width:100%;max-height:100%;object-fit:contain; }
.now-info{flex:1; display:flex; align-items:center; gap:8px; flex-wrap: nowrap; overflow:hidden;}
.now-ch-name{ font-family:'Barlow Condensed',sans-serif; font-size:18px;font-weight:800;letter-spacing:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.now-badges{display:flex;gap:8px;margin-left:auto}
.badge{ padding:4px 8px;border-radius:6px; font-size:10px;font-weight:700;letter-spacing:1px; }
.badge-live{background:var(--accent-glow);color:var(--accent);border:1px solid var(--border2);display:flex;align-items:center;gap:4px}

.video-wrap{ flex:1;background:#000;position:relative;overflow:hidden; z-index:5; display:flex; align-items:center; justify-content:center; }
iframe, .plyr-container-box{ width:100%; height:100%; border:none; display:none; background:#000; }
.vid-overlay{ position:absolute;inset:0; background: rgba(1, 3, 8, 0.95); z-index:10; }

.plyr { height: 100% !important; width: 100% !important; }
.plyr__video-wrapper { height: 100% !important; display: flex; align-items: center; justify-content: center; }
.plyr video { object-fit: contain; }

/* Sabit Yüklenme Ekranı */
.skeleton-loader {
  position: absolute; inset: 0;
  background: rgba(6, 12, 28, 0.95);
  z-index: 15;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 20px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease;
}
.skeleton-loader.active { opacity: 1; pointer-events: auto; }

.glass-card {
  width: min(85%, 480px);
  padding: 30px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 16px;
  display: flex; flex-direction: column; gap: 16px; align-items: center;
}

.skeleton-box {
  background: rgba(255, 255, 255, 0.08);
  border-radius: 8px;
}
.sk-logo { width: 64px; height: 64px; border-radius: 12px; }
.sk-title { width: 60%; height: 20px; }
.sk-subtitle { width: 40%; height: 12px; }
.sk-bar { width: 100%; height: 6px; border-radius: 3px; margin-top: 10px; }

.adv-interstitial {
  position: absolute; inset: 0;
  background: rgba(2, 5, 15, 0.98);
  z-index: 20;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px; text-align: center;
}
.adv-interstitial-card {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  padding: 32px; border-radius: 16px;
  max-width: 420px; width: 100%;
}
.adv-interstitial h3 { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
.adv-interstitial p { color: var(--muted2); font-size: 13px; line-height: 1.6; margin-bottom: 24px; }
.btn-adv-action {
  background: var(--accent); color: #fff; border: none;
  padding: 12px 24px; border-radius: 8px; font-weight: 700; font-size: 14px;
  cursor: pointer; width: 100%;
}
.btn-adv-action.secondary { background: rgba(255, 255, 255, 0.1); border: 1px solid var(--border); margin-top: 10px; }

/* ─── MOBİL UYUMLULUK ─── */
@media(max-width:768px){
  .layout{ grid-template-columns:1fr; grid-template-rows: auto 1fr; height: calc(100vh - 58px); }
  .layout.theater-active { grid-template-columns: 1fr; grid-template-rows: calc(100vh - 58px) 0px; }
  .ch-sidebar{ flex: 1; height: auto; max-height: none; border-right:none; order:2; position: relative; }
  .layout.theater-active .ch-sidebar { transform: translateY(100%); max-height: 0px; opacity: 0; padding: 0; }
  .player-area{ order:1; height: auto; }
  nav{padding:0 14px}
  .nav-logo{ width: auto; }
  .nav-search{ max-width: 140px; margin: 0 0 0 auto; }
  .nav-spacer { width: auto; }

  .ch-sidebar .chat-sidebar-panel {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100% !important;
    height: 100% !important;
    z-index: 50;
    background: rgba(6, 10, 22, 0.98);
    border-left: none;
  }
  .ch-sidebar .chat-sidebar-panel.hidden {
    transform: translateY(-20px);
    opacity: 0;
    pointer-events: none;
  }
}
</style>
</head>
<body>

<div class="liquid-bg"></div>

<nav>
  <div class="nav-logo">FATBOK</div>
  <div class="nav-search">
    <span class="search-icon">🔍</span>
    <input type="text" placeholder="Kanal ara..." id="searchInput" oninput="filterChannels(this.value)"/>
  </div>
  <div class="nav-spacer">
    <button id="changePassBtn" onclick="updateAdminPassword()" style="display:none; background:rgba(255,149,0,0.2); border:1px solid rgba(255,149,0,0.4); color:#ff9500; font-size:11px; font-weight:700; padding:4px 8px; border-radius:6px; cursor:pointer;" title="Admin Şifresini Değiştir">🔑 Şifre Değiştir</button>
  </div> 
</nav>

<div class="layout" id="mainLayout">

  <div class="ch-sidebar">
    <!-- YENİ EKLENEN ALAN ADI DUYURU ALANI (ÜST KISIMDA) -->
    <div class="domain-alert">
      <div class="domain-alert-text">
        <span class="domain-icon">📢</span>
        <div>

<script>
const socket = io('https://fatbokchat.onrender.com');

function getAdminPassword() {
  return localStorage.getItem('fatbok_admin_pass') || "fatbok2026";
}

function updateAdminPassword() {
  if (localStorage.getItem('fatbok_is_admin') !== 'true') {
    alert("Bu işlem için yetkiniz yok!");
    return;
  }
  let currentPassCheck = prompt("Mevcut admin şifresini girin:");
  if (currentPassCheck !== getAdminPassword()) {
    alert("Mevcut şifre hatalı!");
    return;
  }
  let newPass = prompt("Yeni admin şifresini girin:");
  if (newPass && newPass.trim() !== "") {
    localStorage.setItem('fatbok_admin_pass', newPass.trim());
    alert("Admin şifresi başarıyla güncellendi!");
  } else {
    alert("Şifre boş olamaz!");
  }
}

let slowModeActive = false;
let lastMessageTime = 0;
const SLOW_MODE_LIMIT = 3000;

function stringToColor(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = str.charCodeAt(i) + ((hash << 5) - hash);
  }
  let color = '#';
  for (let i = 0; i < 3; i++) {
    let value = (hash >> (i * 8)) & 0xFF;
    color += ('00' + value.toString(16)).substr(-2);
  }
  return color;
}

function checkUsernameAdmin(inputEl) {
  let name = inputEl.value.trim();
  if (name.toLowerCase() === 'admin' && localStorage.getItem('fatbok_is_admin') !== 'true') {
    let enteredPass = prompt("👑 Yönetici Paneli: Lütfen Admin Şifresini Girin:");
    if (enteredPass === getAdminPassword()) {
      localStorage.setItem('fatbok_is_admin', 'true');
      alert("Şifre doğru! Admin yetkileri aktif.");
      location.reload(); 
    } else {
      alert("Hatalı şifre!");
      localStorage.removeItem('fatbok_is_admin');
      inputEl.value = "";
    }
  } else if (name.toLowerCase() !== 'admin') {
    localStorage.removeItem('fatbok_is_admin');
  }
}

socket.on('chatMessage', (data) => {
  appendMessage(data.id, data.username, data.message, data.time, data.isAdmin);
});

socket.on('deleteMessage', (msgId) => {
  const msgEl = document.getElementById(`msg-${msgId}`);
  if (msgEl) msgEl.remove();
});

socket.on('slowModeStatus', (isActive) => {
  slowModeActive = isActive;
  const adminBtn = document.getElementById('slowModeAdminBtn');
  if (adminBtn && localStorage.getItem('fatbok_is_admin') === 'true') {
    adminBtn.textContent = isActive ? "🐢 Yavaş Mod: Açık" : "🐢 Yavaş Mod: Kapalı";
  }
});

function toggleSlowModeAdmin() {
  if (localStorage.getItem('fatbok_is_admin') !== 'true') return;
  socket.emit('toggleSlowMode', !slowModeActive);
}

socket.on('pinnedMessage', (text) => {
  const banner = document.getElementById('pinnedBanner');
  const textEl = document.getElementById('pinnedText');
  const unpinBtn = document.getElementById('unpinBtn');
  if (text) {
    textEl.textContent = text;
    banner.classList.add('active');
    if (localStorage.getItem('fatbok_is_admin') === 'true') unpinBtn.style.display = 'inline-block';
  } else {
    banner.classList.remove('active');
    textEl.textContent = "";
    unpinBtn.style.display = 'none';
  }
});

function sendChatMessage(e) {
  e.preventDefault();
  const isAdmin = localStorage.getItem('fatbok_is_admin') === 'true';
  if (slowModeActive && !isAdmin) {
    const timeLeft = SLOW_MODE_LIMIT - (Date.now() - lastMessageTime);
    if (timeLeft > 0) {
      alert(`Yavaş mod aktif! Lütfen ${(timeLeft / 1000).toFixed(1)} saniye bekleyin.`);
      return;
    }
  }

  const usernameInput = document.getElementById('chatUsername');
  const messageInput = document.getElementById('chatMessageInput');
  let username = usernameInput.value.trim();
  let message = messageInput.value.trim();
  if (!username || !message) return;

  let userIsAdminFlag = (username.toLowerCase() === 'admin' && isAdmin);
  localStorage.setItem('fatbok_chat_user', username);
  const msgId = 'm_' + Math.random().toString(36).substring(2, 9);

  socket.emit('chatMessage', { id: msgId, username, message, isAdmin: userIsAdminFlag });
  lastMessageTime = Date.now();
  messageInput.value = '';
  messageInput.focus();
}

function deleteMessage(msgId) {
  if (localStorage.getItem('fatbok_is_admin') !== 'true') return;
  socket.emit('deleteMessage', msgId);
}

function pinMessage(text) {
  if (localStorage.getItem('fatbok_is_admin') !== 'true') return;
  socket.emit('pinMessage', text);
}

function unpinMessage() {
  if (localStorage.getItem('fatbok_is_admin') !== 'true') return;
  socket.emit('pinMessage', "");
}

function appendMessage(msgId, user, text, time, isAdminFlag) {
  const container = document.getElementById('chatMessages');
  const isAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 50;

  const userColor = stringToColor(user);
  const isAdmin = isAdminFlag || (user.toLowerCase() === 'admin' && localStorage.getItem('fatbok_is_admin') === 'true');
  const isUserAdmin = localStorage.getItem('fatbok_is_admin') === 'true';
  
  const div = document.createElement('div');
  div.className = 'chat-msg-item' + (isAdmin ? ' admin-msg' : '');
  if (msgId) div.id = `msg-${msgId}`;
  
  div.innerHTML = `
    <div class="chat-msg-header">
      <div>
        <span class="chat-msg-user" style="color: ${isAdmin ? '#00ff55' : userColor};">
          ${escapeHtml(user)}
          ${isAdmin ? '<span class="admin-badge">👑 ADMIN</span>' : ''}
        </span>
      </div>
      <div class="msg-actions">
        <span class="chat-msg-time">${time || 'Şimdi'}</span>
        ${isUserAdmin ? `<button class="pin-msg-btn" onclick="pinMessage('${escapeHtml(text).replace(/'/g, "\\'")}')">📌 Sabitle</button>` : ''}
        ${isUserAdmin ? `<button class="delete-msg-btn" onclick="deleteMessage('${msgId}')">🗑️ Sil</button>` : ''}
      </div>
    </div>
    <div class="chat-msg-text">${escapeHtml(text)}</div>
  `;
  container.appendChild(div);

  if (isUserAdmin) {
    const pinBtn = div.querySelector('.pin-msg-btn');
    const delBtn = div.querySelector('.delete-msg-btn');
    if(pinBtn) pinBtn.style.display = 'inline-block';
    if(delBtn) delBtn.style.display = 'inline-block';
  }

  if (isAtBottom) container.scrollTop = container.scrollHeight;
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function toggleChatPanel() {
  const chatPanel = document.getElementById('chatPanel');
  if (window.innerWidth <= 768) {
    const chSidebar = document.querySelector('.ch-sidebar');
    if (chatPanel.parentElement !== chSidebar) {
      chSidebar.insertBefore(chatPanel, chSidebar.querySelector('.adv-panel'));
    }
  } else {
    const videoWrap = document.querySelector('.content-body-flex');
    if (chatPanel.parentElement !== videoWrap) {
      videoWrap.appendChild(chatPanel);
    }
  }
  chatPanel.classList.toggle('hidden');
}

window.addEventListener('DOMContentLoaded', () => {
  const savedUser = localStorage.getItem('fatbok_chat_user');
  if (savedUser) document.getElementById('chatUsername').value = savedUser;

  if (localStorage.getItem('fatbok_is_admin') === 'true') {
    const adminBtn = document.getElementById('slowModeAdminBtn');
    if (adminBtn) adminBtn.style.display = 'inline-block';
    const changePassBtn = document.getElementById('changePassBtn');
    if (changePassBtn) changePassBtn.style.display = 'inline-block';
  }

  const chatPanel = document.getElementById('chatPanel');
  if (window.innerWidth <= 768) {
    document.querySelector('.ch-sidebar').insertBefore(chatPanel, document.querySelector('.ch-sidebar').querySelector('.adv-panel'));
  }

  socket.emit('getPinnedMessage');
});

        homeTeam: "Gençlerbirliği",
        homeLogo: "https://upload.wikimedia.org/wikipedia/tr/f/f7/Genclerbirligi.png",
        awayTeam: "Fenerbahçe",
        awayLogo: "https://upload.wikimedia.org/wikipedia/tr/archive/8/86/20210127193236%21Fenerbah%C3%A7e_SK.png",
        channelIds: [1, 2, 3]
      }
    ]
  }
];
  
const fallbackLogo = "https://img.icons8.com/fluency/48/television.png";

let currentCategory = 'tr'; 
let currentSearch = '';
let activeTab = 'channels'; 
let activeId = null;
let hlsInstance = null;
let selectedChannelObj = null;
let plyrInstance = null;

function initPlyr() {
  if (!plyrInstance) {
    plyrInstance = new Plyr('#hlsPlayer', {
      controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
      tooltips: { controls: true, seek: true }
    });
  }
}

function switchMainTab(tab) {
  activeTab = tab;
  document.getElementById('tabChannelsBtn').classList.toggle('active', tab === 'channels');
  document.getElementById('tabMatchesBtn').classList.toggle('active', tab === 'matches');
  
  const countryFilters = document.getElementById('countryFilters');
  const searchInput = document.getElementById('searchInput');

  if (tab === 'matches') {
    countryFilters.style.display = 'none';
    if(searchInput) searchInput.parentElement.style.display = 'none';
    renderMatchesList();
  } else {
    countryFilters.style.display = 'flex';
    if(searchInput) searchInput.parentElement.style.display = 'flex';
    renderCountryFilters();
    renderList();
  }
}

function renderCountryFilters() {
  const container = document.getElementById('countryFilters');
  container.innerHTML = '';
  const fragment = document.createDocumentFragment();
  countries.forEach(country => {
    const btn = document.createElement('button');
    btn.className = `country-btn ${currentCategory === country.code ? 'active' : ''}`;
    btn.innerHTML = `<span class="flag-icon">${country.flag}</span> ${country.name}`;
    btn.onclick = () => {
      currentCategory = country.code;
      renderCountryFilters();
      renderList();
    };
    fragment.appendChild(btn);
  });
  container.appendChild(fragment);
}

function renderMatchesList() {
  const list = document.getElementById('chList');
  list.innerHTML = '';
  const fragment = document.createDocumentFragment();
  
  dailyMatchesByDate.forEach(group => {
    const dateHeader = document.createElement('div');
    dateHeader.className = 'date-group-header';
    dateHeader.textContent = group.date;
    fragment.appendChild(dateHeader);

    group.matches.forEach(match => {
      const card = document.createElement('div');
      card.className = 'match-card';
      let firstChannelId = (match.channelIds && match.channelIds.length > 0) ? match.channelIds[0] : null;

      let cardHtml = `
        <div class="match-main-row" ${firstChannelId ? `onclick="playMatchChannel(${firstChannelId})"` : ''} title="Yayını Başlat">
          <div class="match-team-side">
            <img src="${match.homeLogo}" alt="${match.homeTeam}" class="match-team-logo" onerror="this.src='${fallbackLogo}'"/>
            <span class="match-team-name">${match.homeTeam}</span>
          </div>
          <div class="match-center-info">
            <span class="match-time">${match.time}</span>
            <span class="match-vs">VS</span>
          </div>
          <div class="match-team-side right">
            <span class="match-team-name">${match.awayTeam}</span>
            <img src="${match.awayLogo}" alt="${match.awayTeam}" class="match-team-logo" onerror="this.src='${fallbackLogo}'"/>
          </div>
        </div>
      `;

      if (match.channelIds && match.channelIds.length > 0) {
        cardHtml += `<div class="match-alternatives">`;
        match.channelIds.forEach((chId, index) => {
          const foundCh = channels.find(c => c.id === chId);
          const btnLabel = foundCh ? foundCh.name : `Alternatif ${index + 1}`;
          cardHtml += `<button class="alt-stream-btn" onclick="playMatchChannel(${chId})">▶ ${btnLabel}</button>`;
        });
        cardHtml += `</div>`;
      }
      card.innerHTML = cardHtml;
      fragment.appendChild(card);
    });
  });
  list.appendChild(fragment);
}

function playMatchChannel(chId) {
  const targetChannel = channels.find(c => c.id === chId);
  if (targetChannel) selectChannel(targetChannel);
}

function renderList(){
  if (activeTab !== 'channels') return;
  const list = document.getElementById('chList');
  let filtered = channels.filter(c => c.cat === currentCategory && (!currentSearch || c.name.toLowerCase().includes(currentSearch.toLowerCase())));

  list.innerHTML='';
  const fragment = document.createDocumentFragment();
  
  filtered.forEach(c => {
    const countryObj = countries.find(item => item.code === c.cat);
    const flagSymbol = countryObj ? countryObj.flag : "🌐";

    const card = document.createElement('div');
    card.className = 'ch-card' + (activeId === c.id ? ' active' : '');
    card.innerHTML = `
      <div class="ch-card-flag">${flagSymbol}</div>
      <div class="ch-logo">
        <img src="${c.logo}" alt="${c.name}" loading="lazy" onerror="this.onerror=null; this.src='${fallbackLogo}';"/>
      </div>
      <div class="ch-info">
        <div class="ch-name">${c.name}</div>
      </div>
      <div class="ch-live-badge"></div>
    `;
    card.onclick = () => selectChannel(c);
    fragment.appendChild(card);
  });
  list.appendChild(fragment);
}

function selectChannel(c){
  activeId = c.id;
  selectedChannelObj = c; 
  if (activeTab === 'channels') renderList();

  const logoEl = document.getElementById('nowLogo');
  logoEl.style.display = 'flex';
  logoEl.innerHTML = `<img src="${c.logo}" alt="${c.name}" onerror="this.onerror=null; this.src='${fallbackLogo}';"/>`;
  document.getElementById('nowName').textContent = c.name;
  document.getElementById('theaterBtn').style.display = 'flex';
  document.getElementById('chatToggleBtn').style.display = 'flex';
  document.getElementById('vidOverlay').style.display = 'none';
  
  const iframePlayer = document.getElementById('embedPlayer');
  const plyrWrapper = document.getElementById('plyrWrapper');
  const hlsPlayer = document.getElementById('hlsPlayer');
  const interstitial = document.getElementById('advInterstitial');

  if (hlsInstance) {
    hlsInstance.destroy();
    hlsInstance = null;
  }
  
  hlsPlayer.pause();
  hlsPlayer.src = "";
  plyrWrapper.style.display = "none";
  iframePlayer.style.display = "none";
  iframePlayer.src = "";

  const tokenExpire = localStorage.getItem('fatbok_premium_token');
  if (tokenExpire && parseInt(tokenExpire) > Date.now()) {
    interstitial.style.display = "none";
    startActualStream(c);
  } else {
    interstitial.style.display = "flex";
    document.getElementById('advText').textContent = "SADECE 1 REKLAM İZLEYEREK REKLAMSIZ İZLEYEBİLİRSİNİZ.";
    const advBtn = document.getElementById('advBtn');
    advBtn.className = "btn-adv-action";
    advBtn.textContent = "🔗 Reklamı Geç ve İzle";
    advBtn.setAttribute('onclick', 'handleAdClick()');
  }
}

function handleAdClick() {
  if (!selectedChannelObj) return;
  const targetAdLink = selectedChannelObj.adLink ? selectedChannelObj.adLink : DEFAULT_AD_LINK;
  window.open(targetAdLink, '_blank');

  const advBtn = document.getElementById('advBtn');
  document.getElementById('advText').textContent = "Reklamı yan sekmede açtık. Ardından aşağıdaki butona tıklayarak yayını başlatabilirsiniz.";
  advBtn.textContent = "▶ Yayını Başlat";
  advBtn.className = "btn-adv-action secondary";
  advBtn.setAttribute('onclick', 'handleStreamStart()');
}

function handleStreamStart() {
  if (!selectedChannelObj) return;
  const expireTime = Date.now() + (24 * 60 * 60 * 1000);
  localStorage.setItem('fatbok_premium_token', expireTime.toString());
  document.getElementById('advInterstitial').style.display = "none";
  startActualStream(selectedChannelObj);
}

function showSkeleton() { document.getElementById('skeletonLoader').classList.add('active'); }
function hideSkeleton() { document.getElementById('skeletonLoader').classList.remove('active'); }

function startActualStream(c) {
  showSkeleton();
  const iframePlayer = document.getElementById('embedPlayer');
  const plyrWrapper = document.getElementById('plyrWrapper');
  const hlsPlayer = document.getElementById('hlsPlayer');

  if (c.stream.includes('.m3u8')) {
    iframePlayer.removeAttribute('sandbox');
    plyrWrapper.style.display = "block";
    initPlyr(); 
    
    if (Hls.isSupported()) {
      hlsInstance = new Hls();
      hlsInstance.loadSource(c.stream);
      hlsInstance.attachMedia(hlsPlayer);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
        hlsPlayer.play().catch(() => {});
        hideSkeleton();
      });
      hlsInstance.on(Hls.Events.ERROR, function() { hideSkeleton(); });
    } else if (hlsPlayer.canPlayType('application/vnd.apple.mpegurl')) {
      hlsPlayer.src = c.stream;
      hlsPlayer.play().catch(() => {});
      hideSkeleton();
    }
  } else {
    iframePlayer.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms');
    iframePlayer.style.display = "block";
    iframePlayer.src = c.stream; 
    iframePlayer.onload = function() { hideSkeleton(); };
    setTimeout(() => { hideSkeleton(); }, 2500);
  }
}

function toggleTheaterMode() {
  const layout = document.getElementById('mainLayout');
  const btn = document.getElementById('theaterBtn');
  const btnText = btn.querySelector('.btn-text');
  
  layout.classList.toggle('theater-active');
  btn.classList.toggle('active');
  
  if(layout.classList.contains('theater-active')) {
    if(btnText) btnText.textContent = "Normal";
  } else {
    if(btnText) btnText.textContent = "Sinema";
  }
}

function filterChannels(q){
  currentSearch = q;
  renderList();
}

renderCountryFilters();
renderList();
</script>
</body>
</html>
