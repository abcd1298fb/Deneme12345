<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FATBOK</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<!-- Plyr Player CSS JS-->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#02050f;
  --surface: rgba(10, 15, 30, 0.85);
  --surface2: rgba(255, 255, 255, 0.03);
  --surface3: rgba(0, 122, 255, 0.2);
  --border: rgba(255, 255, 255, 0.14);
  --border2: rgba(0, 122, 255, 0.5);
  --accent:#007aff;
  --accent-glow:rgba(0, 122, 255, 0.2);
  --blue:#0055ff;
  --text:#ffffff;
  --muted:#7ba1d5;
  --muted2:#94a3b8;
  --ambient-glow-color: rgba(0, 122, 255, 0.35);
  
  --plyr-color-main: var(--accent);
  --plyr-video-background: #000000;
}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Manrope',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  position: relative;
}

/* ─── ARKA PLAN ─── */
.liquid-bg {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: -1;
  overflow: hidden;
  background: radial-gradient(circle at 50% 50%, #030a1e 0%, #010307 100%);
  contain: strict;
}
.liquid-bg::before, .liquid-bg::after {
  content: '';
  position: absolute;
  width: 600px; height: 600px;
  border-radius: 50%;
  background: linear-gradient(135deg, #002266, #0055ff);
  filter: blur(80px);
  opacity: 0.35;
  will-change: transform;
  transform: translateZ(0);
  animation: liquidFloat 25s infinite ease-in-out;
}
.liquid-bg::after {
  background: linear-gradient(135deg, #001133, #007aff);
  right: -50px; top: -50px;
  width: 500px; height: 500px;
  opacity: 0.2;
  animation: liquidFloat 30s infinite ease-in-out reverse;
  animation-delay: -5s;
}

@keyframes liquidFloat {
  0% { transform: translate3d(-20px, -20px, 0) scale(1); }
  50% { transform: translate3d(30px, 20px, 0) scale(1.08); }
  100% { transform: translate3d(-20px, -20px, 0) scale(1); }
}

/* ─── NAV ─── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:300;
  height:58px;
  background: rgba(2, 6, 18, 0.92);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;
  justify-content: space-between;
  padding:0 24px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  contain: layout style;
}
.nav-logo{
  font-family:'Barlow Condensed',sans-serif;
  font-size:24px;font-weight:800;letter-spacing:3px;
  background:linear-gradient(135deg,#ffffff 30%,var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  white-space:nowrap;flex-shrink:0;
  width: 150px;
  cursor: pointer;
  user-select: none;
  transition: transform 0.2s;
}
.nav-logo:active { transform: scale(0.95); }
.nav-search{
  flex:1;
  max-width:320px;
  display:flex;align-items:center;gap:10px;
  background: rgba(255, 255, 255, 0.06);
  border:1px solid var(--border);
  border-radius:8px;padding:0 14px;height:36px;
  box-shadow: inset 0 1px 4px rgba(0,0,0,0.3);
  margin: 0 auto;
}
.nav-search input{
  background:none;border:none;outline:none;
  color:var(--text);font-size:13px;font-family:'Manrope',sans-serif;
  width:100%;
}
.nav-search input::placeholder{color:var(--muted)}
.search-icon{color:var(--muted);font-size:14px;flex-shrink:0}
.nav-spacer { width: 150px; flex-shrink: 0; display: flex; justify-content: flex-end; align-items: center; }
.live-dot{width:7px;height:7px;background:#34c759;border-radius:50%;opacity:0.9;}

/* Renk Tema Seçici CSS */
.theme-picker-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
}
.theme-picker-wrap:hover {
  border-color: var(--accent);
  background: rgba(255, 255, 255, 0.12);
}
.theme-icon { font-size: 14px; }
.theme-select {
  background: transparent;
  border: none;
  color: var(--text);
  font-size: 12px;
  font-weight: 700;
  outline: none;
  cursor: pointer;
  font-family: 'Manrope', sans-serif;
}
.theme-select option {
  background: #060e20;
  color: #fff;
}

/* ─── NETFLIX INTRO OVERLAY (İLK GİRİŞ ANİMASYONU) ─── */
.netflix-intro-overlay {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  background: #000000;
  z-index: 999999;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 1;
  visibility: visible;
  transition: opacity 0.8s ease, visibility 0.8s ease;
  overflow: hidden;
}
.netflix-intro-overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.intro-text-box {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: clamp(60px, 15vw, 180px);
  font-weight: 900;
  letter-spacing: 4px;
}

.f-wrapper {
  position: relative;
  display: inline-block;
  line-height: 1;
  transform-origin: center center;
  z-index: 2;
  animation: zoomF 4.5s cubic-bezier(0.25, 1, 0.3, 1) forwards;
}

.intro-f {
  position: relative;
  color: var(--accent);
  display: inline-block;
  background: linear-gradient(180deg, #ffffff 0%, #00d2ff 50%, var(--accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 25px var(--accent-glow));
}

.intro-rest {
  color: #ffffff;
  background: linear-gradient(180deg, #ffffff 30%, #a0a0a0 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: inline-block;
  white-space: nowrap;
  overflow: hidden;
  vertical-align: bottom;
  transform-origin: left center;
  animation: fadeOutRest 2.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

@keyframes fadeOutRest {
  0% { opacity: 1; max-width: 500px; }
  40% { opacity: 0.7; }
  100% { opacity: 0; max-width: 0px; }
}

@keyframes zoomF {
  0% { transform: scale(1); }
  30% { transform: scale(1.1); }
  65% { transform: scale(3.5); opacity: 1; }
  90% { opacity: 0.8; }
  100% { transform: scale(65); opacity: 0; }
}

/* ─── LAYOUT ─── */
.layout{
  display:grid;
  grid-template-columns:320px 1fr;
  margin-top:58px;
  height:calc(100vh - 58px);
  transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
}
.layout.theater-active { grid-template-columns: 0px 1fr; }

/* ─── CHANNEL SIDEBAR ─── */
.ch-sidebar{
  background: var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  overflow:hidden;
  box-shadow: 5px 0 20px rgba(0, 0, 0, 0.3);
  transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s;
  contain: layout style;
}
.layout.theater-active .ch-sidebar {
  transform: translateX(-320px);
  opacity: 0;
  pointer-events: none;
}

.country-filter-wrap{
  padding: 10px 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  overflow-x: auto;
  display: flex;
  gap: 6px;
}
.country-filter-wrap::-webkit-scrollbar { height: 3px; }
.country-filter-wrap::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.15);
  border-radius: 10px;
}
.country-btn{
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text);
  font-size: 12px; font-weight: 600;
  cursor: pointer; white-space: nowrap;
  transition: background 0.2s;
}
.country-btn:hover{
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(255, 255, 255, 0.3);
}
.country-btn.active{
  background: var(--accent);
  border-color: var(--accent);
}
.country-btn .flag-icon { font-size: 14px; }

/* Sekmeler (Kanallar / Maçlar) */
.main-tabs-wrap {
  display: flex;
  background: rgba(0,0,0,0.3);
  border-bottom: 1px solid var(--border);
  padding: 8px;
  gap: 8px;
}
.main-tab-btn {
  flex: 1;
  padding: 8px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--muted2);
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  text-align: center;
  transition: 0.2s;
}
.main-tab-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
.main-tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.ch-list{
  flex:1;overflow-y:auto;padding:8px;
  position: relative;
  will-change: scroll-position;
}
.ch-list::-webkit-scrollbar{width:4px}
.ch-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:2px}

.ch-card{
  display:flex;align-items:center;gap:12px;
  padding:12px;border-radius:8px;
  cursor:pointer;transition:background .18s, border-color .18s;
  border:1px solid transparent;
  margin-bottom:4px;
  background: rgba(255, 255, 255, 0.02);
  position: relative;
  overflow: hidden;
  contain: content;
}
.ch-card:hover{
  background: rgba(255, 255, 255, 0.09);
  border-color: rgba(255, 255, 255, 0.25);
}
.ch-card.active{
  background: var(--surface3);
  border-color: var(--accent);
}

.ch-card-flag {
  font-size: 16px; flex-shrink: 0;
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.04);
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.08);
}

.ch-logo{
  width:44px;height:44px;border-radius:8px;
  background: rgba(255, 255, 255, 0.98);
  border:1px solid rgba(255,255,255,0.5);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;flex-shrink:0;padding:4px;
}
.ch-logo img{ max-width:100%;max-height:100%;object-fit:contain; }
.ch-info{flex:1;min-width:0}
.ch-name{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-live-badge{ flex-shrink:0;width:7px;height:7px;background:#34c759;border-radius:50%; }

/* Maç Kartı Tasarımı */
.match-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 6px;
  gap: 8px;
}
.match-team-side {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
}
.match-team-side.right {
  justify-content: flex-end;
  text-align: right;
}
.match-team-logo {
  width: 28px; height: 28px;
  object-fit: contain;
  flex-shrink: 0;
}
.match-team-name {
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.match-center-info {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 6px;
  flex-shrink: 0;
}
.match-time {
  font-size: 11px;
  font-weight: 800;
  color: var(--accent);
  background: rgba(0, 122, 255, 0.1);
  padding: 2px 6px;
  border-radius: 4px;
  margin-bottom: 2px;
}
.match-vs {
  font-size: 10px;
  color: var(--muted2);
  font-weight: 700;
}

/* REKLAM ALANI */
.adv-panel{
  padding:12px;
  border-top:1px solid var(--border);
  background: rgba(0, 0, 0, 0.4);
  flex-shrink:0;
  display:flex; justify-content:center; align-items:center;
}
.adv-link{ text-decoration: none; width: 100%; max-width: 300px; display: block; }
.adv-box{
  width:100%; height:100px;
  background: rgba(0, 0, 0, 0.3);
  border:1px dashed rgba(255,255,255,0.25);
  border-radius:6px;
  display:flex; align-items:center; justify-content:center;
  color:var(--muted2);
  font-size:12px; font-weight:600; letter-spacing:0.5px;
  text-align:center; cursor:pointer;
  transition:border-color 0.2s, background 0.2s;
}
.adv-box:hover{
  border-color:var(--accent);
  color:var(--text);
  background: var(--accent-glow);
}

/* ─── PLAYER AREA ─── */
.player-area{
  display:flex;flex-direction:column;
  overflow:hidden;
  background:transparent;
  position: relative;
  contain: layout style;
}

.ambient-glow {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate3d(-50%, -50%, 0);
  width: 100%; height: 100%;
  background: var(--ambient-glow-color);
  filter: blur(80px);
  opacity: 0.4;
  z-index: 1;
  pointer-events: none;
}

.now-header{
  padding:14px 24px;
  background: rgba(2, 6, 18, 0.85);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;
  flex-shrink:0; min-height:77px; z-index:5;
}
.now-logo{
  width:48px;height:48px;border-radius:10px;
  background: rgba(255, 255, 255, 0.98);
  border:1px solid rgba(255,255,255,0.5);
  display:none; align-items:center;justify-content:center;
  overflow:hidden;padding:5px;flex-shrink:0;
}
.now-logo img{ max-width:100%;max-height:100%;object-fit:contain; }
.now-info{flex:1; display:flex; align-items:center; gap:12px;}
.now-ch-name{ font-family:'Barlow Condensed',sans-serif; font-size:22px;font-weight:800;letter-spacing:1px; }

.btn-theater {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 12px; border-radius: 6px;
  cursor: pointer; font-size: 14px; font-weight: 600;
  display: flex; align-items: center; gap: 6px;
  transition: background 0.2s, border-color 0.2s;
}
.btn-theater:hover { background: var(--accent); border-color: var(--accent); }
.btn-theater.active { background: rgba(255, 255, 255, 0.2); border-color: rgba(255, 255, 255, 0.4); }

/* Aspect Ratio Seçici CSS */
.aspect-ratio-selector {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 10px; border-radius: 6px;
  font-size: 13px; font-weight: 600;
  outline: none; cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
}
.aspect-ratio-selector option {
  background: #060e20;
  color: #fff;
}
.aspect-ratio-selector:hover { background: rgba(255, 255, 255, 0.12); border-color: var(--accent); }

.now-badges{display:flex;gap:8px;margin-left:auto}
.badge{ padding:5px 12px;border-radius:6px; font-size:11px;font-weight:700;letter-spacing:1px; }
.badge-live{background:var(--accent-glow);color:var(--accent);border:1px solid var(--border2);display:flex;align-items:center;gap:5px}

.video-wrap{ flex:1;background:#000;position:relative;overflow:hidden; z-index:5; display:flex; align-items:center; justify-content:center; }
iframe, .plyr-container-box{ width:100%; height:100%; border:none; display:none; background:#000; transition: all 0.3s ease; }
.vid-overlay{ position:absolute;inset:0; background: rgba(1, 3, 8, 0.95); z-index:10; }

.plyr { height: 100% !important; width: 100% !important; }
.plyr__video-wrapper { height: 100% !important; display: flex; align-items: center; justify-content: center; }
.plyr video { transition: transform 0.3s ease, object-fit 0.3s ease; }

/* ─── GLASSMORPHISM LOADING SKELETON ─── */
.skeleton-loader {
  position: absolute; inset: 0;
  background: rgba(6, 12, 28, 0.7);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  z-index: 15;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 20px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}
.skeleton-loader.active { opacity: 1; pointer-events: auto; }

.glass-card {
  width: min(85%, 480px);
  padding: 30px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 16px;
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
  display: flex; flex-direction: column; gap: 16px; align-items: center;
  position: relative; overflow: hidden;
}

.skeleton-box {
  background: rgba(255, 255, 255, 0.08);
  border-radius: 8px;
  position: relative;
  overflow: hidden;
}
.skeleton-box::after {
  content: "";
  position: absolute; top: 0; right: 0; bottom: 0; left: 0;
  transform: translateX(-100%);
  background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0) 100%);
  animation: shimmer 1.5s infinite;
}
@keyframes shimmer {
  100% { transform: translateX(100%); }
}

.sk-logo { width: 64px; height: 64px; border-radius: 12px; }
.sk-title { width: 60%; height: 20px; }
.sk-subtitle { width: 40%; height: 12px; }
.sk-bar { width: 100%; height: 6px; border-radius: 3px; margin-top: 10px; }

.adv-interstitial {
  position: absolute; inset: 0;
  background: rgba(2, 5, 15, 0.95);
  z-index: 20;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px; text-align: center;
}
.adv-interstitial-card {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  padding: 32px; border-radius: 16px;
  max-width: 420px; width: 100%;
  box-shadow: 0 12px 40px rgba(0,0,0,0.6);
}
.adv-interstitial h3 { font-size: 20px; font-weight: 800; margin-bottom: 8px; letter-spacing: 0.5px; }
.adv-interstitial p { color: var(--muted2); font-size: 13px; line-height: 1.6; margin-bottom: 24px; }
.btn-adv-action {
  background: var(--accent); color: #fff; border: none;
  padding: 12px 24px; border-radius: 8px; font-weight: 700; font-size: 14px;
  cursor: pointer; transition: background 0.2s; width: 100%;
}
.btn-adv-action:hover { opacity: 0.9; }
.btn-adv-action.secondary { background: rgba(255, 255, 255, 0.1); border: 1px solid var(--border); margin-top: 10px; }
.btn-adv-action.secondary:hover { background: rgba(255, 255, 255, 0.15); }

@media(max-width:768px){
  .layout{ grid-template-columns:1fr; grid-template-rows: auto 1fr; height: calc(100vh - 58px); }
  .layout.theater-active { grid-template-columns: 1fr; grid-template-rows: calc(100vh - 58px) 0px; }
  .ch-sidebar{ max-height: 50vh; border-right:none; order:2; }
  .layout.theater-active .ch-sidebar { transform: translateY(100%); max-height: 0px; opacity: 0; padding: 0; }
  .player-area{ order:1; height: 40vh; transition: height 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
  .layout.theater-active .player-area { height: calc(100vh - 58px); }
  nav{padding:0 14px}
  .nav-logo{ width: auto; }
  .nav-search{ max-width: 160px; margin: 0 0 0 auto; }
  .nav-spacer { width: auto; }
  .btn-theater span { font-size: 16px; }
  .btn-theater { padding: 6px 10px; }
  .btn-theater text { display: none; }
  .aspect-ratio-selector { padding: 4px 6px; font-size: 11px; }
}
</style>
</head>
<body>

<!-- İLK GİRİŞ ANİMASYONU OVERLAY -->
<div class="netflix-intro-overlay" id="netflixIntro">
  <div class="intro-text-box">
    <div class="f-wrapper">
      <span class="intro-f">F</span>
    </div><span class="intro-rest">ATBOK</span>
  </div>
</div>

<div class="liquid-bg"></div>

<nav>
  <div class="nav-logo" onclick="replayIntro()">FATBOK</div>
  <div class="nav-search">
    <span class="search-icon">🔍</span>
    <input type="text" placeholder="Kanal ara..." id="searchInput" oninput="filterChannels(this.value)"/>
  </div>
  <div class="nav-spacer">
    <div class="theme-picker-wrap">
      <span class="theme-icon">🎨</span>
      <select class="theme-select" id="themeSelect" onchange="changeTheme(this.value)">
        <option value="blue">Mavi</option>
        <option value="red">Kırmızı</option>
        <option value="green">Yeşil</option>
        <option value="purple">Mor</option>
        <option value="yellow">Sarı</option>
      </select>
    </div>
  </div> 
</nav>

<div class="layout" id="mainLayout">

  <div class="ch-sidebar">
    <!-- Ana Sekmeler (Kanallar / Maçlar) -->
    <div class="main-tabs-wrap">

function changeTheme(themeKey) {
  const t = colorThemes[themeKey] || colorThemes.blue;
  const root = document.documentElement;
  
  root.style.setProperty('--accent', t.accent);
  root.style.setProperty('--accent-glow', t.glow);
  root.style.setProperty('--surface3', t.surface3);
  root.style.setProperty('--border2', t.border2);

  root.style.setProperty('--plyr-color-main', t.accent);
  
  localStorage.setItem('fatbok_theme', themeKey);
}

// Her gün güncelleyebileceğin veya ekleyebileceğin günlük maçlar listesi
const dailyMatches = [
  {
    time: "21.00",
    homeTeam: "Galatasaray",
    homeLogo: "https://img.icons8.com/color/48/galatasaray-sk.png", // Buraya kendi png linkini koyabilirsin
    awayTeam: "Fenerbahçe",
    awayLogo: "https://img.icons8.com/color/48/fenerbahce.png"  // Buraya kendi png linkini koyabilirsin
  }
  // İstediğin kadar alt alta maç ekleyebilirsin:
  // { time: "19.00", homeTeam: "Beşiktaş", homeLogo: "...", awayTeam: "Trabzonspor", awayLogo: "..." }
];
  
const fallbackLogo = "https://img.icons8.com/fluency/48/television.png";

let currentCategory = 'tr'; 
let currentSearch = '';
let activeTab = 'channels'; // 'channels' veya 'matches'
let activeId = null;
let hlsInstance = null;
let selectedChannelObj = null;
let plyrInstance = null;

function initPlyr() {
  if (!plyrInstance) {
    plyrInstance = new Plyr('#hlsPlayer', {
      controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
      tooltips: { controls: true, seek: true }
    });
  }
}

function switchMainTab(tab) {
  activeTab = tab;
  document.getElementById('tabChannelsBtn').classList.toggle('active', tab === 'channels');
  document.getElementById('tabMatchesBtn').classList.toggle('active', tab === 'matches');
  
  const countryFilters = document.getElementById('countryFilters');
  const searchInput = document.getElementById('searchInput');

  if (tab === 'matches') {
    countryFilters.style.display = 'none';
    if(searchInput) searchInput.parentElement.style.display = 'none';
    renderMatchesList();
  } else {
    countryFilters.style.display = 'flex';
    if(searchInput) searchInput.parentElement.style.display = 'flex';
    renderCountryFilters();
    renderList();
  }
}

function renderCountryFilters() {
  const container = document.getElementById('countryFilters');
  container.innerHTML = '';
  
  const fragment = document.createDocumentFragment();
  countries.forEach(country => {
    const btn = document.createElement('button');
    btn.className = `country-btn ${currentCategory === country.code ? 'active' : ''}`;
    btn.innerHTML = `<span class="flag-icon">${country.flag}</span> ${country.name}`;
    btn.onclick = () => {
      currentCategory = country.code;
      renderCountryFilters();
      renderList();
    };
    fragment.appendChild(btn);
  });
  container.appendChild(fragment);
}

function renderMatchesList() {
  const list = document.getElementById('chList');
  list.innerHTML = '';

  if (dailyMatches.length === 0) {
    list.innerHTML = `<div style="text-align:center; padding:20px; color:var(--muted2); font-size:13px;">Bugün için maç bulunmuyor.</div>`;
    return;
  }

  const fragment = document.createDocumentFragment();
  dailyMatches.forEach(match => {
    const card = document.createElement('div');
    card.className = 'match-card';
    card.innerHTML = `
      <div class="match-team-side">
        <img src="${match.homeLogo}" alt="${match.homeTeam}" class="match-team-logo" onerror="this.src='${fallbackLogo}'"/>
        <span class="match-team-name">${match.homeTeam}</span>
      </div>
      <div class="match-center-info">
        <span class="match-time">${match.time}</span>
        <span class="match-vs">VS</span>
      </div>
      <div class="match-team-side right">
        <span class="match-team-name">${match.awayTeam}</span>
        <img src="${match.awayLogo}" alt="${match.awayTeam}" class="match-team-logo" onerror="this.src='${fallbackLogo}'"/>
      </div>
    `;
    fragment.appendChild(card);
  });
  list.appendChild(fragment);
}

function renderList(){
  if (activeTab !== 'channels') return;

  const list = document.getElementById('chList');
  let filtered = channels.filter(c=>{
    const matchesCategory = (c.cat === currentCategory);
    const matchesSearch = (!currentSearch || c.name.toLowerCase().includes(currentSearch.toLowerCase()));
    return matchesCategory && matchesSearch;
  });

  list.innerHTML='';
  const fragment = document.createDocumentFragment();
  
  filtered.forEach(c=>{
    const countryObj = countries.find(item => item.code === c.cat);
    const flagSymbol = countryObj ? countryObj.flag : "🌐";

    const card=document.createElement('div');
    card.className='ch-card'+(activeId===c.id?' active':'');
    card.innerHTML=`
      <div class="ch-card-flag">${flagSymbol}</div>
      <div class="ch-logo">
        <img src="${c.logo}" alt="${c.name}" loading="lazy" onerror="this.onerror=null; this.src='${fallbackLogo}';"/>
      </div>
      <div class="ch-info">
        <div class="ch-name">${c.name}</div>
      </div>
      <div class="ch-live-badge"></div>
    `;
    card.onclick=()=>selectChannel(c);
    fragment.appendChild(card);
  });
  list.appendChild(fragment);
}

function selectChannel(c){
  activeId=c.id;
  selectedChannelObj = c; 
  renderList();

  const logoEl = document.getElementById('nowLogo');
  logoEl.style.display = 'flex';
  logoEl.innerHTML = `<img src="${c.logo}" alt="${c.name}" onerror="this.onerror=null; this.src='${fallbackLogo}';"/>`;
  document.getElementById('nowName').textContent=c.name;
  document.getElementById('theaterBtn').style.display = 'flex';
  document.getElementById('aspectSelect').style.display = 'inline-block';
  document.getElementById('vidOverlay').style.display = 'none';
  
  const iframePlayer = document.getElementById('embedPlayer');
  const plyrWrapper = document.getElementById('plyrWrapper');
  const hlsPlayer = document.getElementById('hlsPlayer');
  const interstitial = document.getElementById('advInterstitial');

  if (hlsInstance) {
    hlsInstance.destroy();
    hlsInstance = null;
  }
  
  hlsPlayer.pause();
  hlsPlayer.src = "";
  plyrWrapper.style.display = "none";
  iframePlayer.style.display = "none";
  iframePlayer.src = "";

  const tokenExpire = localStorage.getItem('fatbok_premium_token');
  
  if (tokenExpire && parseInt(tokenExpire) > Date.now()) {
    interstitial.style.display = "none";
    startActualStream(c);
  } else {
    interstitial.style.display = "flex";
    document.getElementById('advText').textContent = "SADECE 1 REKLAM İZLEYEREK REKLAMSIZ İZLEYEBİLİRSİNİZ.";
    
    const advBtn = document.getElementById('advBtn');
    advBtn.className = "btn-adv-action";
    advBtn.textContent = "🔗 Reklamı Geç ve İzle";
    advBtn.setAttribute('onclick', 'handleAdClick()');
  }

  setAmbientColor(c.cat);
}

function handleAdClick() {
  if (!selectedChannelObj) return;
  const targetAdLink = selectedChannelObj.adLink ? selectedChannelObj.adLink : DEFAULT_AD_LINK;
  window.open(targetAdLink, '_blank');

  const advBtn = document.getElementById('advBtn');
  document.getElementById('advText').textContent = "Reklamı yan sekmede açtık. Reklamı geçtikten sonra aşağıdaki butona tıklayarak yayını başlatabilirsiniz.";
  
  advBtn.textContent = "▶ Yayını Başlat";
  advBtn.className = "btn-adv-action secondary";
  advBtn.setAttribute('onclick', 'handleStreamStart()');
}

function handleStreamStart() {
  if (!selectedChannelObj) return;
  const expireTime = Date.now() + (24 * 60 * 60 * 1000);
  localStorage.setItem('fatbok_premium_token', expireTime.toString());

  document.getElementById('advInterstitial').style.display = "none";
  startActualStream(selectedChannelObj);
}

function showSkeleton() {
  const sk = document.getElementById('skeletonLoader');
  sk.classList.add('active');
}

function hideSkeleton() {
  const sk = document.getElementById('skeletonLoader');
  sk.classList.remove('active');
}

function startActualStream(c) {
  showSkeleton();

  const iframePlayer = document.getElementById('embedPlayer');
  const plyrWrapper = document.getElementById('plyrWrapper');
  const hlsPlayer = document.getElementById('hlsPlayer');

  if (c.stream.includes('.m3u8')) {
    iframePlayer.removeAttribute('sandbox');
    plyrWrapper.style.display = "block";
    initPlyr(); 
    
    if (Hls.isSupported()) {
      hlsInstance = new Hls();
      hlsInstance.loadSource(c.stream);
      hlsInstance.attachMedia(hlsPlayer);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
        hlsPlayer.play().catch(() => {});
        hideSkeleton();
      });
      hlsInstance.on(Hls.Events.ERROR, function() {
        hideSkeleton();
      });
    } else if (hlsPlayer.canPlayType('application/vnd.apple.mpegurl')) {
      hlsPlayer.src = c.stream;
      hlsPlayer.play().catch(() => {});
      hideSkeleton();
    }
  } else {
    iframePlayer.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms');
    iframePlayer.style.display = "block";
    iframePlayer.src = c.stream; 
    
    iframePlayer.onload = function() {
      hideSkeleton();
    };
    setTimeout(() => { hideSkeleton(); }, 2500);
  }
}

function changeAspectRatio(ratio) {
  const hlsVideo = document.querySelector('#hlsPlayer');
  const iframePlayer = document.getElementById('embedPlayer');
  const plyrWrapper = document.getElementById('plyrWrapper');

  const elements = [hlsVideo, iframePlayer, plyrWrapper];

  elements.forEach(el => {
    if (!el) return;
    switch (ratio) {
      case '16:9':
        el.style.objectFit = 'contain';
        el.style.transform = 'scale(1)';
        break;
      case '4:3':
        el.style.objectFit = 'contain';
        el.style.transform = 'scaleX(0.75)';
        break;
      case '21:9':
        el.style.objectFit = 'cover';
        el.style.transform = 'scaleY(0.85)';
        break;
      case 'stretch':
        el.style.objectFit = 'fill';
        el.style.transform = 'scale(1)';
        break;
    }
  });
}

function setAmbientColor(cat) {
  const glowEl = document.getElementById('ambientGlow');
  const currentAccentGlow = getComputedStyle(document.documentElement).getPropertyValue('--ambient-glow-color').trim();
  glowEl.style.setProperty('--ambient-glow-color', currentAccentGlow);
}

function toggleTheaterMode() {
  const layout = document.getElementById('mainLayout');
  const btn = document.getElementById('theaterBtn');
  const btnText = btn.querySelector('.btn-text');
  
  layout.classList.toggle('theater-active');
  btn.classList.toggle('active');
  
  if(layout.classList.contains('theater-active')) {
    if(btnText) btnText.textContent = " Normal Mod";
  } else {
    if(btnText) btnText.textContent = " Sinema Modu";
  }
}

function filterChannels(q){
  currentSearch=q;
  renderList();
}

renderCountryFilters();
renderList();
</script>
