<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FATBOK - Film ve Dizi Platformu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0505;
  --surface: rgba(25, 10, 10, 0.45);
  --surface-hover: rgba(45, 15, 15, 0.6);
  --accent:#e50914;
  --text:#ffffff;
  --muted:#b3b3b3;
}
html{scroll-behavior:smooth}
body{
  background: var(--bg);
  color:var(--text);
  font-family:'Manrope',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  padding-bottom: 90px;
  position: relative;
}

/* NETFLIX TARZI KIRMIZI LOŞ IŞIK SÜZMESİ (ATMOSFER) */
body::before {
  content: '';
  position: fixed;
  top: -150px; left: 50%;
  transform: translateX(-50%);
  width: 700px; height: 350px;
  background: radial-gradient(ellipse, rgba(229, 9, 20, 0.22) 0%, transparent 70%);
  z-index: -1;
  pointer-events: none;
}
body::after {
  content: '';
  position: fixed;
  bottom: -100px; right: -100px;
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(180, 0, 10, 0.12) 0%, transparent 70%);
  z-index: -1;
  pointer-events: none;
}

/* NAVBAR - LIQUID GLASS & RED GLOW */
nav{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  height:65px;
  background: rgba(15, 5, 5, 0.65);
  display:flex;align-items:center;
  justify-content:space-between;
  padding:0 4%;
  border-bottom: 1px solid rgba(229, 9, 20, 0.15);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  transition: background 0.3s;
}
nav.scrolled { 
  background: rgba(10, 3, 3, 0.88); 
  border-bottom: 1px solid rgba(229, 9, 20, 0.25); 
}
.nav-left{display:flex;align-items:center;gap:30px}

/* FATBOK LOGOSU */
.nav-logo{
  font-family:'Barlow Condensed',sans-serif;
  font-size:28px;font-weight:900;letter-spacing:2px;
  color:var(--accent);
  text-decoration:none;
  text-shadow: 0 0 15px rgba(229, 9, 20, 0.7);
  cursor:pointer;
}

.nav-right{display:flex;align-items:center;gap:15px}

/* LIQUID GLASS ARAMA ALANI */
.search-container{position:relative;display:flex;align-items:center;}
.search-input{
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding:7px 12px 7px 34px;border-radius:10px;color:#fff;font-size:13px;outline:none;width:150px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition:all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
}
.search-input:focus{
  width:210px;
  border-color: rgba(229, 9, 20, 0.6);
  background: rgba(255, 255, 255, 0.08);
  box-shadow: 0 0 20px rgba(229, 9, 20, 0.2);
}
.search-icon{position:absolute;left:10px;color:var(--muted);font-size:13px;pointer-events:none;}

/* HERO BÖLÜMÜ */
.hero{
  height:40vh;position:relative;
  background: linear-gradient(180deg, rgba(20,5,5,0.7), rgba(10,5,5,0.9));
  display:flex;align-items:flex-end;
  padding:0 4% 40px 4%;
  margin-top: 65px;
  border-bottom: 1px solid rgba(229, 9, 20, 0.1);
}

/* İÇERİK KISMI */
.content-rows{padding:25px 4%;position:relative;z-index:20;}
.row-section { margin-bottom: 30px; }
.row-title{font-size:18px;font-weight:700;margin-bottom:12px;color:#f3f4f6;letter-spacing:0.5px;}
.row-container{
  display:flex;gap:14px;overflow-x:auto;padding-bottom:15px;scroll-behavior:smooth;
  -webkit-overflow-scrolling: touch;
}
.row-container::-webkit-scrollbar{height:4px}
.row-container::-webkit-scrollbar-thumb{background:rgba(229, 9, 20, 0.3);border-radius:2px}

/* DİKEY LİKİT CAM KART YAPISI */
.card{
  min-width: 140px; 
  height: 210px; 
  background: var(--surface);
  border-radius: 12px;
  overflow: hidden; 
  position: relative; 
  cursor: pointer; 
  flex-shrink: 0;
  border: 1px solid rgba(255, 255, 255, 0.07);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
  display: flex; flex-direction: column; justify-content: flex-end;
  transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
  background-size: cover;
  background-position: center;
}
@media(min-width: 768px) {
  .card { min-width: 175px; height: 260px; }
}
.card:hover{
  transform: translateY(-6px) scale(1.04);
  z-index:50;
  border-color: rgba(229, 9, 20, 0.5);
  background: var(--surface-hover);
  box-shadow: 0 16px 45px rgba(229, 9, 20, 0.25), inset 0 0 15px rgba(229, 9, 20, 0.1);
}
.card-content-inner{
  text-align: left; 
  padding: 12px; 
  width: 100%;
  background: linear-gradient(180deg, transparent 0%, rgba(10,5,5,0.95) 80%);
}
.card-title{font-size:13px;font-weight:700;color:#fff;letter-spacing:0.3px;white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
.card-subtitle{font-size:10px;color:var(--muted);margin-top:2px;}

/* LIQUID GLASS 3D ALT NAVİGASYON BARI */
.bottom-nav-wrapper {
  position: fixed;
  bottom: 15px; left: 0; right: 0;
  display: flex;
  justify-content: center;
  z-index: 1500;
  padding: 0 16px;
  pointer-events: none;
}

.bottom-nav {
  pointer-events: auto;
  width: 100%;
  max-width: 420px;
  height: 64px;
  background: rgba(20, 8, 8, 0.6);
  border: 1px solid rgba(229, 9, 20, 0.25);
  border-radius: 22px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 
    0 25px 50px rgba(0, 0, 0, 0.8),
    0 0 25px rgba(229, 9, 20, 0.15),
    inset 0 1px 2px rgba(255, 255, 255, 0.2);
  padding: 0 8px;
}

.bottom-nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: var(--muted);
  text-decoration: none;
  font-size: 11px;
  font-weight: 700;
  transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
  padding: 6px 14px;
  border-radius: 14px;
}

.bottom-nav-item svg { 
  width: 20px; 
  height: 20px; 
  fill: currentColor; 
  transition: transform 0.2s ease;
}

.bottom-nav-item:hover {
  color: #fff;
}

.bottom-nav-item.active {
  color: #ffffff;
  background: linear-gradient(180deg, #ff1e27 0%, #a00008 100%);
  border: 1px solid rgba(255, 255, 255, 0.3);
  box-shadow: 
    0 6px 20px rgba(229, 9, 20, 0.7),
    inset 0 1px 1px rgba(255, 255, 255, 0.4);
}

.bottom-nav-item.active svg {
  transform: scale(1.1);
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
}

/* MODAL PENCERE */
.modal-overlay{
  position:fixed;inset:0;background:rgba(10, 3, 3, 0.85);z-index:2000;display:none;align-items:center;justify-content:center;padding:15px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.modal{
  background: rgba(25, 10, 10, 0.9);
  border: 1px solid rgba(229, 9, 20, 0.3);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  width:100%;max-width:600px;border-radius:16px;overflow:hidden;
  box-shadow: 0 25px 60px rgba(0,0,0,0.9), 0 0 30px rgba(229, 9, 20, 0.15);
  position:relative;
  max-height: 90vh; overflow-y: auto;
}
.modal-close{
  position:absolute;top:12px;right:12px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color:#fff;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center;
  backdrop-filter: blur(5px);
  transition: background 0.2s;
}
.modal-close:hover { background: rgba(229, 9, 20, 0.4); }

.modal-header-box{
  height:220px;width:100%;background: rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;border-bottom:1px solid rgba(229, 9, 20, 0.2);
  background-size: cover; background-position: center;
}
.modal-body{padding:24px;}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:900;margin-bottom:8px;}
.modal-desc{color:#b3b3b3;font-size:13px;line-height:1.6;margin-bottom:20px;}
.modal-actions{display:flex;gap:10px;}

.btn{
  padding:8px 20px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;border:none;display:flex;align-items:center;gap:6px;transition:opacity 0.2s;text-decoration:none;
}
.btn-primary{background:#e50914;color:#fff;}
.btn-primary:hover{opacity:0.85}

footer{padding:30px 4%;color:var(--muted);text-align:center;font-size:12px;border-top:1px solid rgba(229, 9, 20, 0.1);margin-top:20px}
</style>
</head>
<body>

<nav id="navbar">
  <div class="nav-left">
    <a class="nav-logo" href="index.html">FATBOK</a>
  </div>
  <div class="nav-right">
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" placeholder="Film veya dizi ara..." id="searchInput" oninput="handleSearch(this.value)"/>
    </div>
  </div>
</nav>

<!-- HERO BÖLÜMÜ -->
<section class="hero" id="heroSection"></section>

<!-- KATEGORİ SATIRLARI (DİKEY KARTLAR) -->
<div class="content-rows" id="contentRows">
  
  <!-- Trendler -->
  <div class="row-section">
    <div class="row-title">🔥 Trendler</div>
    <div class="row-container">
      <div class="card" style="background-image: url('https://image.tmdb.org/t/p/original/7QMsOTMUswlwxJP0rTTZfmz2tX2.jpg');" onclick="openModal('House of the Dragon', 'Daenerys Targaryen\'in doğumundan 172 yıl önce, en güçlü döneminde Targaryen Hanedanı içinde yaşanan bir iç veraset savaşı.', 'https://image.tmdb.org/t/p/original/2xGcSLyTAzConiHAByWqhfLiatT.jpg')">
        <div class="card-content-inner">
          <div class="card-title">House of the Dragon</div>
          <div class="card-subtitle">Sezon 1 • Bölüm 1</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Son Eklenen Diziler -->
  <div class="row-section">
    <div class="row-title">⚡ Son Eklenen Diziler</div>
    <div class="row-container">
      <div class="card" style="background-image: url('https://image.tmdb.org/t/p/original/7QMsOTMUswlwxJP0rTTZfmz2tX2.jpg');" onclick="openModal('House of the Dragon', 'Daenerys Targaryen\'in doğumundan 172 yıl önce, en güçlü döneminde Targaryen Hanedanı içinde yaşanan bir iç veraset savaşı.', 'https://image.tmdb.org/t/p/original/2xGcSLyTAzConiHAByWqhfLiatT.jpg')">
        <div class="card-content-inner">
          <div class="card-title">House of the Dragon</div>
          <div class="card-subtitle">Sezon 1 • Bölüm 1</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Son Eklenen Filmler -->
  <div class="row-section">
    <div class="row-title">🎬 Son Eklenen Filmler</div>
    <div class="row-container">
      <div class="card" onclick="openModal('Film Örneği 1', 'Film açıklaması buraya gelecek.', '')">
        <div class="card-content-inner">
          <div class="card-title">Film Adı 1</div>
          <div class="card-subtitle">2026 • Sinema</div>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- LIQUID GLASS 3D ALT NAVİGASYON BARI -->
<div class="bottom-nav-wrapper">
  <div class="bottom-nav">
    <a href="index.html" class="bottom-nav-item active">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Anasayfa
    </a>
    <a href="filmler.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg>
      Filmler
    </a>
    <a href="diziler.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
      Diziler
    </a>
  </div>
</div>

<!-- MODAL PENCERE -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalContent">
    <button class="modal-close" onclick="closeModalBtn()">✕</button>
    <div class="modal-header-box" id="modalHeaderBox">
      <span id="modalHeaderFallback">🎬</span>
    </div>
    <div class="modal-body">
      <h2 class="modal-title" id="modalTitle">İçerik Adı</h2>
      <p class="modal-desc" id="modalDesc">Açıklama alanı burada yer alacak...</p>
      <div class="modal-actions">
        <a href="house-of-the-dragon.html" class="btn btn-primary" id="modalWatchBtn">▶ Hemen İzle</a>
      </div>
    </div>
  </div>
</div>

<footer>
  <p>© 2026 FATBOK Inc. Tüm hakları saklıdır.</p>
</footer>

<script>
function openModal(title, desc, headerImg) {
  document.getElementById('modalTitle').innerText = title;
  document.getElementById('modalDesc').innerText = desc;
  
  const headerBox = document.getElementById('modalHeaderBox');
  const fallback = document.getElementById('modalHeaderFallback');
  
  if (headerImg && headerImg !== '') {
    headerBox.style.backgroundImage = `url('${headerImg}')`;
    fallback.style.display = 'none';
  } else {
    headerBox.style.backgroundImage = 'none';
    fallback.style.display = 'block';
  }

  const watchBtn = document.getElementById('modalWatchBtn');
  if (title === 'House of the Dragon') {
    watchBtn.setAttribute('href', 'house-of-the-dragon.html');
  } else {
    watchBtn.setAttribute('href', 'watch.html');
  }

  document.getElementById('modalOverlay').style.display = 'flex';
}

function closeModal(event) {
  if (event.target.id === 'modalOverlay') {
    document.getElementById('modalOverlay').style.display = 'none';
  }
}

function closeModalBtn() {
  document.getElementById('modalOverlay').style.display = 'none';
}

function handleSearch(query) {
  const cards = document.querySelectorAll('.card');
  query = query.toLowerCase();
  cards.forEach(card => {
    const title = card.querySelector('.card-title').innerText.toLowerCase();
    if (title.includes(query)) {
      card.style.display = 'flex';
    } else {
      card.style.display = 'none';
    }
  });
}
</script>

</body>
</html>
