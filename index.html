<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CREX</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<!-- Plyr Player CSS JS-->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<!-- Vercel Analytics -->
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#02050f;
  --surface: rgba(10, 15, 30, 0.95);
  --surface2: rgba(255, 255, 255, 0.03);
  --surface3: rgba(0, 122, 255, 0.2);
  --border: rgba(255, 255, 255, 0.14);
  --border2: rgba(0, 122, 255, 0.5);
  --accent:#007aff;
  --accent-glow:rgba(0, 122, 255, 0.2);
  --blue:#0055ff;
  --text:#ffffff;
  --muted:#7ba1d5;
  --muted2:#94a3b8;
  
  --plyr-color-main: var(--accent);
  --plyr-video-background: #000000;
}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Manrope',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  position: relative;
}

/* ─── ARKA PLAN ─── */
.liquid-bg {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: -1;
  background: #02050f;
}

/* ─── NAV ─── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:300;
  height:58px;
  background: rgba(2, 6, 18, 0.98);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;
  justify-content: space-between;
  padding:0 24px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
}
.nav-logo{
  display: flex;
  align-items: center;
  width: 150px;
  height: 36px;
  cursor: pointer;
  user-select: none;
  flex-shrink: 0;
}
.nav-logo img {
  max-height: 100%;
  max-width: 100%;
  object-fit: contain;
}
.nav-search{
  flex:1;
  max-width:320px;
  display:flex;align-items:center;gap:10px;
  background: rgba(255, 255, 255, 0.06);
  border:1px solid var(--border);
  border-radius:8px;padding:0 14px;height:36px;
  margin: 0 auto;
}
.nav-search input{
  background:none;border:none;outline:none;
  color:var(--text);font-size:13px;font-family:'Manrope',sans-serif;
  width:100%;
}
.nav-search input::placeholder{color:var(--muted)}
.search-icon{color:var(--muted);font-size:14px;flex-shrink:0}
.nav-spacer { width: 150px; flex-shrink: 0; display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
.live-dot{width:7px;height:7px;background:#34c759;border-radius:50%;opacity:0.9;}

/* ─── LAYOUT ─── */
.layout{
  display:grid;
  grid-template-columns:320px 1fr;
  margin-top:58px;
  height:calc(100vh - 58px);
}
.layout.theater-active { grid-template-columns: 0px 1fr; }

/* ─── CHANNEL SIDEBAR ─── */
.ch-sidebar{
  background: var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  overflow:hidden;
  height: 100%;
  position: relative;
}
.layout.theater-active .ch-sidebar {
  transform: translateX(-320px);
  opacity: 0;
  pointer-events: none;
}

/* DOMAIN */
.domain-alert {
  padding: 10px 12px;
  background: rgba(0, 122, 255, 0.08);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.domain-alert-text {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--text);
  line-height: 1.4;
}
.domain-icon { font-size: 14px; }
.domain-link {
  color: var(--accent);
  font-weight: 800;
  text-decoration: underline;
  cursor: pointer;
}

.country-filter-wrap{
  padding: 10px 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  overflow-x: auto;
  display: flex;
  gap: 6px;
}
.country-filter-wrap::-webkit-scrollbar { height: 3px; }
.country-filter-wrap::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.15);
  border-radius: 10px;
}
.country-btn{
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text);
  font-size: 12px; font-weight: 600;
  cursor: pointer; white-space: nowrap;
}
.country-btn.active{
  background: var(--accent);
  border-color: var(--accent);
}
.country-btn .flag-icon { font-size: 14px; }

/* Sekmeler (Kanallar / Maçlar) */
.main-tabs-wrap {
  display: flex;
  background: rgba(0,0,0,0.3);
  border-bottom: 1px solid var(--border);
  padding: 8px;
  gap: 8px;
}
.main-tab-btn {
  flex: 1;
  padding: 8px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--muted2);
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  text-align: center;
}
.main-tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.ch-list{
  flex:1;overflow-y:auto;padding:8px;
  position: relative;
}
.ch-list::-webkit-scrollbar{width:4px}
.ch-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:2px}

.ch-card{
  display:flex;align-items:center;gap:12px;
  padding:12px;border-radius:8px;
  cursor:pointer;
  border:1px solid transparent;
  margin-bottom:4px;
  background: rgba(255, 255, 255, 0.02);
  position: relative;
  overflow: hidden;
}
.ch-card:hover{
  background: rgba(255, 255, 255, 0.09);
  border-color: rgba(255, 255, 255, 0.25);
}
.ch-card.active{
  background: var(--surface3);
  border-color: var(--accent);
}

.ch-card-flag {
  font-size: 16px; flex-shrink: 0;
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.04);
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.08);
}

.ch-logo{
  width:44px;height:44px;border-radius:8px;
  background: rgba(255, 255, 255, 0.98);
  border:1px solid rgba(255,255,255,0.5);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;flex-shrink:0;padding:4px;
}
.ch-logo img{ max-width:100%;max-height:100%;object-fit:contain; }
.ch-info{flex:1;min-width:0}
.ch-name{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-live-badge{ flex-shrink:0;width:7px;height:7px;background:#34c759;border-radius:50%; }

/* Lig / Kategori Başlığı */
.league-group-header {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 0.5px;
  color: #fff;
  background: rgba(255, 255, 255, 0.06);
  padding: 5px 10px;
  border-radius: 4px;
  margin: 12px 0 6px 0;
  border-left: 3px solid var(--accent);
}
.league-group-header:first-child {
  margin-top: 2px;
}

/* Tarih Grubu Başlığı */
.date-group-header {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 1px;
  color: var(--accent);
  background: rgba(0, 122, 255, 0.08);
  padding: 6px 10px;
  border-radius: 6px;
  margin: 10px 0 6px 0;
  border-left: 3px solid var(--accent);
}
.date-group-header:first-child {
  margin-top: 2px;
}

/* Maç Kartı Tasarımı */
.match-card {
  display: flex;
  flex-direction: column;
  padding: 10px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 6px;
  gap: 8px;
}
.match-card:hover {
  border-color: rgba(255, 255, 255, 0.25);
}

/* 3D Kura Çekimi Kartı Özel Stili */
.match-card.ucl-3d-card {
  background: linear-gradient(135deg, rgba(0, 32, 96, 0.6) 0%, rgba(10, 15, 30, 0.9) 100%);
  border: 1px solid rgba(0, 122, 255, 0.6);
  box-shadow: 0 8px 25px rgba(0, 122, 255, 0.25), inset 0 0 15px rgba(0, 122, 255, 0.15);
  transform: perspective(800px) rotateX(2deg);
  transition: all 0.3s ease;
}
.match-card.ucl-3d-card:hover {
  transform: perspective(800px) rotateX(0deg) scale(1.01);
  box-shadow: 0 12px 30px rgba(0, 122, 255, 0.4);
}

/* Sürekli Kendi Etrafında Dönen Logolar İçin Animasyon */
@keyframes spin3d {
  0% { transform: perspective(300px) rotateY(0deg); }
  100% { transform: perspective(300px) rotateY(360deg); }
}

.spinning-logo {
  animation: spin3d 4s linear infinite;
  transform-style: preserve-style;
  filter: drop-shadow(0 0 8px rgba(0, 122, 255, 0.6));
}

.match-main-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  cursor: pointer;
}
.match-team-side {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
}
.match-team-side.right {
  justify-content: flex-end;
  text-align: right;
}
.match-team-name {
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.match-team-logo {
  width: 24px;
  height: 24px;
  object-fit: contain;
  flex-shrink: 0;
}
.match-center-info {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 4px;
  flex-shrink: 0;
}
.match-time {
  font-size: 10px;
  font-weight: 800;
  color: var(--accent);
  background: rgba(0, 122, 255, 0.1);
  padding: 2px 5px;
  border-radius: 4px;
  margin-bottom: 2px;
}
.match-vs {
  font-size: 9px;
  color: var(--muted2);
  font-weight: 700;
}

/* Alternatif Yayın Butonları */
.match-alternatives {
  display: flex;
  gap: 6px;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
  padding-top: 6px;
}
.alt-stream-btn {
  flex: 1;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 11px;
  font-weight: 700;
  padding: 5px 4px;
  cursor: pointer;
  text-align: center;
}
.alt-stream-btn:hover {
  background: var(--accent);
  border-color: var(--accent);
}

/* REKLAM ALANI */
.adv-panel{
  padding:12px;
  border-top:1px solid var(--border);
  background: rgba(0, 0, 0, 0.4);
  flex-shrink:0;
  display:flex; justify-content:center; align-items:center;
}
.adv-link{ text-decoration: none; width: 100%; max-width: 300px; display: block; }
.adv-box{
  width:100%; height:100px;
  background: rgba(0, 0, 0, 0.3);
  border:1px dashed rgba(255,255,255,0.25);
  border-radius:6px;
  display:flex; align-items:center; justify-content:center;
  color:var(--muted2);
  font-size:12px; font-weight:600; letter-spacing:0.5px;
  text-align:center; cursor:pointer;
}

/* ─── PLAYER AREA YAPISI ─── */
.player-area{
  display:flex;flex-direction:column;
  overflow:hidden;
  background:transparent;
  position: relative;
}

.content-body-flex {
  display: flex;
  flex-direction: row;
  flex: 1;
  position: relative;
  z-index: 5;
  overflow: hidden;
}

.video-main-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
  background: #000;
  min-height: 250px;
  width: 100%;
}

.btn-theater {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 10px; border-radius: 6px;
  cursor: pointer; font-size: 12px; font-weight: 600;
  display: flex; align-items: center; gap: 5px;
  white-space: nowrap;
}

.now-header{
  padding:10px 16px;
  background: rgba(2, 6, 18, 0.95);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
  flex-shrink:0; min-height:60px; z-index:5;
}
.now-logo{
  width:40px;height:40px;border-radius:8px;
  background: rgba(255, 255, 255, 0.98);
  border:1px solid rgba(255,255,255,0.5);
  display:none; align-items:center;justify-content:center;
  overflow:hidden;padding:4px;flex-shrink:0;
}
.now-logo img{ max-width:100%;max-height:100%;object-fit:contain; }
.now-info{flex:1; display:flex; align-items:center; gap:8px; flex-wrap: nowrap; overflow:hidden;}
.now-ch-name{ font-family:'Barlow Condensed',sans-serif; font-size:18px;font-weight:800;letter-spacing:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.now-badges{display:flex;gap:8px;margin-left:auto}
.badge{ padding:4px 8px;border-radius:6px; font-size:10px;font-weight:700;letter-spacing:1px; }
.badge-live{background:var(--accent-glow);color:var(--accent);border:1px solid var(--border2);display:flex;align-items:center;gap:4px}

.video-wrap{ flex:1;background:#000;position:relative;overflow:hidden; z-index:5; display:flex; align-items:center; justify-content:center; }
iframe, .plyr-container-box{ width:100%; height:100%; border:none; display:none; background:#000; }
.vid-overlay{ position:absolute;inset:0; background: rgba(1, 3, 8, 0.95); z-index:10; }

.plyr { height: 100% !important; width: 100% !important; }
.plyr__video-wrapper { height: 100% !important; display: flex; align-items: center; justify-content: center; }
.plyr video { object-fit: contain; }

/* Yüklenme Ekranı */
.skeleton-loader {
  position: absolute; inset: 0;
  background: rgba(6, 12, 28, 0.95);
  z-index: 15;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 20px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease;
}
.skeleton-loader.active { opacity: 1; pointer-events: auto; }

.glass-card {
  width: min(85%, 480px);
  padding: 30px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 16px;
  display: flex; flex-direction: column; gap: 16px; align-items: center;
}

.skeleton-box {
  background: rgba(255, 255, 255, 0.08);
  border-radius: 8px;
}
.sk-logo { width: 64px; height: 64px; border-radius: 12px; }
.sk-title { width: 60%; height: 20px; }
.sk-subtitle { width: 40%; height: 12px; }
.sk-bar { width: 100%; height: 6px; border-radius: 3px; margin-top: 10px; }

/* ─── MOBİL UYUMLULUK ─── */
@media(max-width:768px){
  .layout{ grid-template-columns:1fr; grid-template-rows: auto 1fr; height: calc(100vh - 58px); }
  .layout.theater-active { grid-template-columns: 1fr; grid-template-rows: calc(100vh - 58px) 0px; }
  .ch-sidebar{ flex: 1; height: auto; max-height: none; border-right:none; order:2; position: relative; }
  .layout.theater-active .ch-sidebar { transform: translateY(100%); max-height: 0px; opacity: 0; padding: 0; }
  .player-area{ order:1; height: auto; }
  nav{padding:0 14px}
  .nav-logo{ width: auto; }
  .nav-search{ max-width: 140px; margin: 0 0 0 auto; }
  .nav-spacer { width: auto; }
}
</style>
</head>
<body>

<div class="liquid-bg"></div>

<nav>
  <div class="nav-logo">
    <img src="https://resmim.net/cdn/2026/08/26/Ex1rvD.png" alt="CREX Logo" />
  </div>
  <div class="nav-search">
    <span class="search-icon">🔍</span>
    <input type="text" placeholder="Kanal ara..." id="searchInput" oninput="filterChannels(this.value)"/>
  </div>
  <div class="nav-spacer"></div> 
</nav>

<div class="layout" id="mainLayout">

  <div class="ch-sidebar">
    <div class="domain-alert">
      <div class="domain-alert-text">
        <span class="domain-icon">📢</span>
        <div>
          Bir sonraki alan adımız <span class="domain-link" onclick="window.open('https:crex2.vercel.app', '_blank')">crex2.vercel.app</span> olacaktır.
        </div>
      </div>
    </div>

    <div class="main-tabs-wrap">
      <button class="main-tab-btn active" id="tabChannelsBtn" onclick="switchMainTab('channels')">📺 Kanallar</button>
      <button class="main-tab-btn" id="tabMatchesBtn" onclick="switchMainTab('matches')">⚽ Maçlar</button>
    </div>

    <div class="country-filter-wrap" id="countryFilters"></div>
    <div class="ch-list" id="chList"></div>
    
    <div class="adv-panel">
      <a href="mailto:crexproton@proton.me?subject=Reklam%20Basvurusu" class="adv-link">
        <div class="adv-box">
          Buraya Reklam Verebilirsiniz
        </div>
      </a>
    </div>
  </div>

  <div class="player-area">
    <div class="now-header">
      <div class="now-logo" id="nowLogo"></div>
      <div class="now-info">
        <div class="now-ch-name" id="nowName"></div>
        <button class="btn-theater" id="theaterBtn" onclick="toggleTheaterMode()" style="display:none;">
          <span>⛶</span><span class="btn-text">Tam Ekran</span>
        </button>
      </div>
      <div class="now-badges">
        <div class="badge badge-live"><div class="live-dot"></div>CANLI</div>
      </div>
    </div>

    <div class="content-body-flex">
      <div class="video-main-container" id="videoWrap">
        <div class="vid-overlay" id="vidOverlay"></div>
        
        <div class="skeleton-loader" id="skeletonLoader">
          <div class="glass-card">
            <div class="skeleton-box sk-logo"></div>
            <div class="skeleton-box sk-title"></div>
            <div class="skeleton-box sk-subtitle"></div>
            <div class="skeleton-box sk-bar"></div>
          </div>
        </div>

        <iframe id="embedPlayer" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        
        <div id="plyrWrapper" class="plyr-container-box">
          <video id="hlsPlayer" controls autoplay playsinline></video>
        </div>
      </div>
    </div>

  </div>

</div>

<script>
let hlsInstance = null;
let selectedChannelObj = null;
let plyrInstance = null;

function initPlyr() {
  if (!plyrInstance) {
    plyrInstance = new Plyr('#hlsPlayer', {
      controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
      tooltips: { controls: true, seek: true }
    });
  }
}

function switchMainTab(tab) {
  activeTab = tab;
  document.getElementById('tabChannelsBtn').classList.toggle('active', tab === 'channels');
  document.getElementById('tabMatchesBtn').classList.toggle('active', tab === 'matches');
  
  const countryFilters = document.getElementById('countryFilters');
  const searchInput = document.getElementById('searchInput');

  if (tab === 'matches') {
    countryFilters.style.display = 'none';
    if(searchInput) searchInput.parentElement.style.display = 'none';
    renderMatchesList();
  } else {
    countryFilters.style.display = 'flex';
    if(searchInput) searchInput.parentElement.style.display = 'flex';
    renderCountryFilters();
    renderList();
  }
}

function renderCountryFilters() {
  const container = document.getElementById('countryFilters');
  container.innerHTML = '';
  const fragment = document.createDocumentFragment();
  countries.forEach(country => {
    const btn = document.createElement('button');
    btn.className = `country-btn ${currentCategory === country.code ? 'active' : ''}`;
    btn.innerHTML = `<span class="flag-icon">${country.flag}</span> ${country.name}`;
    btn.onclick = () => {
      currentCategory = country.code;
      renderCountryFilters();
      renderList();
    };
    fragment.appendChild(btn);
  });
  container.appendChild(fragment);
}

function renderMatchesList() {
  const list = document.getElementById('chList');
  list.innerHTML = '';
  const fragment = document.createDocumentFragment();
  
  dailyMatchesByDate.forEach(group => {
    const dateHeader = document.createElement('div');
    dateHeader.className = 'date-group-header';
    dateHeader.textContent = group.date;
    fragment.appendChild(dateHeader);

    group.matches.forEach(match => {
      if (match.league) {
        const leagueHeader = document.createElement('div');
        leagueHeader.className = 'league-group-header';
        leagueHeader.textContent = match.league;
        fragment.appendChild(leagueHeader);
      }

      const card = document.createElement('div');
      
      // Eğer Kura Çekimi ise 3D kart sınıfını ve özel tasarımı ekle
      if (match.isUclDraw) {
        card.className = 'match-card ucl-3d-card';
      } else {
        card.className = 'match-card';
      }

      let firstChannelId = (match.channelIds && match.channelIds.length > 0) ? match.channelIds[0] : null;

      let cardHtml = '';
      if (match.isUclDraw && match.logos && match.logos.length > 0) {
        // Şampiyonlar Ligi Kura Çekimi için 3'lü dönebilen logo yapısı
        cardHtml = `
          <div class="match-main-row" ${firstChannelId ? `onclick="playMatchChannel(${firstChannelId})"` : ''} title="Yayını Başlat" style="justify-content: center; gap: 15px; padding: 6px 0;">
            <div style="display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%;">
              <img src="${match.logos[0]}" class="match-team-logo spinning-logo" style="width: 32px; height: 32px;" onerror="this.src='${fallbackLogo}'"/>
              <img src="${match.logos[1]}" class="match-team-logo spinning-logo" style="width: 32px; height: 32px;" onerror="this.src='${fallbackLogo}'"/>
              <img src="${match.logos[2]}" class="match-team-logo spinning-logo" style="width: 32px; height: 32px;" onerror="this.src='${fallbackLogo}'"/>
            </div>
          </div>
          <div style="text-align: center; margin-bottom: 2px;">
            <span class="match-time">${match.time}</span>
          </div>
        `;
      } else if (match.awayTeam) {
        cardHtml = `
          <div class="match-main-row" ${firstChannelId ? `onclick="playMatchChannel(${firstChannelId})"` : ''} title="Yayını Başlat">
            <div class="match-team-side">
              ${match.homeLogo ? `<img src="${match.homeLogo}" alt="${match.homeTeam}" class="match-team-logo" onerror="this.src='${fallbackLogo}'"/>` : ''}
              <span class="match-team-name">${match.homeTeam}</span>
            </div>
            <div class="match-center-info">
              <span class="match-time">${match.time}</span>
              <span class="match-vs">VS</span>
            </div>
            <div class="match-team-side right">
              <span class="match-team-name">${match.awayTeam}</span>
              ${match.awayLogo ? `<img src="${match.awayLogo}" alt="${match.awayTeam}" class="match-team-logo" onerror="this.src='${fallbackLogo}'"/>` : ''}
            </div>
          </div>
        `;
      } else {
        cardHtml = `
          <div class="match-main-row" ${firstChannelId ? `onclick="playMatchChannel(${firstChannelId})"` : ''} title="Yayını Başlat" style="justify-content: center; gap: 12px;">
            ${match.homeLogo ? `<img src="${match.homeLogo}" alt="${match.homeTeam}" class="match-team-logo" style="width: 24px; height: 24px;" onerror="this.src='${fallbackLogo}'"/>` : ''}
            <div style="display: flex; flex-direction: column; align-items: center;">
              <span class="match-time" style="margin-bottom: 2px;">${match.time}</span>
              <span class="match-team-name" style="font-size: 13px;">${match.homeTeam}</span>
            </div>
          </div>
        `;
      }

      if (match.channelIds && match.channelIds.length > 0) {
        cardHtml += `<div class="match-alternatives">`;
        match.channelIds.forEach((chId, index) => {
          const foundCh = channels.find(c => c.id === chId);
          const btnLabel = foundCh ? foundCh.name : `Alternatif ${index + 1}`;
          cardHtml += `<button class="alt-stream-btn" onclick="playMatchChannel(${chId})">▶ ${btnLabel}</button>`;
        });
        cardHtml += `</div>`;
      }
      card.innerHTML = cardHtml;
      fragment.appendChild(card);
    });
  });
  list.appendChild(fragment);
}

function playMatchChannel(chId) {
  const targetChannel = channels.find(c => c.id === chId);
  if (targetChannel) selectChannel(targetChannel);
}

function renderList(){
  if (activeTab !== 'channels') return;
  const list = document.getElementById('chList');
  let filtered = channels.filter(c => c.cat === currentCategory && (!currentSearch || c.name.toLowerCase().includes(currentSearch.toLowerCase())));

  list.innerHTML='';
  const fragment = document.createDocumentFragment();
  
  filtered.forEach(c => {
    const countryObj = countries.find(item => item.code === c.cat);
    const flagSymbol = countryObj ? countryObj.flag : "🌐";

    const card = document.createElement('div');
    card.className = 'ch-card' + (activeId === c.id ? ' active' : '');
    card.innerHTML = `
      <div class="ch-card-flag">${flagSymbol}</div>
      <div class="ch-logo">
        <img src="${c.logo}" alt="${c.name}" loading="lazy" onerror="this.onerror=null; this.src='${fallbackLogo}';"/>
      </div>
      <div class="ch-info">
        <div class="ch-name">${c.name}</div>
      </div>
      <div class="ch-live-badge"></div>
    `;
    card.onclick = () => selectChannel(c);
    fragment.appendChild(card);
  });
  list.appendChild(fragment);
}

function selectChannel(c){
  activeId = c.id;
  selectedChannelObj = c; 
  if (activeTab === 'channels') renderList();

  const logoEl = document.getElementById('nowLogo');
  logoEl.style.display = 'flex';
  logoEl.innerHTML = `<img src="${c.logo}" alt="${c.name}" onerror="this.onerror=null; this.src='${fallbackLogo}';"/>`;
  document.getElementById('nowName').textContent = c.name;
  document.getElementById('theaterBtn').style.display = 'flex';
  document.getElementById('vidOverlay').style.display = 'none';
  
  const iframePlayer = document.getElementById('embedPlayer');
  const plyrWrapper = document.getElementById('plyrWrapper');
  const hlsPlayer = document.getElementById('hlsPlayer');

  if (hlsInstance) {
    hlsInstance.destroy();
    hlsInstance = null;
  }
  
  hlsPlayer.pause();
  hlsPlayer.src = "";
  plyrWrapper.style.display = "none";
  iframePlayer.style.display = "none";
  iframePlayer.src = "";

  startActualStream(c);
}

function showSkeleton() { document.getElementById('skeletonLoader').classList.add('active'); }
function hideSkeleton() { document.getElementById('skeletonLoader').classList.remove('active'); }

function startActualStream(c) {
  showSkeleton();
  const iframePlayer = document.getElementById('embedPlayer');
  const plyrWrapper = document.getElementById('plyrWrapper');
  const hlsPlayer = document.getElementById('hlsPlayer');

  if (c.stream.includes('.m3u8')) {
    iframePlayer.removeAttribute('sandbox');
    plyrWrapper.style.display = "block";
    initPlyr(); 
    
    if (Hls.isSupported()) {
      hlsInstance = new Hls();
      hlsInstance.loadSource(c.stream);
      hlsInstance.attachMedia(hlsPlayer);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
        hlsPlayer.play().catch(() => {});
        hideSkeleton();
      });
      hlsInstance.on(Hls.Events.ERROR, function() { hideSkeleton(); });
    } else if (hlsPlayer.canPlayType('application/vnd.apple.mpegurl')) {
      hlsPlayer.src = c.stream;
      hlsPlayer.play().catch(() => {});
      hideSkeleton();
    }
  } else {
    iframePlayer.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms');
    iframePlayer.style.display = "block";
    iframePlayer.src = c.stream; 
    iframePlayer.onload = function() { hideSkeleton(); };
    setTimeout(() => { hideSkeleton(); }, 2500);
  }
}

function toggleTheaterMode() {
  const layout = document.getElementById('mainLayout');
  const btn = document.getElementById('theaterBtn');
  const btnText = btn.querySelector('.btn-text');
  
  layout.classList.toggle('theater-active');
  btn.classList.toggle('active');
  
  if(layout.classList.contains('theater-active')) {
    if(btnText) btnText.textContent = "Normal";
  } else {
    if(btnText) btnText.textContent = "Sinema";
  }
}

function filterChannels(q){
  currentSearch = q;
  renderList();
}
